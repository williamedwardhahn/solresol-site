.cm-clear:hover { border-color: var(--rule); color: var(--rubric); }
.cm-empty { color: var(--rule); font-family: var(--display); font-size: 1.6rem; }
.cm-prons { display: flex; flex-wrap: wrap; gap: 4px; }
.cm-pron {
  font-family: var(--display); font-size: .98rem; background: transparent; color: var(--ink-2);
  border: 1px solid var(--rule-soft); border-radius: 99px; padding: 1px 9px 2px;
}
.cm-pron:hover { border-color: var(--ink-3); color: var(--ink); }
.cm-pron[aria-pressed="true"] { background: var(--ink); color: var(--paper-raised); border-color: var(--ink); }
.cm-search-wrap { position: relative; margin-top: auto; }
.cm-search { font-size: 1rem; padding: 5px 2px; border-bottom-width: 1px; }
.cm-results {
  position: absolute; left: -6px; right: -6px; top: calc(100% + 4px); z-index: 5;
  list-style: none; margin: 0; padding: 4px 0; max-height: 300px; overflow-y: auto;
  background: var(--paper-raised); border: 1px solid var(--ink-2); box-shadow: var(--shadow);
}
.cm-hit {
  display: grid; grid-template-columns: auto 1fr; gap: 0 8px; align-items: center; width: 100%;
  text-align: left; background: none; border: 0; padding: 6px 10px; color: var(--ink);
}
.cm-hit:hover, .cm-hit:focus-visible { background: var(--paper-sunk); }
.cm-hit b { font-family: var(--display); font-weight: 400; font-size: 1.12rem; }
.cm-hit span:last-child {
  grid-column: 1 / -1; font-size: .85rem; color: var(--ink-3); font-style: italic; line-height: 1.25;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.cm-hit .swatches i { width: 8px; height: 8px; }
.cm-nohit { padding: 6px 10px; color: var(--ink-3); font-style: italic; font-size: .92rem; }

.cm-inflect { display: flex; flex-wrap: wrap; justify-content: center; align-items: end; gap: 14px 28px; margin: 22px 0 18px; }
.cm-ctl { display: grid; gap: 4px; }
.cm-ctl-label { font-family: var(--sc); letter-spacing: .1em; font-size: .85rem; color: var(--ink-3); }
.cm-tense { min-width: 15rem; font-family: var(--text); border-bottom-width: 1px; padding: 6px 2px; }
.cm-seg { flex-wrap: wrap; }
.cm-seg .seg-btn:disabled { color: var(--rule); cursor: default; }

.cm-result { text-align: center; }
.cm-words { list-style: none; margin: 4px 0 14px; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 16px 6px; }
.cm-w {
  display: grid; justify-items: center; gap: 3px; padding: 0 10px; min-width: 4rem;
  animation: tr-rise .35s var(--ease) both; animation-delay: calc(var(--i, 0) * 50ms);
  transition: transform .2s var(--ease);
}
.cm-w-sol { background: none; border: 0; padding: 0; font-family: var(--display); font-size: clamp(1.6rem, 4vw, 2.3rem); line-height: 1.1; color: var(--ink); }
.cm-w-sol:hover { color: var(--rubric); }

@media (max-width: 640px) {

/* Chapter IV — Learn, the School. A grammar book of 1866 that you can

.school { --ln-measure: 44rem; }
.school kbd {

  background: var(--paper-raised); border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 3px;
}

.ln-kicker {
  font-family: var(--sc); letter-spacing: .14em; color: var(--rubric); font-size: .88rem; margin: 0 0 4px;

/* a Solresol word written as a link into its page */

}

/* the ▶ that says an example */
.ln-say {

}
.ln-slot.is-filled { border: 0; background: var(--c); color: #fffdf6; animation: cell-in .22s var(--ease) both; }
.ln-slot.is-filled b { font-family: var(--display); font-weight: 400; font-size: 1.2rem; text-shadow: 0 1px 1px rgba(0,0,0,.25); }
.ln-slot.is-filled[style*="#f9c74f"] { color: var(--ink); }
.ln-slot.is-filled[style*="#f9c74f"] b { text-shadow: none; }
.ln-compose-controls { margin-top: 14px; }

.ln-feedback { min-height: 1em; margin-top: 16px; }
.ln-verdict { font-size: 1.1rem; max-width: 36rem; margin: 0 auto 10px; text-wrap: pretty; }
.ln-verdict .ln-w { font-size: 1.1em; }
.ln-tick, .ln-cross { font-family: var(--display); font-size: 1.4rem; margin-right: 4px; }
.ln-cross { color: var(--rubric); }
.ln-unlocked {
  display: inline-block; font-family: var(--sc); letter-spacing: .08em; color: var(--rubric);
  border: 1px solid var(--rubric); padding: 4px 14px; border-radius: 2px; margin: 0 0 10px;
  animation: ln-seal .6s var(--ease) both;
}
@keyframes ln-seal { from { transform: scale(1.3) rotate(-4deg); opacity: 0; } }
.ln-exam-card.is-wrong { box-shadow: var(--shadow), inset 0 0 0 1px rgba(156, 42, 28, .25); }
.ln-exam-keys { text-align: center; }

/* ═══════════ Games ═══════════ */
.ln-games-lede { text-align: center; margin: 0 auto 18px; }
.ln-games { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 10px 26px; align-items: start; }
.ln-game { margin-bottom: 18px; }
.ln-game .rubric { text-align: center; }
.ln-game .rubric-note { display: block; margin: 2px 0 0; }
.ln-game--sky { grid-column: 1 / -1; }

/* hear the colour: a watercolour box */
.school .hearing { display: grid; gap: 14px; justify-items: center; text-align: center; }
.hearing-prompt { display: grid; gap: 4px; justify-items: center; }
.hearing-prompt .hint { min-height: 1.5em; }
.hearing-pans {
  display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; width: 100%; max-width: 440px;
  padding: 10px; background: var(--paper-sunk); border: 1px solid var(--ink-2); border-radius: 6px;
  box-shadow: inset 0 2px 6px rgba(34, 27, 20, .15);
}
.hearing-pan { display: grid; justify-items: center; gap: 4px; padding: 0; background: none; border: 0; }
.hearing-pan i {
  display: block; width: 100%; aspect-ratio: 1 / 1.25; border-radius: 40% 40% 34% 34% / 30% 30% 22% 22%;
  background: radial-gradient(120% 90% at 35% 25%, rgba(255,255,255,.35), transparent 45%), var(--c);
  box-shadow: inset 0 -5px 8px rgba(0,0,0,.18), 0 1px 0 rgba(255,255,255,.6);
  transition: transform .15s var(--ease);
}
.hearing-pan span { font-family: var(--display); font-size: .92rem; color: var(--ink-3); opacity: 0; transition: opacity .2s; }
.hearing.is-answered .hearing-pan span { opacity: 1; }
.hearing-pan:hover i { transform: translateY(-2px); }
.hearing-pan.is-answer i { outline: 2px solid var(--ink); outline-offset: 2px; }
.hearing-pan.is-wrong i { outline: 2px dashed var(--rubric); outline-offset: 2px; }
.hearing-score { font-family: var(--sc); letter-spacing: .08em; color: var(--ink-3); min-height: 1.4em; margin: 0; }

/* the mirror */
.ln-mini-keys { display: flex; justify-content: center; gap: 4px; margin: 4px 0 14px; flex-wrap: wrap; }
.ln-mini-key {
  min-width: 42px; padding: 5px 6px 6px; border: 0; border-radius: 3px; background: var(--c); color: #fffdf6;
  font-family: var(--display); font-size: 1rem; box-shadow: inset 0 -3px 0 rgba(0,0,0,.18);
}
.ln-mini-key[style*="#f9c74f"] { color: var(--ink); }
.ln-mini-key:active { transform: translateY(1px); }
.ln-mini-key--clear { background: var(--paper-raised); color: var(--ink-2); border: 1px solid var(--rule); box-shadow: none; }
.school .mirror { display: grid; gap: 4px; justify-items: center; }
.school .mirror-strip { display: grid; justify-items: center; gap: 4px; }
.school .mirror-blocks { display: flex; gap: 4px; }
.school .mirror-block {
  min-width: 50px; padding: 6px 8px; text-align: center; background: var(--c); color: #fffdf6; border-radius: 2px;
  font-family: var(--display); font-size: 1.1rem; text-shadow: 0 1px 1px rgba(0,0,0,.25);
  animation: cell-in .25s var(--ease) both;
}
.school .mirror-strip--shadow .mirror-block { filter: saturate(.8) brightness(.96); }
.school .mirror-gloss { text-align: center; min-height: 1.5em; }
.school .mirror-gloss b { font-family: var(--display); font-weight: 400; font-size: 1.25rem; border-bottom: 1px dotted var(--ink-3); }
.school .mirror-gloss b:hover { color: var(--rubric); }
.school .mirror-gloss i { color: var(--ink-2); margin-left: 6px; }
.school .mirror-line { display: flex; align-items: center; gap: 10px; width: min(100%, 320px); color: var(--ink-3); font-family: var(--sc); font-size: .78rem; letter-spacing: .12em; }
.school .mirror-line::before, .school .mirror-line::after { content: ''; flex: 1; border-top: 1px dashed var(--ink-3); }
.ln-mirror-ex { justify-content: center; margin: 14px 0 0; }

/* discover */
.school .discovery { text-align: center; }
.school .disc-q { font-style: italic; color: var(--ink-2); }
.school .disc-row { display: grid; gap: 8px; margin: 6px 0 12px; }
.school .disc-word {
  display: grid; grid-template-columns: auto auto 1fr; align-items: baseline; gap: 12px; text-align: left;
  padding: 6px 4px; border-bottom: 1px solid var(--rule-soft);
}
.school .disc-play { width: 28px; height: 28px; border-radius: 50%; border: 0; background: var(--ink); color: var(--paper-raised); font-size: .68rem; align-self: center; }
.school .disc-play:hover { background: var(--rubric); }
.school .disc-word b { font-family: var(--display); font-weight: 400; font-size: 1.3rem; border-bottom: 1px dotted var(--ink-3); }
.school .disc-word b:hover { color: var(--rubric); }
.school .disc-word i { color: var(--ink-3); font-size: .95rem; }
.school .disc-answer { font-size: 1.08rem; animation: ln-leaf .4s var(--ease) both; }
.school .disc-answer b { font-family: var(--display); font-weight: 400; font-size: 1.3rem; box-shadow: inset 0 -5px 0 var(--c); }

/* fading */
.school .fading-title { display: none !important; }
.school .fading-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.school .ghost {
  font-family: var(--display); font-size: 1.2rem; padding: 4px 14px 5px; background: transparent;
  border: 1px dashed var(--ink-3); border-radius: 99px; color: var(--ink); transition: opacity .6s, border-color .2s;
}
.school .ghost:hover { opacity: 1 !important; border-style: solid; border-color: var(--ink-2); }
.school .fading .hint { text-align: center; }

/* the sky: a star atlas engraved on the page */
.ln-sky {
  max-width: 640px; margin: 0 auto;
  position: relative; border-radius: 4px; overflow: hidden;
  background:
    repeating-radial-gradient(circle at 50% 50%, transparent 0 46px, rgba(75, 64, 52, .16) 46px 47px),
    radial-gradient(circle at 50% 50%, var(--paper-raised), var(--paper-sunk));
  border: 1px solid var(--rule);
}
.ln-sky canvas { display: block; cursor: crosshair; }
.ln-sky .sky-hint { display: none; }

/* ═══════════ History ═══════════ */
.ln-history-head { text-align: center; max-width: 42rem; margin: 0 auto 26px; }
.ln-history-head .lede { margin: 6px auto 0; }
.ln-timeline { list-style: none; margin: 0 auto; padding: 0; max-width: 54rem; position: relative; }
.ln-timeline::before {
  content: ''; position: absolute; left: 8.2rem; top: 10px; bottom: 10px; width: 0;
  border-left: 1px solid var(--ink-2); box-shadow: 3px 0 0 -2px var(--rule);
}
.ln-event { display: grid; grid-template-columns: 7rem 1fr; gap: 0 2.6rem; padding: 0 0 26px; position: relative; }
.ln-event::before {
  content: ''; position: absolute; left: calc(8.2rem - 5px); top: .9rem; width: 9px; height: 9px;
  background: var(--paper); border: 1.5px solid var(--rubric); transform: rotate(45deg);
}
.ln-event--big::before { background: var(--rubric); }
.ln-year {
  font-family: var(--display); font-style: italic; font-size: 2.3rem; line-height: 1; text-align: right; color: var(--ink);
  font-variant-numeric: oldstyle-nums; padding-top: .15rem;
}
.ln-event--big .ln-year { font-size: 2.9rem; color: var(--rubric); }
.ln-event-body h3 { font-family: var(--sc); font-size: 1.15rem; letter-spacing: .08em; color: var(--rubric); margin: .45rem 0 6px; }
.ln-event-body p { max-width: 40rem; hyphens: auto; text-wrap: pretty; margin-bottom: 10px; }
.ln-event-art {
  margin: 4px 0 6px; display: inline-grid; justify-items: center; gap: 4px; padding: 12px 18px 8px;
  background: var(--paper-raised); border: 1px solid var(--ink-2); outline: 1px solid var(--ink-2); outline-offset: 3px;
}
.ln-event-art figcaption { font-family: var(--sc); letter-spacing: .08em; color: var(--ink-3); font-size: .8rem; }
.ln-art-staff svg { height: 90px; width: auto; max-width: 100%; }
.ln-art-fan .fan { width: 190px; height: auto; }
.ln-art-script .script-word { gap: 6px; color: var(--ink); }
.ln-art-script .glyph { width: 2.4rem; height: 2.4rem; }
.ln-art-medal {
  width: 104px; height: 104px; border-radius: 50%; display: grid; place-content: center; text-align: center;
  border: 2px solid var(--ink-2); box-shadow: inset 0 0 0 5px var(--paper-raised), inset 0 0 0 6px var(--ink-3);
  background: radial-gradient(circle at 35% 30%, #fffaf0, var(--paper-sunk));
}
.ln-art-medal span { font-family: var(--display); font-size: 1.6rem; line-height: 1; }
.ln-art-medal small { font-family: var(--sc); letter-spacing: .12em; color: var(--ink-3); }
.ln-art-paradigm { display: grid; gap: 0; justify-items: start; }
.ln-art-paradigm button {
  background: none; border: 0; padding: 1px 4px; font-family: var(--display); font-size: 1.3rem; color: var(--ink);
}
.ln-art-paradigm button:hover { color: var(--rubric); }
.ln-after { max-width: 44rem; margin: 10px auto 0; border-top: 1px solid var(--rule); padding-top: 18px; }
.ln-after dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; margin: 0 0 14px; }
.ln-after dt { font-family: var(--display); font-style: italic; font-size: 1.15rem; text-align: right; }
.ln-after dd { margin: 0; color: var(--ink-2); }
.ln-after code { font-family: var(--text); font-style: italic; }
.ln-after-strip { margin: 10px 0; opacity: .9; }
.ln-after-strip .strip { height: 8px; }

/* ═══════════ Yours ═══════════ */
.ln-yours-head { text-align: center; margin: 0 auto 22px; max-width: 40rem; }
.ln-yours-head .lede { margin: 6px auto 0; }
.ln-yours { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 8px 44px; }
.ln-ysec { border-top: 2px solid var(--ink-2); padding: 12px 0 22px; min-width: 0; }
.ln-ysec--wide { grid-column: 1 / -1; }
.ln-list, .ln-sentences, .ln-memory, .ln-resets, .ln-exam-summary { list-style: none; margin: 0; padding: 0; }
.ln-list li {
  display: grid; grid-template-columns: auto auto 1fr auto; align-items: center; gap: 10px;
  padding: 6px 0; border-bottom: 1px solid var(--rule-soft);
}
.ln-list .ln-w { font-size: 1.2rem; justify-self: start; }
.ln-list-gloss { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.ln-x { background: none; border: 0; color: var(--ink-3); font-size: 1.2rem; padding: 2px 6px; border-radius: 3px; }
.ln-x:hover { color: var(--rubric); }
.ln-sentences li { padding: 10px 0; border-bottom: 1px solid var(--rule-soft); }
.ln-sent-strip .strip { height: 8px; }
.ln-sent-name { font-family: var(--sc); letter-spacing: .06em; margin: 6px 0 0; }
.ln-sent-name small { color: var(--ink-3); font-family: var(--text); letter-spacing: 0; margin-left: 6px; }
.ln-sent-words { margin: 0 0 6px; display: flex; flex-wrap: wrap; gap: 2px 10px; }
.ln-sent-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ln-memory { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 2px 26px; margin-bottom: 10px; }
.ln-memory li { display: grid; grid-template-columns: minmax(0, 1fr) 70px; align-items: center; gap: 10px; padding: 4px 0; border-bottom: 1px solid var(--rule-soft); }
.ln-memory .ln-w { justify-self: start; overflow: hidden; text-overflow: ellipsis; max-width: 100%; white-space: nowrap; }
.ln-meter { height: 5px; background: var(--rule-soft); border-radius: 3px; overflow: hidden; }
.ln-meter i { display: block; height: 100%; background: var(--ink-2); border-radius: 3px; }
.ln-exam-summary li { display: flex; align-items: baseline; gap: 10px; padding: 4px 0; border-bottom: 1px solid var(--rule-soft); }
.ln-es-num { font-family: var(--display); font-style: italic; width: 2rem; color: var(--rubric); }
.ln-es-count { margin-left: auto; font-family: var(--sc); letter-spacing: .06em; color: var(--ink-3); font-size: .9rem; }
.ln-mq-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 12px; color: var(--ink-2); }
.ln-resets li { padding: 5px 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ln-confirm { font-style: italic; color: var(--rubric); }

/* ═══════════ the micro-quiz toast (mounted by the shell, on every page) ═══════════ */
.mq {
  position: fixed; right: 20px; bottom: 20px; z-index: 40; width: min(360px, calc(100vw - 32px));
  background: var(--paper-raised); color: var(--ink);
  border: 1px solid var(--ink-2); outline: 1px solid var(--ink-2); outline-offset: 3px;
  box-shadow: 0 18px 40px -18px rgba(34, 27, 20, .55);
  padding: 12px 16px 10px; font-size: 1rem;
  animation: mq-in .35s var(--ease) both;
}
.mq.is-leaving { animation: mq-out .26s ease both; }
@keyframes mq-in { from { opacity: 0; transform: translateY(14px); } }
@keyframes mq-out { to { opacity: 0; transform: translateY(10px); } }
.mq-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.mq-title { font-family: var(--sc); letter-spacing: .12em; color: var(--rubric); font-size: .85rem; }
.mq-close { background: none; border: 0; font-size: 1.4rem; line-height: 1; color: var(--ink-3); padding: 0 4px; }
.mq-close:hover { color: var(--ink); }
.mq-prompt { margin: 0 0 10px; line-height: 1.4; }
.mq-prompt b { font-family: var(--display); font-weight: 400; font-size: 1.15em; }
.mq-options { display: grid; gap: 5px; }
.mq-opt {
  text-align: left; padding: 6px 10px; background: var(--paper); border: 1px solid var(--rule); border-radius: var(--radius);
  font-size: .95rem; line-height: 1.3;
}
.mq-opt:not(:disabled):hover { border-color: var(--ink-2); }
.mq-opt:disabled { cursor: default; }
.mq-opt.is-right { border-color: var(--ink); box-shadow: inset 3px 0 0 var(--ink); }
.mq-opt.is-wrong { border-color: var(--rubric); color: var(--rubric); text-decoration: line-through; }
.mq-result { min-height: 1.2em; margin: 6px 0 2px; font-style: italic; color: var(--ink-2); font-size: .92rem; }
.mq-foot { display: flex; justify-content: space-between; gap: 10px; border-top: 1px solid var(--rule-soft); padding-top: 6px; }
.mq-link { background: none; border: 0; padding: 2px 0; font-family: var(--sc); letter-spacing: .06em; font-size: .85rem; color: var(--ink-3); }
.mq-link:hover { color: var(--rubric); }
.mq.is-right { outline-color: var(--ink); }
.mq.is-wrong { outline-color: var(--rubric); }

/* ═══════════ narrow pages ═══════════ */
@media (max-width: 860px) {
  .ln-intro { grid-template-columns: 1fr; }
  .ln-intro-fig { order: -1; }
  .ln-intro-fig .fan { width: min(70%, 260px); }
  .ln-nt-head { display: none; }
  .ln-nt-row {
    grid-template-columns: 1.6rem 132px minmax(0, 1fr) auto;
    grid-template-areas: "num hand name name" "num hand stroke staff" "num hand pitch braille";
    gap: 2px 12px; padding: 10px 4px;
  }
  .ln-nt-num { grid-area: num; font-size: 1.5rem; align-self: start; }
  .ln-nt-hand { grid-area: hand; }
  .ln-nt-name { grid-area: name; }
  .ln-nt-stroke { grid-area: stroke; }
  .ln-nt-staff { grid-area: staff; justify-self: end; }
  .ln-nt-pitch { grid-area: pitch; }
  .ln-nt-braille { grid-area: braille; justify-self: end; font-size: 1.6rem; }
  .ln-nt-stroke .glyph { width: 1.8rem; height: 1.8rem; }
  .ln-nt-staff .ln-nt-staffsvg { width: 2.8rem; }
  .ln-nt-name small { display: none; }
}

@media (max-width: 560px) {
  .school-tabs { justify-content: space-between; gap: 2px 8px; }
  .school-tabs .tab { font-size: .98rem; }
  .ln-nt-row { grid-template-columns: 1.3rem 104px minmax(0, 1fr) auto; }
  .ln-nt-name b { font-size: 1.7rem; }
  .ln-table { font-size: .93rem; }
  .ln-table th, .ln-table td { padding: 6px 6px; }
  .ln-keys-ex { white-space: normal; }
  .ln-keytable td:nth-child(2) { font-size: .88rem; }
  /* the tense table becomes a list of entries */
  .ln-tenses thead { display: none; }
  .ln-tenses tr { display: grid; grid-template-columns: auto 1fr auto; gap: 0 10px; padding: 8px 0; border-bottom: 1px solid var(--rule-soft); }
  .ln-tenses td { border: 0; padding: 0; }
  .ln-tenses td:nth-child(3) { display: none; }
  .ln-tenses td:nth-child(4) { grid-column: 1 / 3; }
  .ln-tenses td:last-child { grid-row: 1 / 3; grid-column: 3; align-self: center; }
  .ln-tenses tbody tr:last-child td { border: 0; }
  .ln-paradigm td:nth-child(3), .ln-paradigm th:nth-child(3) { display: none; }
  .ln-ex { padding: 10px 10px 4px; gap: 10px; }
  .ln-ex-word .ln-w { font-size: 1.3rem; }
  .ln-mirror-pair { grid-template-columns: auto minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; }
  .ln-rung { padding: 8px 2px; }
  .ln-rung-title { font-size: .74rem; }
  .ln-rung-pips { gap: 1px; }
  .ln-rung-pips i { width: 4px; height: 4px; }
  .ln-rung-lock { display: none; }
  .ln-options--words { grid-template-columns: 1fr; }
  .ln-exam-card { padding-left: 12px; padding-right: 12px; min-height: 0; }
  .ln-notekey { flex-basis: 44px; }
  .ln-mini-keys { gap: 3px; }
  .ln-mini-key { min-width: 0; flex: 1 1 0; padding-left: 2px; padding-right: 2px; font-size: .92rem; }
  .ln-mini-keys { flex-wrap: nowrap; }
  .ln-notekey kbd { display: none; }
  .ln-slot { width: 48px; height: 44px; }
  .ln-timeline::before { left: .35rem; }
  .ln-event { grid-template-columns: 1fr; padding-left: 1.6rem; }
  .ln-event::before { left: calc(.35rem - 4px); top: .7rem; }
  .ln-year { text-align: left; font-size: 2rem; }
  .ln-event--big .ln-year { font-size: 2.3rem; }
  .ln-event-body h3 { margin-top: 2px; }
  .ln-event-art { max-width: 100%; }
  .ln-list li { grid-template-columns: auto minmax(0, 1fr) auto; }
  .ln-list li .swatches { display: none; }
  .mq { right: 16px; left: 16px; bottom: 16px; width: auto; }
}

      get notes()    { return seq.items; },
      get length()   { return seq.length; },
      get key()      { return seq.items.join(''); },       // "domisol"
      get text()     { return cap(self.key); },            // "Domisol"
      get meaning()  { return meaningOf(self.key); },
      get family()   { return semanticKey(seq.items); },
      get opposite() { return reverse(seq.items); },       // notes, reversed

      add:        (n)  => (seq.add(n), self),
      removeLast: ()   => (seq.removeLast(), self),
      set:        (ns) => (seq.set(ns), self),
      clear:      ()   => (seq.clear(), self),
    };
    return self;
  }

  // Build a Word from written text: Word.from("Domisol").
  Word.from = (text) => Word(parse(text));
  return { Word };
})();

// === lang/phrase.js ===
const __m_lang_phrase = (() => {
  const { sequence } = __m_live_sequence;

  // A Phrase — a live sequence of Words.
  //
  // The same behavior as a Word, one size up. Its reading is its words'
  // meanings in order. (Grammar-aware translation can layer on later
  // without a new architecture — a Phrase is just a bigger Word.)

  function Phrase(words = []) {
    const seq = sequence(words);

    const self = {
      watch: seq.watch,
      get words()  { return seq.items; },
      get length() { return seq.length; },
      get text()   { return seq.items.map(w => w.text).join(' '); },
      get gloss()  { return seq.items.map(w => w.meaning || '·').join(' '); },

      add:        (w)  => (seq.add(w), self),
      removeLast: ()   => (seq.removeLast(), self),
      set:        (ws) => (seq.set(ws), self),
      clear:      ()   => (seq.clear(), self),
    };
    return self;
  }
  return { Phrase };
})();

// === live/bus.js ===
const __m_live_bus = (() => {
  // The bus — how modules speak without touching each other.
  //
  // A word committed anywhere is announced here; any module may listen.
  // Kept tiny on purpose: this is the whole nervous system.

  const channels = new Map();

  function on(type, fn) {
    if (!channels.has(type)) channels.set(type, new Set());
    channels.get(type).add(fn);
    return () => channels.get(type)?.delete(fn);
  }

  function emit(type, detail) {
    channels.get(type)?.forEach((fn) => fn(detail));
  }
  return { on, emit };
})();

// === memory/strength.js ===
const __m_memory_strength = (() => {
  // strength — the pure core of Memory (the number behind The Fading).
  //
  // Familiarity grows with each encounter; it then decays with the time
  // since the word was last seen. No clock, no storage — you pass the
  // moment in — so it is fully testable.

  function familiarity(count) {
    return 1 - Math.pow(0.6, count);          // 0, 0.4, 0.64, 0.78, …
  }

  function decay(elapsedMs, halfLifeMs) {
    if (elapsedMs <= 0) return 1;                 // never brighter than fresh
    return Math.pow(0.5, elapsedMs / halfLifeMs);
  }

  function strength(entry, at, halfLifeMs) {
    if (!entry || entry.last == null) return 0;
    const s = familiarity(entry.count) * decay(at - entry.last, halfLifeMs);
    return Math.max(0, Math.min(1, s));           // clamped to 0..1
  }
  return { familiarity, decay, strength };
})();

// === memory/memory.js ===
const __m_memory_memory = (() => {
  const { live } = __m_live_live;
  const { on } = __m_live_bus;
  const { strength } = __m_memory_strength;

  // Memory — the medium remembers you.
  //
  // One persisted live value: for every word you have met, when you last
  // met it and how many times. From that we derive a *strength* that
  // decays with time — the number behind The Fading. Everything in learn/
  // reads this; nobody writes their own copy.

  const KEY = 'solresol:memory';
  const HALF_LIFE_MS = 1000 * 60 * 60 * 36; // memory half-life ~36h of not seeing a word

  function createMemory() {
    const store = live(loadMem());

    function record(wordKey, channel = 'keyboard') {
      if (!wordKey) return;
      const now = Date.now();
      const data = { ...store.get() };
      const prev = data[wordKey] || { count: 0, first: now, channels: [] };
      data[wordKey] = {
        count: prev.count + 1,
        first: prev.first,
        last: now,
        channels: [...new Set([...(prev.channels || []), channel])],
      };
      store.set(data);
      saveMem(data);
    }

    // Strength 0..1: grows with encounters, decays since last seen.
    const strengthOf = (wordKey, at = Date.now()) =>
      strength(store.get()[wordKey], at, HALF_LIFE_MS);

    const known    = () => Object.keys(store.get());
    const fading    = (lo = 0.12, hi = 0.72) =>
      known().filter((k) => { const s = strengthOf(k); return s > lo && s < hi; });

    // Any module that uses a word just announces it; memory listens.
    on('word:used', ({ key, channel }) => record(key, channel));

    return { watch: store.watch, record, strengthOf, known, fading,
             get: store.get, forget() { store.set({}); saveMem({}); } };
  }

  function loadMem() {
    try { return JSON.parse(localStorage.getItem(KEY)) || {}; }
    catch { return {}; }
  }
  function saveMem(data) {
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch { /* private mode */ }
  }
  return { createMemory };
})();

// === voices/color.js ===
const __m_voices_color = (() => {
  const { note, NOTES } = __m_dictionary_notes;

  // The Colour voice — a note as its place in the rainbow.
  const color = {
    name: 'color',
    label: 'Colour',
    mount() {
      const el = document.createElement('div');
      el.className = 'cell cell--color';
      return el;
    },
    update(el, n) {
      el.style.background = note(n).color;
      el.title = n;
    },
    // the ear: a colour (hex or name) → a note
    read(value) {
      const v = String(value).toLowerCase();
      if (note(v)) return v;
      return (NOTES.find((x) => x.color.toLowerCase() === v) || {}).name || null;
    },
  };
  return { color };
})();

// === voices/solfege.js ===
const __m_voices_solfege = (() => {
  const { isNote } = __m_dictionary_notes;

  // The Solfège voice — a note as its written syllable.
  const solfege = {
    name: 'solfege',

// === graphics/graphics.js ===
const __m_graphics_graphics = (() => {
  const { NOTES, note } = __m_dictionary_notes;

  // The original graphics, redrawn as SVG in the canonical colours:
  // the half-fan of the seven notes (the project's mark), the staff with
  // coloured note heads, and Sudre's own written script — one stroke per
  // note. Pure string builders, so any view can drop them into markup.

  // ── the fan ──────────────────────────────────────────────────────────
  // Seven wedges across a half disc, do (left) to si (right).
  function fanSVG({ labels = true, title = 'The seven notes of Solresol' } = {}) {
    const cx = 100, cy = 100, r = 96, parts = [];
    NOTES.forEach((n, i) => {
      const a0 = Math.PI - (i / 7) * Math.PI, a1 = Math.PI - ((i + 1) / 7) * Math.PI;
      const p = (a, rad) => `${(cx + Math.cos(a) * rad).toFixed(2)},${(cy - Math.sin(a) * rad).toFixed(2)}`;
      parts.push(`<path d="M${cx},${cy} L${p(a0, r)} A${r},${r} 0 0 1 ${p(a1, r)} Z" fill="${n.color}"/>`);
      if (labels) {
        const am = (a0 + a1) / 2, [x, y] = p(am, r * 0.68).split(',');
        parts.push(`<text x="${x}" y="${y}" class="fan-label" text-anchor="middle" dominant-baseline="middle">${n.name.toUpperCase()}</text>`);
      }
    });
    return `<svg class="fan" viewBox="0 0 200 104" role="img" aria-label="${title}">${parts.join('')}</svg>`;
  }

  // ── the staff ────────────────────────────────────────────────────────
  // Treble staff, do = middle C on a ledger line below, si = B on the middle
  // line. `words` is an array of note arrays; a gap separates words.
  function staffSVG(words, { labels = false, height = 84, cls = 'staff-svg', compact = false } = {}) {
    const list = Array.isArray(words[0]) ? words : [words];
    const line = 8, top = 16, bottom = top + line * 4;             // five lines
    const yOf = (n) => bottom + line - note(n).step * (line / 2);  // do sits one space below
    const stepX = 22, gapX = 18;
    let x = 18;
    const heads = [];
    list.forEach((notes, wi) => {
      if (wi) x += gapX;
      for (const n of notes) {
        const nt = note(n); if (!nt) continue;
        const y = yOf(n);
        if (n === 'do') heads.push(`<line x1="${x - 10}" x2="${x + 10}" y1="${y}" y2="${y}" class="staff-ledger"/>`);
        heads.push(`<ellipse cx="${x}" cy="${y}" rx="6.6" ry="4.9" transform="rotate(-18 ${x} ${y})" fill="${nt.color}" class="staff-head"/>`);
        if (labels) heads.push(`<text x="${x}" y="${bottom + 26}" class="staff-label" text-anchor="middle">${nt.name}</text>`);
        x += stepX;
      }
    });
    if (compact) {   // one note in a small square: crop tight around the staff
      return `<svg class="${cls}" viewBox="4 10 36 52" role="img" aria-label="${list[0].join(' ')} on the staff">${[0,1,2,3,4].map((i) =>
        `<line x1="4" x2="40" y1="${top + i * line}" y2="${top + i * line}" class="staff-line"/>`).join('')}${heads.join('')}</svg>`;
    }
    const w = Math.max(x + 4, 60);
    const lines = [0, 1, 2, 3, 4].map((i) =>
      `<line x1="4" x2="${w - 4}" y1="${top + i * line}" y2="${top + i * line}" class="staff-line"/>`).join('');
    const h = labels ? height + 10 : height;
    return `<svg class="${cls}" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="staff: ${list.map((ns) => ns.join(' ')).join(', ')}">${lines}${heads.join('')}</svg>`;
  }

  // ── Sudre's script ───────────────────────────────────────────────────
  // One stroke per note, drawn in a 20×20 box: do ○, re |, mi ∩, fa ╲,
  // sol —, la ⊂, si ╱. (After the plates in Sudre's Langue musicale universelle.)
  const GLYPH_PATHS = {
    do:  'M10,2.5 a7.5,7.5 0 1,0 0.01,0 Z',
    re:  'M10,2 L10,18',
    mi:  'M3,16 A7,7 0 0,1 17,16',
    fa:  'M3.5,3.5 L16.5,16.5',
    sol: 'M2.5,10 L17.5,10',
    la:  'M16,3.5 A7.5,7.5 0 0,0 16,16.5',
    si:  'M3.5,16.5 L16.5,3.5',
  };

  function glyphSVG(n, { color = true, cls = 'glyph' } = {}) {
    const nt = note(n); if (!nt) return '';
    return `<svg class="${cls}" viewBox="0 0 20 20" role="img" aria-label="${nt.name} in Sudre's script"><path d="${GLYPH_PATHS[nt.name]}" fill="none" stroke="${color ? nt.color : 'currentColor'}" stroke-width="2.2" stroke-linecap="round"/></svg>`;
  }

  // A word written in the script: its strokes side by side.
  function scriptSVG(notes, opts = {}) {
    return `<span class="script-word">${notes.map((n) => glyphSVG(n, opts)).join('')}</span>`;
  }

  // A sentence as a strip of light: one band per note, a gap per word.
  function colorStripSVG(words, { height = 28 } = {}) {
    const list = Array.isArray(words[0]) ? words : [words];
    let x = 0; const rects = [];
    list.forEach((notes, wi) => {
      if (wi) x += 6;
      for (const n of notes) { rects.push(`<rect x="${x}" y="0" width="14" height="${height}" fill="${note(n).color}"/>`); x += 14; }
    });
    return `<svg class="strip" viewBox="0 0 ${Math.max(x, 1)} ${height}" preserveAspectRatio="none" role="img" aria-label="the sentence as colour">${rects.join('')}</svg>`;
  }
  return { fanSVG, staffSVG, GLYPH_PATHS, glyphSVG, scriptSVG, colorStripSVG };
})();

  const { HAND_ART } = __m_assets_assets;

  // The Hand voice — a note as Curwen's hand sign, from the original
  // engraved plates (do: the strong or firm tone … si: the piercing tone).
  const hand = {
    name: 'hand',
    label: 'Hand',
    mount() {
      const el = document.createElement('div');

      el.firstChild.alt = `hand sign for ${note(n).name}`;
    },
  };
  return { hand };
})();

// === compose/sentence.model.js ===
const __m_compose_sentence_model = (() => {
  const { TENSE_MARKERS } = __m_dictionary_grammar;

  // The pure core of Compose — no DOM.
  //
  // A sentence is a melody: `schedule` gives each word's start time; `gloss`
  // reads the sentence's meaning through an index; `guessRoles` makes a
  // modest guess at each word's part in the sentence. All pure, all tested.

  function schedule(lengths, wordGap = 0.28, breath = 0.35) {
    const offsets = [];
    let t = 0;
    for (const len of lengths) { offsets.push(t); t += len * wordGap + breath; }
    return offsets;
  }

  function sentenceGloss(index, words) {
    // words: array of note-arrays
    return words.map((notes) => index.meaningOf(notes.join('')) || '·').join(' ');
  }

  // The seven one-note words are the little words of the language.
  const PARTICLES = { do: 'no, not', re: 'and', mi: 'or', fa: 'at, to', sol: 'if', la: 'the', si: 'yes' };

  // Sudre's personal pronouns: do + a note.
  const PRONOUNS = { dore: 'I', domi: 'you', dofa: 'he, she', dola: 'one' };

  // guessRoles(words, meaningOf?) → [{ role, detail }], one per word.
  //
  // A guess, and labelled as one: a spoken sentence carries no written
  // accents, so the part of speech can't be read off the word itself
  // (canonically an unaccented word is a verb). What we can read:
  //   · a one-note word is a particle — and `do` before a word negates it;
  //   · a doubled particle (dodo, mimi …) marks the tense of the verb after it;
  //   · do+re / do+mi / do+fa / do+la are pronouns;
  //   · otherwise Solresol keeps subject · verb · object order, so the first
  //     content word is taken as the subject, the next as the verb (or any
  //     word glossed "to …"), and what follows as the object.
  function guessRoles(words, meaningOf = () => null) {
    let seenSubject = false, seenVerb = false, verbNext = false;
    return words.map((notes, i) => {
      const key = notes.join('');
      if (notes.length === 1) {
        if (key === 'do' && i < words.length - 1) return { role: 'negation', detail: 'not' };
        return { role: 'particle', detail: PARTICLES[key] || '' };
      }
      if (TENSE_MARKERS[key]) { verbNext = true; return { role: 'tense', detail: TENSE_MARKERS[key] }; }
      if (PRONOUNS[key]) {
        if (!seenSubject && !seenVerb) { seenSubject = true; return { role: 'subject', detail: 'pronoun' }; }
        return { role: seenVerb ? 'object' : 'pronoun', detail: 'pronoun' };
      }
      const m = String(meaningOf(key) || '');
      if (verbNext || (!seenVerb && /^to\s/i.test(m))) {
        verbNext = false; seenVerb = true;
        return { role: 'verb', detail: '' };
      }
      if (!seenSubject && !seenVerb) { seenSubject = true; return { role: 'subject', detail: '' }; }
      if (!seenVerb) { seenVerb = true; return { role: 'verb', detail: '' }; }
      return { role: 'object', detail: '' };
    });
  }
  return { schedule, sentenceGloss, PARTICLES, PRONOUNS, guessRoles };
})();

// === voices/tone.js ===
const __m_voices_tone = (() => {
  const { note } = __m_dictionary_notes;
  const { schedule } = __m_compose_sentence_model;

  // The Tone voice — a note as a sound.
  //
  // The only voice you hear rather than see. One shared audio context,
  // one gentle envelope. A word plays as its notes in sequence.

  let audioCtx;
  const audio = () => (audioCtx ||= new (window.AudioContext || window.webkitAudioContext)());

  // The instrument's colour of sound — sine, triangle, sawtooth or square.
  let timbre = 'triangle';
  const TIMBRES = ['sine', 'triangle', 'sawtooth', 'square'];
  function setTimbre(t) { if (TIMBRES.includes(t)) timbre = t; }

  function playNote(name, when = 0, dur = 0.5) {
    const ac = audio();
    const t = ac.currentTime + when;
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = timbre;
    osc.frequency.value = note(name).freq;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(timbre === 'sine' ? 0.28 : timbre === 'triangle' ? 0.24 : 0.09, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(ac.destination);
    osc.start(t);
    osc.stop(t + dur + 0.05);
  }

  function playWord(word, gap = 0.32, when = 0) {
    word.notes.forEach((n, i) => playNote(n, when + i * gap));
  }

  // A sentence is a melody: each word, in turn, with a breath between.
  // The timing comes from the pure, tested `schedule`.
  function playSentence(words, wordGap = 0.28, breath = 0.35) {
    const offsets = schedule(words.map((w) => w.notes.length), wordGap, breath);
    words.forEach((w, i) => playWord(w, wordGap, offsets[i]));
    return offsets.length
      ? offsets[offsets.length - 1] + words[words.length - 1].notes.length * wordGap
      : 0;
  }

  const tone = { name: 'tone', label: 'Tone', playNote, playWord, playSentence };
  return { TIMBRES, setTimbre, playNote, playWord, playSentence, tone };
})();

const __m_site_state = (() => {
  const { live } = __m_live_live;

  // State that outlives a visit — preferences, starred words, recent words,
  // and saved sentences. Each is one live value mirrored to localStorage,
  // so a view just watches it and never keeps a second copy.

  function persisted(key, initial) {
    let start = initial;

const __m_site_router = (() => {
  const { live } = __m_live_live;

  // The router — where you are, as a live value read from the address.
  //
  //   #/                       → { view: 'play' }
  //   #/dictionary/families    → { view: 'dictionary', sub: 'families' }
  //   #/word/Domisol           → { view: 'word', arg: 'Domisol' }  (opens the word panel)
  //   ?word=Domisol            → the old share links still open that word
  //
  // A hash router, so the single-file build works from file:// as well.

  function parseRoute(hash) {
    const [path, query = ''] = String(hash || '').replace(/^#\/?/, '').split('?');
    const parts = path.split('/').filter(Boolean).map(decodeURIComponent);
    const params = Object.fromEntries(new URLSearchParams(query));
    if (parts[0] === 'word') return { view: 'word', arg: parts[1] || '', sub: null, params };
    return { view: parts[0] || 'play', sub: parts[1] || null, arg: parts[2] || null, params };
  }

  function createRouter() {
    // Carry an old-style ?word= link into the hash, once, on arrival.
    const legacy = new URLSearchParams(location.search).get('word');
    if (legacy && !location.hash) history.replaceState(null, '', `${location.pathname}#/word/${encodeURIComponent(legacy)}`);

    const route = live(parseRoute(location.hash));
    const onHash = () => route.set(parseRoute(location.hash));
    window.addEventListener('hashchange', onHash);

    const go = (path) => {
      const next = '#/' + String(path).replace(/^#?\/?/, '');
      if (location.hash === next) onHash(); else location.hash = next;
    };

    return { route, go, destroy() { window.removeEventListener('hashchange', onHash); } };
  }
  return { parseRoute, createRouter };
})();

const __m_ui_choir = (() => {
  const { VOICES } = __m_voices_index;
  const { playNote } = __m_voices_index;

  // The Choir — a live Word shown by every Voice at once.
  //
  // One row per Voice, one column per note. When the Word changes, each
  // Voice updates only its own cells: columns are added or removed at the
  // end, surviving cells are updated in place. The grid persists, nothing
  // is rebuilt, and every watcher is released on destroy — so there is no
  // flicker and no leak, by construction.
  //
  // Options: `prefs` (a live value with a `voices` list) hides the rows a
  // person switched off; clicking any cell sounds that column's note.

  function mountChoir(host, word, { prefs = null } = {}) {
    host.classList.add('choir');
    host.textContent = '';

    const rows = VOICES.map((voice) => {
      const row = document.createElement('div');
      row.className = 'voice-row';
      row.dataset.voice = voice.name;

      const label = document.createElement('div');
      label.className = 'voice-label';
      label.textContent = voice.label;

      const cells = document.createElement('div');
      cells.className = 'voice-cells';

      row.append(label, cells);
      host.appendChild(row);
      return { voice, row, cells, mounted: [] };
    });

    // One listener for every cell: find the column, sound its note.
    function onClick(e) {
      const cell = e.target.closest('[data-col]');
      if (!cell) return;
      const n = word.notes[Number(cell.dataset.col)];
      if (n) playNote(n);
      host.querySelectorAll(`[data-col="${cell.dataset.col}"]`).forEach((el) => {
        el.classList.remove('cell--ring'); void el.offsetWidth; el.classList.add('cell--ring');
      });
    }
    host.addEventListener('click', onClick);

    const unwatch = word.watch((notes) => {
      for (const row of rows) reconcile(row, notes);
      host.classList.toggle('choir--empty', notes.length === 0);
    });

    const unprefs = prefs
      ? prefs.watch((p) => {
          const on = new Set(p.voices || []);
          for (const r of rows) r.row.hidden = !on.has(r.voice.name);
        })
      : () => {};

    return {
      destroy() {
        unwatch();
        unprefs();
        host.removeEventListener('click', onClick);
        host.textContent = '';
      },
    };
  }

  function reconcile({ voice, cells, mounted }, notes) {
    while (mounted.length < notes.length) {          // grow: add columns
      const el = voice.mount();
      el.dataset.col = mounted.length;
      cells.appendChild(el);
      mounted.push(el);
    }
    while (mounted.length > notes.length) {          // shrink: drop columns
      cells.removeChild(mounted.pop());
    }
    notes.forEach((n, i) => voice.update(mounted[i], n));   // update in place
  }
  return { mountChoir };
})();

// === ui/keymap.js ===
const __m_ui_keymap = (() => {
  // Home-row entry — play Solresol like an instrument and a typewriter.
  //
  // Left hand  A S D F  and right hand  J K L  play the seven notes;
  // Space (or ;, or Enter) finishes a word, like a typewriter space between
  // words. Pure data + lookups, so the mapping is tested on its own.
  //
  //   A S D F   J K L
  //   do re mi fa sol la si

  const KEY_TO_NOTE = {
    a: 'do', s: 're', d: 'mi', f: 'fa', j: 'sol', k: 'la', l: 'si',
  };

  const NOTE_TO_KEY = Object.fromEntries(
    Object.entries(KEY_TO_NOTE).map(([k, n]) => [n, k])
  );

  const COMMIT_KEYS = [' ', ';', 'Enter'];

  const noteForKey  = (key)  => KEY_TO_NOTE[String(key).toLowerCase()] || null;
  const keyForNote  = (note) => NOTE_TO_KEY[String(note).toLowerCase()] || null;
  const isCommitKey = (key)  => COMMIT_KEYS.includes(key);
  return { KEY_TO_NOTE, COMMIT_KEYS, noteForKey, keyForNote, isCommitKey };
})();

const __m_ui_keyboard = (() => {

  const { playNote } = __m_voices_index;

  //
  // Click a key, or play the home row: left hand A S D F, right hand J K L
  // sound do re mi fa sol la si; Space (or ; / Enter) finishes a word. It
  // holds no rules and knows no meanings — it just strikes notes.

  function mountKeyboard(host, word, { onCommit } = {}) {
    host.classList.add('keyboard');
    host.textContent = '';

    const keyEls = {};
    for (const n of NOTES) {
      const key = document.createElement('button');
      key.className = 'key';
      key.dataset.note = n.name;
      key.setAttribute('aria-label', `${n.name}, ${n.num}`);
      key.style.setProperty('--key-color', n.color);
      key.innerHTML =
        `<span class="key-letter">${(keyForNote(n.name) || '').toUpperCase()}</span>` +
        `<span class="key-solfege">${cap(n.name)}</span>` +
        `<span class="key-num">${n.num}</span>`;
      key.addEventListener('click', () => strike(n.name));
      key.addEventListener('mousedown', (e) => e.preventDefault());   // a clicked key doesn't steal Space
      host.appendChild(key);
      keyEls[n.name] = key;
    }

    function strike(name) {

      playNote(name);
      flash(name);
    }

    function flash(name) {

      if (isTyping(e.target)) return;                 // don't fight text fields
      if (document.body.classList.contains('has-panel')) return;   // a word's page is open over us

      const letter = noteForKey(e.key);               // home row A S D F J K L
      if (letter) { e.preventDefault(); strike(letter); return; }

      const byNum = noteByNumber(e.key);              // 1–7 still work

      strike,
      destroy() {
        window.removeEventListener('keydown', onKey);
        host.textContent = '';
      },
    };

  // was clicked with a pointer doesn't, so Space still finishes the word.
  let tabbed = false;

})();

           <span class="sent-guess">roles are a guess from word order</span>`
        : '';
      score.hidden = !words.length;
      if (words.length) {
        q('[data-strip]').innerHTML = colorStripSVG(notes);
        q('[data-staff]').innerHTML = staffSVG(notes);
      }
      host.querySelectorAll('[data-act]').forEach((b) => { b.disabled = !words.length; });
      saveForm.hidden = !words.length;
    }

    function renderSaved(list) {
      savedEl.innerHTML = list.length
        ? `<h4 class="rubric">Kept sentences</h4><ol class="sent-kept">${list.map((s, i) => `
            <li>
              <button class="sent-kept-load" data-load="${i}" title="Load it into the sentence">
                <span class="sent-kept-name">${esc(s.name)}</span>
                <span class="sent-kept-words">${s.words.map((ns) => cap(ns.join(''))).join(' ')}</span>
              </button>
              <button class="btn btn--ghost btn--small" data-del="${i}" aria-label="Forget ${esc(s.name)}">×</button>
            </li>`).join('')}</ol>`
        : '';
    }

    host.addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      if (b.dataset.i !== undefined) { ctx.openWord(sentence.words[Number(b.dataset.i)].notes); return; }
      if (b.dataset.load !== undefined) {
        const s = state.saved.get()[Number(b.dataset.load)];
        if (s) { sentence.set(s.words.map((ns) => Word(ns))); playSentence(sentence.words); }
        return;
      }
      if (b.dataset.del !== undefined) {
        const list = state.saved.get().slice(); list.splice(Number(b.dataset.del), 1); state.saved.set(list);
        return;
      }
      switch (b.dataset.act) {
        case 'play': playSentence(sentence.words); break;
        case 'undo': sentence.removeLast(); break;
        case 'clear': sentence.clear(); break;
      }
    });
    saveForm.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!sentence.length) return;
      const input = saveForm.elements.name;
      const name = input.value.trim() || sentence.words.map((w) => w.text).join(' ');
      const entry = { name, words: sentence.words.map((w) => w.notes), at: Date.now() };
      state.saved.set([entry, ...state.saved.get().filter((s) => s.name !== name)].slice(0, 40));
      input.value = '';
    });

    const unwatch = sentence.watch(render);
    const unmeanings = state.meanings.watch(() => render(sentence.words));
    const unsaved = state.saved.watch(renderSaved);
    return { destroy() { unwatch(); unmeanings(); unsaved(); host.textContent = ''; } };
  }

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  return { mountSentence };
})();

// === sense/pitch.model.js ===
const __m_sense_pitch_model = (() => {
  const { NOTES } = __m_dictionary_notes;

  // The pure core of tone-in — a heard pitch is an INTERPRETATION, not a
  // fact. `detectNote` returns the nearest note AND a confidence that falls
  // off as the pitch drifts between two notes. The card only acts on high
  // confidence — the multisensory briefs' rule: an inference is a
  // hypothesis, held with uncertainty, until it's clear.

  // Pure pitch detection (normalized autocorrelation, after cwilso's method).
  // Returns a frequency in Hz, or null for silence / no clear pitch. Pure —
  // pass a sample buffer, get a number — so it's tested on a synthetic sine.
  function autocorrelate(buf, sampleRate) {
    const SIZE = buf.length;
    let rms = 0;
    for (let i = 0; i < SIZE; i++) rms += buf[i] * buf[i];
    rms = Math.sqrt(rms / SIZE);
    if (rms < 0.01) return null;                    // too quiet

    // trim to the loud region (edges below threshold add noise)
    let r1 = 0, r2 = SIZE - 1;
    const thres = 0.2;
    for (let i = 0; i < SIZE / 2; i++) if (Math.abs(buf[i]) < thres) { r1 = i; break; }
    for (let i = 1; i < SIZE / 2; i++) if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; }
    const b = buf.slice(r1, r2);
    const n = b.length;
    if (n < 2) return null;

    const c = new Array(n).fill(0);
    for (let i = 0; i < n; i++) for (let j = 0; j < n - i; j++) c[i] += b[j] * b[j + i];

    let d = 0;
    while (d < n - 1 && c[d] > c[d + 1]) d++;        // skip the zero-lag descent
    let maxval = -1, maxpos = -1;
    for (let i = d; i < n; i++) if (c[i] > maxval) { maxval = c[i]; maxpos = i; }
    if (maxpos <= 0) return null;

    // parabolic interpolation around the peak for sub-sample accuracy
    let T0 = maxpos;
    const x1 = c[T0 - 1] || 0, x2 = c[T0] || 0, x3 = c[T0 + 1] || 0;
    const a = (x1 + x3 - 2 * x2) / 2, bb = (x3 - x1) / 2;
    if (a) T0 -= bb / (2 * a);

    return sampleRate / T0;
  }

  function detectNote(freq) {
    if (!freq || freq <= 0) return { note: null, cents: null, confidence: 0 };
    let best = NOTES[0], bestCents = Infinity;
    for (const n of NOTES) {
      const cents = 1200 * Math.log2(freq / n.freq);
      if (Math.abs(cents) < Math.abs(bestCents)) { bestCents = cents; best = n; }
    }
    const confidence = Math.max(0, 1 - Math.abs(bestCents) / 100);
    return { note: best.name, cents: Math.round(bestCents), confidence };
  }
  return { autocorrelate, detectNote };
})();

// === sense/inputs.js ===
const __m_sense_inputs = (() => {
  const { NOTES, noteByNumber, noteFromMidi } = __m_dictionary_notes;
  const { playNote } = __m_voices_index;
  const { detectNote, autocorrelate } = __m_sense_pitch_model;

  // The ears — ways the language comes IN.
  //
  // Each input feeds the same live Word by adding notes to it. A word can
  // now enter through any channel and leave through any other: sing it,
  // see its colour; play it, read its meaning. This is the founding
  // premise the project once had and lost — reclaimed.

  // Colour-in: seven wells; paint a word by colour.
  function mountColorIn(host, word) {
    host.classList.add('colorwells');
    host.textContent = '';
    for (const n of NOTES) {
      const well = document.createElement('button');
      well.className = 'well';
      well.style.background = n.color;
      well.title = n.name;
      well.setAttribute('aria-label', `paint ${n.name}`);
      well.addEventListener('click', () => { word.add(n.name); playNote(n.name); });
      host.appendChild(well);
    }
    return { destroy() { host.textContent = ''; } };
  }

  // Number-in: type "4-1-5-1" (or "4151") → a word.
  function mountNumberIn(host, word, { onCommit = null } = {}) {
    host.textContent = '';
    const input = document.createElement('input');
    input.className = 'field';
    input.inputMode = 'numeric';
    input.autocomplete = 'off';
    input.setAttribute('aria-label', 'A word as numbers, 1 to 7');
    input.placeholder = 'numbers, e.g. 1-3-5 — Enter says it';
    input.addEventListener('input', () => {
      const notes = (input.value.match(/[1-7]/g) || []).map((d) => noteByNumber(d).name);
      word.set(notes);
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && onCommit) { e.preventDefault(); onCommit(); input.value = ''; }
    });
    host.appendChild(input);
    return { destroy() { host.textContent = ''; } };
  }

  // After a pause, the word is said. Every sung or played note calls poke();
  // if `ms` pass with no new note and the word holds something, onCommit fires.
  // (After archive/src/audio/midi.js: one second of silence ends a word.)
  function silenceCommit(word, onCommit, ms = 1000) {
    let timer = 0;
    return {
      poke() {
        clearTimeout(timer);
        if (!onCommit) return;
        timer = setTimeout(() => { if (word.length) onCommit(); }, ms);
      },
      cancel() { clearTimeout(timer); },
    };
  }

  // Tone-in: sing or hum; the nearest note is added. Browser only (mic).
  function mountToneIn(host, word, { onCommit = null } = {}) {
    host.textContent = '';
    const btn = document.createElement('button');
    btn.className = 'btn btn--small';
    btn.textContent = 'Listen';
    const status = document.createElement('span');
    status.className = 'mic-status';
    status.setAttribute('aria-live', 'polite');
    host.append(btn, status);

    const pause = silenceCommit(word, onCommit);
    let listening = false, ac, analyser, raf, last = '', quietSince = 0, stream = null;

    btn.addEventListener('click', async () => {
      if (listening) { stop(); return; }
      if (!navigator.mediaDevices?.getUserMedia) { status.textContent = 'no microphone here'; return; }
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        ac = new (window.AudioContext || window.webkitAudioContext)();
        const src = ac.createMediaStreamSource(stream);
        analyser = ac.createAnalyser();
        analyser.fftSize = 2048;
        src.connect(analyser);
        listening = true; btn.setAttribute('aria-pressed', 'true'); btn.textContent = 'Stop';
        status.textContent = 'sing a note… a second of quiet says the word';
        loop();
      } catch { status.textContent = 'no microphone, or it was declined'; }
    });

    function loop() {
      const buf = new Float32Array(analyser.fftSize);
      analyser.getFloatTimeDomainData(buf);
      const freq = autocorrelate(buf, ac.sampleRate);
      const now = performance.now();
      if (freq) {
        const { note: n, confidence } = detectNote(freq);
        if (n) status.textContent = `heard ${n} · ${Math.round(confidence * 100)}%`;
        // only ACT on a confident interpretation — a hypothesis held with uncertainty
        if (n && confidence > 0.5 && (n !== last || now - quietSince > 350)) {
          word.add(n); playNote(n); last = n; pause.poke();
        }
        quietSince = now;
      } else if (now - quietSince > 200) {
        last = '';
      }
      raf = requestAnimationFrame(loop);
    }

    function stop() {
      pause.cancel();
      if (!listening) return;
      listening = false; btn.setAttribute('aria-pressed', 'false'); btn.textContent = 'Listen';
      status.textContent = '';
      cancelAnimationFrame(raf);
      stream?.getTracks().forEach((t) => t.stop());
      ac?.close();
    }
    return { destroy() { stop(); host.textContent = ''; } };
  }

  // MIDI-in: play a real instrument; notes become a word, and a second of
  // silence says it. Browser only.
  //
  // Asking for MIDI on load throws a permission prompt at someone who only
  // came to look. So it connects by itself only when the browser already
  // allows it (permission granted before); otherwise it is offered, not
  // taken. Once connected it follows devices as they are plugged in.
  function mountMidiIn(host, word, { onCommit = null } = {}) {
    host.textContent = '';
    const btn = document.createElement('button');
    btn.className = 'btn btn--small';
    btn.textContent = 'Connect MIDI';
    const status = document.createElement('span');
    status.className = 'mic-status';
    status.setAttribute('aria-live', 'polite');
    host.append(btn, status);

    const pause = silenceCommit(word, onCommit);
    let access = null, gone = false;

    if (!navigator.requestMIDIAccess) {
      btn.disabled = true;
      status.textContent = 'this browser has no MIDI';
      return { destroy() { host.textContent = ''; } };
    }

    const onMessage = ({ data }) => {
      const [cmd, key, vel] = data;
      if ((cmd & 0xf0) === 0x90 && vel > 0) {          // note-on
        const n = noteFromMidi(key);
        if (n) { word.add(n); playNote(n); pause.poke(); }
      }
    };

    function attach() {
      if (!access || gone) return;
      const inputs = [...access.inputs.values()];
      for (const input of inputs) input.onmidimessage = onMessage;
      btn.hidden = inputs.length > 0;
      status.textContent = inputs.length
        ? `listening to ${inputs.map((i) => i.name || 'a device').join(', ')} — a second of silence says the word`
        : 'no device yet — plug one in';
    }

    function connect() {
      btn.disabled = true;
      status.textContent = 'connecting…';
      navigator.requestMIDIAccess().then((a) => {
        if (gone) return;
        access = a; btn.disabled = false;
        access.onstatechange = attach;                  // hot-plug
        attach();
      }, () => {
        if (gone) return;
        status.textContent = 'MIDI access declined';
        btn.disabled = false;
      });
    }
    btn.addEventListener('click', connect);

    // auto-connect when the browser already said yes
    navigator.permissions?.query({ name: 'midi' }).then((p) => {
      if (p.state === 'granted' && !gone) connect();
    }, () => {});

    return {
      destroy() {
        gone = true;
        pause.cancel();
        if (access) {
          access.onstatechange = null;
          for (const input of access.inputs.values()) input.onmidimessage = null;
        }
        host.textContent = '';
      },
    };
  }
  return { mountColorIn, mountNumberIn, silenceCommit, mountToneIn, mountMidiIn };
})();

// === sequencer/midi.model.js ===
const __m_sequencer_midi_model = (() => {
  // The pure core of the Sequencer — no DOM, no audio.
  //
  // `timeline` lays a list of words out in time (one note per beat, a rest
  // between words); `midiFile` writes the same timeline as a standard
  // MIDI file (format 0, one track), so a sentence can leave the browser
  // and be opened in any notation program or DAW.

  // do = middle C (60) … si = B (71): the white keys of one octave.
  const MIDI_OF = { do: 60, re: 62, mi: 64, fa: 65, sol: 67, la: 69, si: 71 };

  // words: [[notes]]; tempo: notes per second; wordGap: seconds of rest.
  // → { events: [{ note, word, index, start, dur }], total }
  function timeline(words, { tempo = 2.5, wordGap = 0.5 } = {}) {
    const beat = 1 / tempo, events = [];
    let t = 0, index = 0;
    words.forEach((notes, wi) => {
      if (wi) t += wordGap;
      for (const n of notes) {
        events.push({ note: n, word: wi, index: index++, start: t, dur: beat * 0.9 });
        t += beat;
      }
    });
    return { events, total: t };
  }

  // A MIDI variable-length quantity: 7 bits per byte, high bit = "more".
  function varLen(value) {
    let v = Math.max(0, Math.round(value));
    const bytes = [v & 0x7f];
    v >>= 7;
    while (v > 0) { bytes.unshift((v & 0x7f) | 0x80); v >>= 7; }
    return bytes;
  }

  const u32 = (n) => [(n >>> 24) & 0xff, (n >>> 16) & 0xff, (n >>> 8) & 0xff, n & 0xff];
  const ascii = (s) => [...s].map((c) => c.charCodeAt(0));

  // → Uint8Array holding a complete .mid file.
  function midiFile(words, { tempo = 2.5, wordGap = 0.5, ppq = 480, velocity = 96, title = 'Solresol' } = {}) {
    const bpm = tempo * 60;                     // one note = one beat
    const ticksPerSec = ppq * tempo;
    const { events } = timeline(words, { tempo, wordGap });

    const raw = [];
    for (const e of events) {
      const on = Math.round(e.start * ticksPerSec);
      const off = on + Math.round(e.dur * ticksPerSec);
      raw.push({ tick: on, bytes: [0x90, MIDI_OF[e.note] ?? 60, velocity] });
      raw.push({ tick: off, bytes: [0x80, MIDI_OF[e.note] ?? 60, 0] });
    }
    // note-offs before note-ons at the same tick, so repeated notes re-strike
    raw.sort((a, b) => a.tick - b.tick || (a.bytes[0] === 0x80 ? -1 : 1) - (b.bytes[0] === 0x80 ? -1 : 1));

    const usPerBeat = Math.round(60000000 / bpm);
    const name = ascii(title).slice(0, 120);
    const track = [
      0x00, 0xff, 0x03, ...varLen(name.length), ...name,                       // track name
      0x00, 0xff, 0x51, 0x03, (usPerBeat >> 16) & 0xff, (usPerBeat >> 8) & 0xff, usPerBeat & 0xff, // tempo
      0x00, 0xff, 0x58, 0x04, 0x04, 0x02, 0x18, 0x08,                          // 4/4
    ];
    let last = 0;
    for (const ev of raw) {
      track.push(...varLen(ev.tick - last), ...ev.bytes);
      last = ev.tick;
    }
    track.push(0x00, 0xff, 0x2f, 0x00);                                         // end of track

    return new Uint8Array([
      ...ascii('MThd'), ...u32(6), 0x00, 0x00, 0x00, 0x01, (ppq >> 8) & 0xff, ppq & 0xff,
      ...ascii('MTrk'), ...u32(track.length), ...track,
    ]);
  }
  return { MIDI_OF, timeline, varLen, midiFile };
})();

// === sequencer/sequencer.js ===
const __m_sequencer_sequencer = (() => {
  const { note, cap } = __m_dictionary_notes;
  const { meaningOf } = __m_dictionary_dictionary;
  const { on } = __m_live_bus;
  const { playNote } = __m_voices_index;
  const { staffSVG } = __m_graphics_graphics;
  const { persisted } = __m_site_state;
  const { timeline, midiFile } = __m_sequencer_midi_model;

  // The Sequencer — words laid out in time.
  //
  // Record the words you say (every committed word while ● is on), or take
  // the whole sentence at once; play it at any tempo, once or looping, with
  // a cursor travelling the staff; and export it as a standard .mid file.
  // The sequence is kept on this device between visits.

  // Where staffSVG puts each note head (its layout, mirrored): the first at
  // x = 18, then 22 apart, with 18 more between words.
  const X0 = 18, STEP = 22, WORD_GAP = 18;

  function mountSequencer(host, ctx) {
    const seq = persisted('solresol:sequence', { words: [], tempo: 2.5, loop: false });
    let recording = false, playing = null;   // playing: { start, next, raf, timer, tl, keys }

    host.classList.add('sequencer');
    host.innerHTML = `
      <div class="seq-bar">
        <button class="btn btn--small seq-rec" data-act="rec" aria-pressed="false"><span class="seq-dot" aria-hidden="true"></span> Record</button>
        <button class="btn btn--small btn--ink" data-act="play">▶ Play</button>
        <button class="btn btn--small" data-act="loop" aria-pressed="false">↻ Loop</button>
        <label class="seq-tempo"><span>Tempo</span>
          <input type="range" min="0.8" max="6" step="0.1" data-tempo aria-label="Tempo, notes per second">
          <output data-tempo-out></output></label>
      </div>
      <div class="seq-roll" data-roll>
        <div class="seq-score" data-score></div>
      </div>
      <div class="seq-words" data-words></div>
      <div class="seq-bar seq-bar--foot">
        <button class="btn btn--small btn--ghost" data-act="take">Take the sentence</button>
        <button class="btn btn--small btn--ghost" data-act="clear">Clear</button>
        <button class="btn btn--small" data-act="export">Export .mid</button>
        <span class="seq-info" data-info></span>
      </div>`;
    const q = (s) => host.querySelector(s);
    const roll = q('[data-roll]'), score = q('[data-score]'), wordsEl = q('[data-words]'), info = q('[data-info]');
    const tempoIn = q('[data-tempo]'), tempoOut = q('[data-tempo-out]');
    const btn = (a) => q(`[data-act="${a}"]`);

    const get = () => seq.get();
    const set = (patch) => seq.set({ ...get(), ...patch });

    // x of every note head on the staff, and the staff's full width
    function layout(words) {
      const xs = []; let x = X0;
      words.forEach((ns, wi) => { if (wi) x += WORD_GAP; for (let i = 0; i < ns.length; i++) { xs.push(x); x += STEP; } });
      return { xs, width: Math.max(x + 4, 60) };
    }

    function renderControls() {
      const { words, tempo, loop } = get();
      if (document.activeElement !== tempoIn) tempoIn.value = tempo;
      tempoOut.textContent = `${tempo.toFixed(1)} notes/s`;
      btn('loop').setAttribute('aria-pressed', String(!!loop));
      ['play', 'clear', 'export'].forEach((a) => { btn(a).disabled = !words.length; });
      btn('take').disabled = !ctx.sentence.length;
      const tl = timeline(words, { tempo, wordGap: 0.5 }), n = tl.events.length;
      info.textContent = words.length
        ? `${words.length} word${words.length === 1 ? '' : 's'} · ${n} note${n === 1 ? '' : 's'} · ${tl.total.toFixed(1)} s`
        : '';
    }

    function render() {
      renderControls();
      const { words } = get();
      const has = words.length > 0;

      if (!has) {
        score.innerHTML = `<p class="seq-empty">An empty stave. Press <b>Record</b> and every word you say is written here — or take the sentence you have.</p>`;
        wordsEl.innerHTML = '';
        return;
      }
      const { width } = layout(words);
      score.innerHTML = `<div class="seq-stave" style="--w:${width};width:${Math.round(width * 116 / 84)}px">${staffSVG(words)}<i class="seq-cursor" data-cursor hidden></i></div>`;
      wordsEl.innerHTML = words.map((ns, i) => {
        const k = ns.join(''), m = meaningOf(k);
        return `<span class="seq-word" data-w="${i}">
          <span class="seq-word-colors">${ns.map((n) => `<i style="background:${note(n).color}"></i>`).join('')}</span>
          <b>${cap(k)}</b>${m ? `<em>${esc(String(m).split(/[,;]/)[0])}</em>` : ''}
          <button class="seq-x" data-del="${i}" aria-label="Remove ${cap(k)}">×</button></span>`;
      }).join('');
    }

    // ── playback: a small look-ahead scheduler, so Stop really stops ──
    function play() {
      stop();
      const { words, tempo } = get();
      if (!words.length) return;
      const tl = timeline(words, { tempo, wordGap: 0.5 });
      const { xs } = layout(words);
      playing = { start: performance.now(), next: 0, tl, xs, timer: 0, raf: 0 };
      btn('play').textContent = '■ Stop';
      const cursor = q('[data-cursor]');
      if (cursor) cursor.hidden = false;
      playing.timer = setInterval(pump, 25);
      pump();
      playing.raf = requestAnimationFrame(frame);
    }

    function pump() {
      if (!playing) return;
      const t = (performance.now() - playing.start) / 1000;
      const { events, total } = playing.tl;
      while (playing.next < events.length && events[playing.next].start < t + 0.12) {
        const e = events[playing.next++];
        playNote(e.note, Math.max(0, e.start - t), Math.min(0.5, e.dur * 1.3));
      }
      if (t > total + 0.25) {
        if (get().loop) { playing.start = performance.now(); playing.next = 0; }
        else stop();
      }
    }

    function frame() {
      if (!playing) return;
      const t = (performance.now() - playing.start) / 1000;
      const { events } = playing.tl, xs = playing.xs;
      // the cursor glides from note to note; the sounding word is lit
      let i = events.length - 1;
      while (i > 0 && events[i].start > t) i--;
      const e = events[i], nextStart = events[i + 1] ? events[i + 1].start : e.start + (e.dur / 0.9);
      const nextX = events[i + 1] ? xs[i + 1] : xs[i] + STEP;
      const f = Math.min(1, Math.max(0, (t - e.start) / (nextStart - e.start || 1)));
      const x = xs[i] - 8 + (nextX - xs[i]) * f;
      const cursor = q('[data-cursor]'), stave = q('.seq-stave');
      if (cursor && stave) {
        cursor.style.left = `${(x / Number(stave.style.getPropertyValue('--w'))) * 100}%`;
        // keep the cursor in view on a long sequence
        const px = cursor.offsetLeft;
        if (px < roll.scrollLeft + 20 || px > roll.scrollLeft + roll.clientWidth - 40) roll.scrollLeft = px - roll.clientWidth / 3;
      }
      wordsEl.querySelectorAll('.seq-word').forEach((el) => el.classList.toggle('is-now', Number(el.dataset.w) === e.word && t < playing.tl.total + 0.1));
      playing.raf = requestAnimationFrame(frame);
    }

    function stop() {
      if (!playing) return;
      clearInterval(playing.timer);
      cancelAnimationFrame(playing.raf);
      playing = null;
      btn('play').textContent = '▶ Play';
      const cursor = q('[data-cursor]');
      if (cursor) cursor.hidden = true;
      wordsEl.querySelectorAll('.is-now').forEach((el) => el.classList.remove('is-now'));
    }

    function exportMidi() {
      const { words, tempo } = get();
      if (!words.length) return;
      const bytes = midiFile(words, { tempo, wordGap: 0.5, title: words.map((w) => cap(w.join(''))).join(' ') });
      const blob = new Blob([bytes], { type: 'audio/midi' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `solresol-${words.map((w) => w.join('')).join('-').slice(0, 60)}.mid`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    }

    host.addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      if (b.dataset.del !== undefined) {
        stop();
        const words = get().words.slice(); words.splice(Number(b.dataset.del), 1); set({ words });
        return;
      }
      switch (b.dataset.act) {
        case 'rec':
          recording = !recording;
          b.setAttribute('aria-pressed', String(recording));
          host.classList.toggle('is-recording', recording);
          break;
        case 'play': if (playing) stop(); else play(); break;
        case 'loop': set({ loop: !get().loop }); break;
        case 'take': stop(); set({ words: [...get().words, ...ctx.sentence.words.map((w) => w.notes)] }); break;
        case 'clear': stop(); set({ words: [] }); break;
        case 'export': exportMidi(); break;
      }
    });
    tempoIn.addEventListener('input', () => {
      const wasPlaying = !!playing;
      set({ tempo: Number(tempoIn.value) });
      if (wasPlaying) play();
    });

    // Recording listens for committed words; it never adds to the sentence.
    const offCommit = on('word:commit', (notes) => {
      if (recording && notes?.length) { set({ words: [...get().words, notes.slice()] }); }
    });
    let drawn = null;
    const unseq = seq.watch((v) => {
      const key = JSON.stringify(v.words);
      if (key === drawn) { renderControls(); return; }
      drawn = key; stop(); render();
    });
    const unsent = ctx.sentence.watch(() => { btn('take').disabled = !ctx.sentence.length; });

    return {
      destroy() { stop(); offCommit(); unseq(); unsent(); host.textContent = ''; },
    };
  }

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  return { mountSequencer };
})();

// === onboarding/onboarding.js ===
const __m_onboarding_onboarding = (() => {
  const { note, cap, parse } = __m_dictionary_notes;
  const { meaningOf, wordCount } = __m_dictionary_dictionary;
  const { playNote, playWord } = __m_voices_index;
  const { Word } = __m_lang_word;

  // The introduction — three steps, shown once, on a first visit.
  //
  //   i    play any three notes            (the keys are right there)
  //   ii   that was a word: here it is     (every combination is a word)
  //   iii  colours are sounds are numbers  (and read backwards, a word flips)
  //
  // It rides on the live building-word: it only watches ctx.word, so the
  // instrument below keeps working the whole time. Skipping or finishing
  // sets prefs.onboarded, and it is not shown again (unless replayed).

  const NUMERALS = ['i', 'ii', 'iii'];
  const FALLBACK = parse('milasi');          // love ⇄ silami, hate

  function mountOnboarding(host, ctx, { onStep = () => {}, onDone = () => {} } = {}) {
    host.classList.add('intro');
    host.setAttribute('role', 'region');
    host.setAttribute('aria-label', 'Introduction');
    let step = 0, unwatch = () => {}, timer = 0, said = null, flipped = false;

    const first = (m) => String(m).split(/[,;]/)[0];

    function frame(title, body) {
      host.innerHTML = `
        <div class="intro-head">
          <span class="intro-count">${NUMERALS.map((n, i) => `<span class="${i === step ? 'is-on' : i < step ? 'is-done' : ''}">${n}</span>`).join('')}</span>
          <button class="intro-skip" data-skip>skip the introduction</button>
        </div>
        <h2 class="intro-title">${title}</h2>
        <div class="intro-body">${body}</div>`;
    }

    function show(i) {
      unwatch(); unwatch = () => {};
      clearTimeout(timer);
      step = i;
      onStep(step);
      if (i === 0) stepPlay();
      else if (i === 1) stepWord();
      else stepVoices();
      host.classList.remove('intro--in'); void host.offsetWidth; host.classList.add('intro--in');
    }

    // i — play any three notes
    function stepPlay() {
      frame('Play any three notes.',
        `<p class="intro-text">Tap the coloured keys below — or the home row, <kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><kbd>F</kbd> <kbd>J</kbd><kbd>K</kbd><kbd>L</kbd>. Any three.</p>
         <div class="intro-beads" aria-hidden="true"><i></i><i></i><i></i></div>`);
      ctx.word.clear();
      const beads = [...host.querySelectorAll('.intro-beads i')];
      unwatch = ctx.word.watch((notes) => {
        beads.forEach((b, k) => {
          const n = notes[k];
          b.style.background = n ? note(n).color : '';
          b.classList.toggle('is-set', !!n);
        });
        if (notes.length >= 3 && !timer) {
          said = notes.slice();
          timer = setTimeout(() => show(1), 650);
        }
      });
    }

    // ii — reveal: that was a word
    function stepWord() {
      const key = said.join(''), m = ctx.state.meanings.get()[key] || meaningOf(key);
      frame('You just said a word.',
        `<div class="intro-reveal">
           <button class="intro-word" data-hear title="Hear it again">${cap(key)}</button>
           <p class="intro-meaning">${m ? `means <em>“${esc(first(m))}”</em>` : '<em>— a word Sudre left empty</em>'}</p>
         </div>
         <p class="intro-text">In Solresol <b>every combination of notes is a word</b> — ${wordCount().toLocaleString()} of them in Sudre’s dictionary.
         ${m ? '' : 'This one is still unclaimed; you may give it a meaning.'} Play more and watch the meaning change; <kbd>Space</kbd> says the word into your sentence.</p>
         <div class="intro-actions"><button class="btn btn--ink" data-next>Next — the voices →</button></div>`);
    }

    // iii — colours are sounds are numbers, and the reversal
    // the pair to flip: the word just played, if it and its mirror both mean something
    function pair() {
      const key = said.join(''), opp = said.slice().reverse().join('');
      return meaningOf(key) && meaningOf(opp) && opp !== key ? said : FALLBACK;
    }
    const shown = () => (flipped ? pair().slice().reverse() : pair());

    function stepVoices() {
      const w = Word(shown());
      const m = meaningOf(w.key);
      frame('Colours are sounds are numbers.',
        `<p class="intro-text">Each note is also a colour, a number, a hand sign and a stroke of the pen — so a word can be sung, painted, counted or written, and it is the same word.</p>
         <div class="intro-voices" data-voices>
           ${w.notes.map((n) => {
             const nt = note(n);
             return `<button class="intro-note" data-note="${n}" style="--c:${nt.color}" aria-label="${n}, ${nt.num}">
               <i></i><b>${n}</b><span>${nt.num}</span></button>`;
           }).join('')}
           <span class="intro-eq">=</span>
           <span class="intro-vword"><b>${w.text}</b><em>${m ? esc(first(m)) : ''}</em></span>
         </div>
         <p class="intro-text">And read it backwards: <b>a reversed word means the opposite</b>.</p>
         <div class="intro-actions">
           <button class="btn" data-flip>⇄ Reverse it</button>
           <button class="btn btn--ink" data-done>Begin playing →</button>
         </div>`);
    }

    function finish() {
      unwatch(); clearTimeout(timer);
      ctx.state.setPref('onboarded', true);
      host.textContent = '';
      onDone();
    }

    host.addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      if (b.dataset.skip !== undefined || b.dataset.done !== undefined) finish();
      else if (b.dataset.next !== undefined) { flipped = false; show(2); }
      else if (b.dataset.hear !== undefined) playWord(Word(said));
      else if (b.dataset.note) playNote(b.dataset.note);
      else if (b.dataset.flip !== undefined) {
        flipped = !flipped;
        stepVoices();
        const v = host.querySelector('[data-voices]');
        v.classList.add('is-flipping');
        playWord(Word(shown()));
      }
    });

    show(0);
    return { destroy() { unwatch(); clearTimeout(timer); host.textContent = ''; } };
  }

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  return { mountOnboarding };
})();
