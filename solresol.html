// === dictionary/index.js ===
const __m_dictionary_index = (() => {
  // makeIndex — the pure core of the Dictionary.
  //
  // Given a list of {solresol, definition} entries, build the lookup maps
  // and return a small query object. No DOM, no fetch, no globals — so it
  // can be tested with a 12-word fixture. The singleton in dictionary.js
  // is just this, wrapped around the fetched data.

  function makeIndex(words) {
    const meaning = new Map();   // solresol → definition
    const en = new Map();        // folded english word → solresol (shortest wins)
    for (const w of words) {
      meaning.set(w.solresol.toLowerCase(), w.definition);
      for (const t of tokens(w.definition)) {
        const cur = en.get(t);
        if (!cur || w.solresol.length < cur.length) en.set(t, w.solresol);
      }
    }

    return {
      words,
      all: () => words,
      meaningOf: (text) => meaning.get(String(text).toLowerCase()) || null,
      englishToSolresol: (word) => en.get(fold(word)) || null,
      search(query, limit = 20) {
        const q = fold(query);
        if (!q) return [];
        const out = [];
        for (const w of words) {
          // diacritic-insensitive: "cafe" matches "Café", "frene" matches "Frêne"
          if (fold(w.solresol).startsWith(q) || fold(w.definition).includes(q)) {
            out.push(w);
            if (out.length >= limit) break;
          }
        }
        return out;
      },
    };
  }

  // Fold to lowercase ASCII: strip diacritics so accented/French glosses are findable.
  const fold = (s) =>
    String(s).trim().normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

  // "Well, well done, good" → well/done/good  (accent-folded)
  function tokens(definition) {
    return fold(definition).match(/[a-z']+/g) || [];
  }
  return { makeIndex, fold, tokens };
})();

// === views/dictionary/lexicon.model.js ===
const __m_views_dictionary_lexicon_model = (() => {
  const { parse, NOTE_NAMES } = __m_dictionary_notes;
  const { fold } = __m_dictionary_index;

  // The lexicon — the dictionary as a book you can leaf through. Pure: given
  // the word list it builds entries in the order of the scale, filters them,
  // groups them into families, and pairs each word with its mirror. No DOM.

  const RANK = Object.fromEntries(NOTE_NAMES.map((n, i) => [n, i]));

  // Solresol's own alphabetical order: note by note, do < re < … < si,
  // and a word before every longer word it begins (Do, Dodo, Dodore…).
  function collate(a, b) {
    const n = Math.min(a.length, b.length);
    for (let i = 0; i < n; i++) if (a[i] !== b[i]) return RANK[a[i]] - RANK[b[i]];
    return a.length - b.length;
  }

  // words → entries: { notes, key, text, definition, lang, fKey, fDef }, collated.
  function prepare(words) {
    const out = [];
    for (const w of words) {
      const notes = parse(w.solresol);
      if (!notes.length) continue;
      const key = notes.join('');
      out.push({
        notes, key,
        text: key[0].toUpperCase() + key.slice(1),
        definition: w.definition || '',
        lang: w.lang || 'en',
        fKey: key,
        fDef: fold(w.definition || ''),
      });
    }
    return out.sort((a, b) => collate(a.notes, b.notes));
  }

  // A query can be written in notes ("domisol", "do mi sol"), in digits
  // ("135" — do=1 … si=7), or in English. Returns the notes it spells, if any.
  function queryNotes(q) {
    const s = fold(q).replace(/[\s·.\-]+/g, '');
    if (!s) return null;
    if (/^[1-7]+$/.test(s)) return [...s].map((d) => NOTE_NAMES[d - 1]);
    const notes = parse(s);
    return notes.join('') === s ? notes : null;
  }

  // Every entry that matches — no limit — best first:
  //   0 the word itself · 1 words it begins · 2 glosses that open with the
  //   query · 3 an English word that starts with it · 4 anywhere in the gloss.
  // Then the syllable-count and first-note filters. Ties keep scale order.
  function filterEntries(entries, { q = '', syllables = 0, start = null } = {}) {
    const fq = fold(q);
    const spelled = queryNotes(q);
    const sKey = spelled ? spelled.join('') : null;
    const wordStart = fq ? new RegExp('(^|[^a-z])' + fq.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')) : null;
    const buckets = [[], [], [], [], []];
    for (const e of entries) {
      if (syllables && (syllables >= 5 ? e.notes.length < 5 : e.notes.length !== syllables)) continue;
      if (start && e.notes[0] !== start) continue;
      if (!fq) { buckets[4].push(e); continue; }
      if (sKey && e.key === sKey) buckets[0].push(e);
      else if (sKey && e.key.startsWith(sKey)) buckets[1].push(e);
      else if (e.fDef.startsWith(fq)) buckets[2].push(e);
      else if (wordStart.test(e.fDef)) buckets[3].push(e);
      else if (e.fDef.includes(fq)) buckets[4].push(e);
    }
    return buckets.flat();
  }

  // ── families ──────────────────────────────────────────────────────────
  // The seven keys, each split by its second note into seven sub-families.
  // A sub-family is named honestly: by its two notes, the two-note word that
  // heads it (Dore, "I, me"), and a few of its members' own first meanings.
  function familyTree(entries) {
    const byKey = new Map(entries.map((e) => [e.key, e]));
    return NOTE_NAMES.map((first) => {
      const head = byKey.get(first) || null;
      const subs = NOTE_NAMES.map((second) => {
        const prefix = first + second;
        const words = entries.filter((e) => e.notes.length > 2 && e.notes[0] === first && e.notes[1] === second);
        return { notes: [first, second], key: prefix, head: byKey.get(prefix) || null, words, samples: samples(words, 4) };
      });
      const count = subs.reduce((s, x) => s + x.words.length + (x.head ? 1 : 0), 0) + (head ? 1 : 0);
      return { note: first, head, subs, count };
    });
  }

  // The first sense of a gloss: "Body, the human body" → "body".
  const firstSense = (def) => {
    const s = String(def).split(/[,;(]/)[0].trim();
    return s ? s[0].toLowerCase() + s.slice(1) : '';
  };

  // A handful of distinct first senses, spread across the list, shortest words first.
  function samples(words, n = 4) {
    const seen = new Set(), out = [];
    const pool = words.filter((w) => w.notes.length === 4).concat(words.filter((w) => w.notes.length !== 4));
    const step = Math.max(1, Math.floor(pool.length / (n * 2)));
    for (let i = 0; i < pool.length && out.length < n; i += step) {
      const s = firstSense(pool[i].definition);
      if (s && s.length <= 22 && !seen.has(s)) { seen.add(s); out.push(s); }
    }
    return out;
  }

  // ── mirrors ───────────────────────────────────────────────────────────
  // A word and its reversal. `status` says what the reversal is:
  //   'palindrome' (its own mirror) · 'pair' (both in the dictionary) ·
  //   'empty' (the reversed word is not in the dictionary) · 'unknown'.
  function mirrorOf(byKey, notes) {
    const rev = notes.slice().reverse();
    const key = notes.join(''), rkey = rev.join('');
    const word = byKey.get(key) || null, shadow = byKey.get(rkey) || null;
    const status = notes.length < 2 ? 'single'
      : key === rkey ? 'palindrome'
      : word && shadow ? 'pair'
      : word ? 'empty' : shadow ? 'unknown' : 'neither';
    return { notes, rev, word, shadow, status };
  }

  // Every pair where a word and its reversal are both words, once each
  // (the earlier word in scale order first), palindromes left out.
  function mirrorPairs(entries) {
    const byKey = new Map(entries.map((e) => [e.key, e]));
    const out = [];
    for (const e of entries) {
      if (e.notes.length < 2) continue;
      const rkey = e.notes.slice().reverse().join('');
      if (rkey === e.key) continue;
      const r = byKey.get(rkey);
      if (r && collate(e.notes, r.notes) < 0) out.push([e, r]);
    }
    return out;
  }

  // The pairs Sudre himself gave as examples of meaning reversed
  // (docs/SOLRESOL_MASTER.md §7), and two Eco noted do not hold.
  const SUDRE_PAIRS = [
    ['domisol', 'solmido'], ['misol', 'solmi'], ['fala', 'lafa'],
    ['silasol', 'sollasi'], ['solla', 'lasol'], ['mifamifa', 'famifami'],
  ];
  const ECO_EXCEPTIONS = [['sidosido', 'dosidosi'], ['dorefare', 'refaredo']];
  return { collate, prepare, queryNotes, filterEntries, familyTree, firstSense, samples, mirrorOf, mirrorPairs, SUDRE_PAIRS, ECO_EXCEPTIONS };
})();

// === views/dictionary/common.js ===
const __m_views_dictionary_common = (() => {
  const { note, cap } = __m_dictionary_notes;
  const { allWords } = __m_dictionary_dictionary;
  const { prepare } = __m_views_dictionary_lexicon_model;

  // Small shared pieces of the Dictionary chapter: the prepared lexicon
  // (built once per loaded word list) and the markup every tab writes.
  // Any element with data-open="key" opens that word's page; data-play="key"
  // sounds it; data-play2="a b" sounds two words in turn. dictionary.view.js
  // listens for those once, for every tab.

  let cache = { src: null, lex: null };
  function lexicon() {
    const src = allWords();
    if (cache.src !== src) {
      const entries = prepare(src);
      cache = { src, lex: { entries, byKey: new Map(entries.map((e) => [e.key, e])) } };
    }
    return cache.lex;
  }

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  const fmt = (n) => Number(n).toLocaleString('en-US');

  const swatches = (notes, cls = '') =>
    `<span class="swatches ${cls}" aria-hidden="true">${notes.map((n) => `<i style="background:${note(n).color}"></i>`).join('')}</span>`;

  const digits = (notes) => notes.map((n) => note(n).num).join('');

  const playBtn = (key, label = cap(key)) =>
    `<button class="dx-play" data-play="${key}" aria-label="Hear ${label}" title="Hear ${label}">▶</button>`;

  // One dictionary entry, as a row: headword over its colours and figures,
  // then the gloss, then play.
  function entryRow(e, { gloss = true } = {}) {
    return `<li class="dx-entry">
      <button class="dx-entry-open" data-open="${e.key}">
        <span class="dx-head"><b>${e.text}</b><span class="dx-sig">${swatches(e.notes)}<small>${digits(e.notes)}</small></span></span>
        ${gloss ? `<span class="dx-gloss">${e.definition ? esc(e.definition) : '<em class="dx-nogloss">no gloss given</em>'}</span>` : ''}
      </button>${playBtn(e.key, e.text)}</li>`;
  }
  return { lexicon, esc, fmt, swatches, digits, playBtn, entryRow };
})();

// === views/dictionary/words.tab.js ===
const __m_views_dictionary_words_tab = (() => {
  const { NOTES, cap } = __m_dictionary_notes;
  const { filterEntries, queryNotes } = __m_views_dictionary_lexicon_model;
  const { lexicon, entryRow, esc, fmt, swatches } = __m_views_dictionary_common;

  // All words — the dictionary leafed page by page, in the order of the scale,
  // with a thumb index of the seven notes down its edge.

  const PER = 50;

  function mountWords(host, ctx, route, memo) {
    const { entries } = lexicon();
    const st = memo.words ||= { q: '', syllables: 0, start: null, page: 0 };

    host.innerHTML = `
      <p class="lede dx-lede">Every word Sudre's successors wrote down, in the order of the scale —
        <i>do</i> before <i>re</i>, a word before every longer word it begins.
        Search in Solresol, in English, or in figures (<span class="dx-num">135</span> is <i>Domisol</i>).</p>
      <div class="dx-find">
        <input class="search dx-q" type="search" placeholder="Search Solresol or English…" aria-label="Search the dictionary"
          autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(st.q)}">
        <div class="dx-filters">
          <span class="dx-filter-label">Syllables</span>
          <div class="seg" role="group" aria-label="Syllables">
            ${[0, 1, 2, 3, 4, 5].map((n) => `<button class="seg-btn" data-syl="${n}" aria-pressed="${st.syllables === n}">${n || 'All'}</button>`).join('')}
          </div>
        </div>
      </div>
      <div class="dx-book">
        <div class="dx-page">
          <div class="dx-runhead" aria-live="polite"></div>
          <ol class="dx-entries"></ol>
          <nav class="dx-folio" aria-label="Pages"></nav>
        </div>
        <nav class="dx-thumbs" aria-label="Words beginning with">
          ${NOTES.map((n) => `<button class="dx-thumb" data-start="${n.name}" style="--c:${n.color}" aria-pressed="${st.start === n.name}"><span>${cap(n.name)}</span></button>`).join('')}
        </nav>
      </div>`;

    const q = host.querySelector('.dx-q');
    const head = host.querySelector('.dx-runhead');
    const list = host.querySelector('.dx-entries');
    const folio = host.querySelector('.dx-folio');
    let found = [];

    function run(resetPage = true) {
      found = filterEntries(entries, st);
      if (resetPage) st.page = 0;
      paint();
    }

    function paint() {
      const pages = Math.max(1, Math.ceil(found.length / PER));
      st.page = Math.min(st.page, pages - 1);
      const slice = found.slice(st.page * PER, st.page * PER + PER);
      const filters = [st.syllables ? `${st.syllables} syllable${st.syllables > 1 ? 's' : ''}` : '', st.start ? `beginning ${cap(st.start)}` : ''].filter(Boolean).join(', ');

      if (!found.length) {
        const spelled = queryNotes(st.q);
        head.innerHTML = `<span class="dx-count">No words</span>`;
        list.innerHTML = `<li class="dx-empty">
          <p>Nothing in the dictionary answers to <b>“${esc(st.q || filters)}”</b>${st.q && filters ? ` among words ${filters}` : ''}.</p>
          ${spelled && spelled.length > 1 ? `<p><button class="chip-word" data-open="${spelled.join('')}">${swatches(spelled)} ${cap(spelled.join(''))}</button>
            is not a word yet — open its page to hear it, or give it a meaning of your own.</p>` : ''}
          ${st.syllables || st.start ? '<button class="btn btn--small btn--ghost" data-clear>Clear the filters</button>' : ''}
        </li>`;
        folio.innerHTML = '';
        return;
      }

      const first = slice[0], last = slice[slice.length - 1];
      head.innerHTML = `
        <span class="dx-guide"><b>${first.text}</b>${slice.length > 1 ? `<i>—</i><b>${last.text}</b>` : ''}</span>
        <span class="dx-count">${fmt(found.length)} ${found.length === 1 ? 'word' : 'words'}${st.q ? ` for “${esc(st.q)}”` : ''}${filters ? ` · ${filters}` : ''}</span>`;
      list.innerHTML = slice.map((e) => entryRow(e)).join('');
      list.classList.toggle('dx-entries--few', slice.length < 12);

      folio.innerHTML = pages < 2 ? '' : `
        <button class="btn btn--small btn--ghost" data-page="${st.page - 1}" ${st.page ? '' : 'disabled'} aria-label="Previous page">‹ Before</button>
        <span class="dx-folio-n">page <b>${st.page + 1}</b> of ${pages}</span>
        <button class="btn btn--small btn--ghost" data-page="${st.page + 1}" ${st.page < pages - 1 ? '' : 'disabled'} aria-label="Next page">After ›</button>`;
    }

    const onInput = () => { st.q = q.value; run(); };
    const onClick = (e) => {
      const t = e.target.closest('button');
      if (!t || !host.contains(t)) return;
      if (t.dataset.syl !== undefined) {
        st.syllables = Number(t.dataset.syl);
        host.querySelectorAll('[data-syl]').forEach((b) => b.setAttribute('aria-pressed', String(b === t)));
        run();
      } else if (t.dataset.start) {
        st.start = st.start === t.dataset.start ? null : t.dataset.start;
        host.querySelectorAll('[data-start]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.start === st.start)));
        run();
      } else if (t.dataset.page !== undefined) {
        st.page = Number(t.dataset.page);
        paint();
        const top = head.getBoundingClientRect().top + window.scrollY - 12;
        if (top < window.scrollY) window.scrollTo({ top });
      } else if (t.hasAttribute('data-clear')) {
        st.syllables = 0; st.start = null;
        host.querySelectorAll('[data-syl]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.syl === '0')));
        host.querySelectorAll('[data-start]').forEach((b) => b.setAttribute('aria-pressed', 'false'));
        run();
      }
    };
    q.addEventListener('input', onInput);
    host.addEventListener('click', onClick);
    run(false);

    return {
      update() {},
      destroy() { q.removeEventListener('input', onInput); host.removeEventListener('click', onClick); },
    };
  }
  return { mountWords };
})();

// === views/dictionary/families.tab.js ===
const __m_views_dictionary_families_tab = (() => {
  const { NOTES, note, cap } = __m_dictionary_notes;
  const { SEMANTIC_KEYS } = __m_dictionary_grammar;
  const { familyTree } = __m_views_dictionary_lexicon_model;
  const { lexicon, entryRow, esc, fmt, swatches } = __m_views_dictionary_common;

  // By family — Gajewski's seven keys (the first note decides the field of
  // meaning), each split by its second note into seven sub-families. The
  // sub-families have no names in the canon, so they are shown as what they
  // are: two notes, the two-note word that heads them, and a few members.

  // Gajewski's own description of each key (docs/SOLRESOL_MASTER.md §5).
  const DOMAIN = {
    do:  'Physical and moral man; the intellectual faculties; good qualities; food and sustenance.',
    re:  'Clothing and the toilet; the house, its furniture and keeping; the family.',
    mi:  'The actions of man, and his faults.',
    fa:  'The countryside and agriculture; travel; war; the sea and the navy.',
    sol: 'The theatre, literature, the fine arts and the sciences.',
    la:  'Industry and commerce.',
    si:  'The city: administration, government, politics, finance, the police.',
  };

  let treeCache = { entries: null, tree: null };

  function mountFamilies(host, ctx, route) {
    const { entries } = lexicon();
    if (treeCache.entries !== entries) treeCache = { entries, tree: familyTree(entries) };
    const tree = treeCache.tree;
    const max = Math.max(...tree.flatMap((f) => f.subs.map((s) => s.words.length)));

    host.innerHTML = `
      <p class="lede dx-lede">In Gajewski's grammar the first note of a four-syllable word is its <em>key</em>: it names the field
        the meaning lies in. The second note divides each field again, seven ways. The canon leaves those forty-nine
        unnamed, so here each is shown by its notes, the two-note word that heads it, and a few of its words.</p>

      <figure class="plate dx-matrix-plate">
        <table class="dx-matrix">
          <caption class="sr-only">Words in each of the forty-nine sub-families: rows are the first note, columns the second.</caption>
          <thead><tr><th scope="col"><span class="dx-corner">1st <i>╲</i> 2nd</span></th>
            ${NOTES.map((n) => `<th scope="col"><span class="dx-mh" style="--c:${n.color}">${cap(n.name)}</span></th>`).join('')}</tr></thead>
          <tbody>${tree.map((f) => `<tr>
            <th scope="row"><a class="dx-mh" style="--c:${note(f.note).color}" href="#/dictionary/families/${f.note}">${cap(f.note)}</a></th>
            ${f.subs.map((s) => {
              const n = s.words.length, k = n / max;
              return `<td><a class="dx-cell${k > 0.5 ? ' dx-cell--dark' : ''}" href="#/dictionary/families/${s.key}" style="--k:${k.toFixed(3)}"
                title="${cap(s.key)}${s.head ? ' — ' + esc(s.head.definition) : ''}: ${n} words">
                <b>${n}</b><span>${cap(s.key)}</span></a></td>`;
            }).join('')}</tr>`).join('')}
          </tbody>
        </table>
        <figcaption class="plate-caption">Table of the forty-nine · the darker, the fuller</figcaption>
        <p class="dx-matrix-note">${matrixNote(tree, entries)}</p>
      </figure>

      ${tree.map((f) => {
        const n = note(f.note);
        return `<section class="dx-family" id="dx-fam-${f.note}" style="--c:${n.color}">
          <header class="dx-family-head">
            <span class="dx-family-note">${cap(f.note)}</span>
            <div class="dx-family-title">
              <p class="rubric">The key of ${cap(f.note)} <span class="rubric-note">${fmt(f.count)} words</span></p>
              <h2 class="section-title">${SEMANTIC_KEYS[f.note]}</h2>
              <p class="dx-domain">${DOMAIN[f.note]}</p>
              ${f.head ? `<p class="dx-family-particle">Alone, <button class="dx-link" data-open="${f.note}">${cap(f.note)}</button> is the particle <i>“${esc(f.head.definition)}”</i>.</p>` : ''}
            </div>
          </header>
          <div class="dx-subs">
            ${f.subs.map((s) => `<details class="dx-sub" id="dx-sub-${s.key}" data-key="${s.key}">
              <summary>
                ${swatches(s.notes, 'dx-sub-sw')}
                <span class="dx-sub-name"><b>${cap(s.key)}–</b>${s.head ? `<i>${esc(firstGloss(s.head.definition))}</i>` : ''}</span>
                <span class="dx-sub-eg">${s.samples.length ? s.samples.map(esc).join(' · ') : '—'}</span>
                <span class="dx-sub-n">${s.words.length}</span>
              </summary>
              <div class="dx-sub-body"></div>
            </details>`).join('')}
          </div>
        </section>`;
      }).join('')}
      <p class="hint dx-foot">The keys are Gajewski's and hold for four-syllable words. Shorter words and the five-syllable
        words of this dictionary are filed by the same first note, but their meaning need not lie in its field.</p>`;

    // Fill a sub-family's list only when it is first opened: 3,000 rows are
    // not built for a page that shows forty-nine summaries.
    const fill = (d) => {
      const body = d.querySelector('.dx-sub-body');
      if (body.childElementCount) return;
      const s = tree.flatMap((f) => f.subs).find((x) => x.key === d.dataset.key);
      body.innerHTML = `
        ${s.head ? `<ol class="dx-entries dx-entries--head">${entryRow(s.head)}</ol>` : ''}
        <ol class="dx-entries">${s.words.map((e) => entryRow(e)).join('')}</ol>`;
    };
    const onToggle = (e) => { if (e.target.open) fill(e.target); };
    host.addEventListener('toggle', onToggle, true);

    function go(r) {
      const arg = (r && r.arg) || '';
      if (!arg) return;
      const key = arg.toLowerCase().replace(/[^a-z]/g, '');
      const target = host.querySelector(`#dx-sub-${key}`) || host.querySelector(`#dx-fam-${key}`);
      if (!target) return;
      if (target.tagName === 'DETAILS') { target.open = true; fill(target); }
      requestAnimationFrame(() => target.scrollIntoView({ block: 'start', behavior: 'smooth' }));
    }
    go(route);

    return {
      update: go,
      destroy() { host.removeEventListener('toggle', onToggle, true); },
    };
  }

  // What the table shows, read from the data rather than asserted.
  function matrixNote(tree, entries) {
    const subs = tree.flatMap((f) => f.subs);
    const tally = new Map();
    for (const s of subs) tally.set(s.words.length, (tally.get(s.words.length) || 0) + 1);
    const [common] = [...tally.entries()].sort((a, b) => b[1] - a[1])[0];
    const doubled = subs.filter((s) => s.notes[0] === s.notes[1]).map((s) => s.words.length);
    const sameDoubled = doubled.every((n) => n === doubled[0]) ? doubled[0] : null;
    const five = entries.filter((e) => e.notes.length >= 5);
    const fiveHomes = subs.filter((s) => s.words.some((e) => e.notes.length >= 5)).map((s) => `<i>${cap(s.key)}</i>`);
    const list = fiveHomes.length > 1 ? fiveHomes.slice(0, -1).join(', ') + ' and ' + fiveHomes[fiveHomes.length - 1] : fiveHomes[0];
    return `Most sub-families hold the same ${common} words${sameDoubled ? `; those that begin on a doubled note hold ${sameDoubled}` : ''}.
      ${five.length ? `${list} swell with this dictionary's ${fmt(five.length)} five-syllable words, which Gajewski's list of 2,660 does not include.` : ''}`;
  }

  const firstGloss = (def) => String(def).split(/[;(]/)[0].split(',').slice(0, 2).join(',').trim();
  return { mountFamilies };
})();

// === views/dictionary/mirrors.tab.js ===
const __m_views_dictionary_mirrors_tab = (() => {

  const { playNote } = __m_voices_index;

  // read a word backwards and, often, its meaning turns over. A looking-glass
  // to try any word in, his own examples, and every pair the dictionary holds.

  const STEP = 40;
  let pairCache = { entries: null, pairs: null };

  function mountMirrors(host, ctx, route, memo) {

    if (pairCache.entries !== entries) pairCache = { entries, pairs: mirrorPairs(entries) };
    const pairs = pairCache.pairs;
    const st = memo.mirrors ||= { notes: ['fa', 'la'], q: '', syl: 0, shown: STEP };
    if (ctx.word.notes.length > 1) st.notes = ctx.word.notes.slice();   // a word built on the instrument comes here to be reversed

    host.innerHTML = `
      <p class="lede dx-lede">Reverse a word and you often reverse its sense: <i>Fala</i>, good; <i>Lafa</i>, bad.
        It is a principle, not a law — Sudre used it most in short words, and it fails often enough
        that the dictionary is the only judge. Try any word.</p>

      <figure class="plate dx-glass">
        <div class="dx-glass-in">
          <input class="search dx-glass-q" aria-label="A word to reverse" placeholder="Write a word — Fala, Misol, 5 6 4…"
            autocomplete="off" autocapitalize="off" spellcheck="false">
          <div class="dx-keys" role="group" aria-label="Play notes into the word">
            ${NOTES.map((n) => `<button class="dx-key" data-key="${n.name}" style="--c:${n.color}" aria-label="${n.name}">${n.name}</button>`).join('')}
            <button class="dx-key dx-key--edit" data-edit="back" aria-label="Remove the last note">⌫</button>

        </div>

      </figure>

      <section class="leaf">
        <h2 class="rubric">Sudre's own examples</h2>
        <ul class="dx-pairs">${SUDRE_PAIRS.map(([a, b]) => pairRow(byKey.get(a), byKey.get(b))).join('')}</ul>
        <h2 class="rubric dx-gap">Where it fails <span class="rubric-note">Umberto Eco's counter-examples</span></h2>
        <ul class="dx-pairs dx-pairs--fail">${ECO_EXCEPTIONS.map(([a, b]) => pairRow(byKey.get(a), byKey.get(b))).join('')}</ul>
      </section>

      <section class="leaf">
        <h2 class="rubric">Every mirrored pair <span class="rubric-note">both a word and its reversal are in the dictionary; palindromes left out</span></h2>
        <div class="dx-find dx-find--pairs">
          <input class="search dx-pairs-q" type="search" placeholder="Find a pair…" aria-label="Find a pair" autocomplete="off" value="${esc(st.q)}">
          <div class="seg" role="group" aria-label="Syllables">
            ${[0, 2, 3, 4, 5].map((n) => `<button class="seg-btn" data-psyl="${n}" aria-pressed="${st.syl === n}">${n || 'All'}</button>`).join('')}
          </div>
        </div>
        <p class="dx-count dx-pairs-count"></p>
        <ul class="dx-pairs dx-pairs-all"></ul>
        <div class="controls"><button class="btn btn--ghost dx-more">Show more</button></div>
      </section>`;

    const input = host.querySelector('.dx-glass-q');
    const facing = host.querySelector('.dx-facing');
    const pq = host.querySelector('.dx-pairs-q');
    const listEl = host.querySelector('.dx-pairs-all');
    const countEl = host.querySelector('.dx-pairs-count');
    const more = host.querySelector('.dx-more');

    function paintGlass(fromInput = false) {
      if (!fromInput) input.value = st.notes.length ? cap(st.notes.join('')) : '';
      const m = mirrorOf(byKey, st.notes);
      if (!st.notes.length) { facing.innerHTML = '<p class="dx-glass-empty">Write or play a word to see it in the glass.</p>'; return; }
      const side = (notes, e, cls) => `
        <button class="dx-face ${cls}" data-open="${notes.join('')}">
          <span class="dx-face-word">${cap(notes.join(''))}</span>
          ${swatches(notes, 'dx-face-sw')}
          <span class="dx-face-num">${digits(notes)}</span>
          <span class="dx-face-gloss">${e ? esc(e.definition) : '<em>not in the dictionary</em>'}</span>
        </button>`;
      const verdict = {
        single: 'One note has no reverse: it is its own mirror.',
        palindrome: 'A palindrome — the word is its own mirror.',
        pair: 'Both are words. Read them together: is the second the first turned over?',
        empty: 'The mirror is empty: the reversal is not a word in the dictionary.',
        unknown: 'Only the reversal is a word.',
        neither: 'Neither way round is in the dictionary.',
      }[m.status];
      facing.innerHTML = `
        ${side(m.notes, m.word, 'dx-face--l')}
        <button class="dx-swap" data-play2="${m.notes.join('')} ${m.rev.join('')}" aria-label="Hear both" title="Hear both">⇄</button>
        ${side(m.rev, m.shadow, 'dx-face--r')}
        <p class="dx-verdict">${verdict}</p>`;
    }

    function paintPairs(reset = true) {
      if (reset) st.shown = STEP;
      const q = fold(st.q);
      const hit = pairs.filter(([a, b]) =>
        (!st.syl || (st.syl >= 5 ? a.notes.length >= 5 : a.notes.length === st.syl)) &&
        (!q || a.key.includes(q) || b.key.includes(q) || a.fDef.includes(q) || b.fDef.includes(q)));
      countEl.textContent = `${fmt(hit.length)} ${hit.length === 1 ? 'pair' : 'pairs'}${hit.length < pairs.length ? ` of ${fmt(pairs.length)}` : ''}`;
      listEl.innerHTML = hit.length ? hit.slice(0, st.shown).map(([a, b]) => pairRow(a, b)).join('')
        : '<li class="dx-empty">No pair matches.</li>';
      more.hidden = hit.length <= st.shown;
      more.textContent = `Show more (${fmt(hit.length - st.shown)} left)`;
      more.onclick = () => { st.shown += STEP * 2; paintPairs(false); };
    }

    const onInput = (e) => {
      if (e.target === input) {
        const s = input.value.trim();
        st.notes = /^[1-7\s]+$/.test(s) ? [...s.replace(/\s/g, '')].map((d) => NOTES[d - 1].name) : parse(s);
        paintGlass(true);
      } else if (e.target === pq) { st.q = pq.value; paintPairs(); }
    };
    const onClick = (e) => {
      const t = e.target.closest('button');
      if (!t || !host.contains(t)) return;
      if (t.dataset.key) { st.notes.push(t.dataset.key); playNote(t.dataset.key); paintGlass(); }
      else if (t.dataset.edit === 'back') { st.notes.pop(); paintGlass(); }
      else if (t.dataset.edit === 'clear') { st.notes = []; paintGlass(); }
      else if (t.dataset.psyl !== undefined) {
        st.syl = Number(t.dataset.psyl);
        host.querySelectorAll('[data-psyl]').forEach((b) => b.setAttribute('aria-pressed', String(b === t)));
        paintPairs();
      }
    };
    host.addEventListener('input', onInput);
    host.addEventListener('click', onClick);
    paintGlass();
    paintPairs(false);

    return {
      update() {},
      destroy() { host.removeEventListener('input', onInput); host.removeEventListener('click', onClick); },
    };
  }

  function pairRow(a, b) {
    if (!a || !b) return '';
    const w = (e) => `<button class="dx-pw" data-open="${e.key}">${swatches(e.notes)}<b>${e.text}</b><span>${esc(e.definition)}</span></button>`;
    return `<li class="dx-pair">${w(a)}<button class="dx-swap dx-swap--small" data-play2="${a.key} ${b.key}" aria-label="Hear ${a.text} then ${b.text}">⇄</button>${w(b)}</li>`;
  }
  return { mountMirrors };
})();

// === views/dictionary/numbers.model.js ===
const __m_views_dictionary_numbers_model = (() => {
  // Numbers in Solresol — pure, no DOM.
  //
  // The base words are not invented here: every one is a headword in the
  // dictionary (src/dictionary/words.json), glossed with its number
  // ("Remimi — Two, second…"). tests/dictionary-numbers.test.js checks that
  // against the file. What the dictionary does NOT give is:
  //   · a word for zero (the archive's "Dodore" means earth, world);
  //   · words for 70 and 90;
  //   · the rule for joining words into a larger number.
  // Those gaps are filled by the French model Sudre wrote in — 70 = 60 + 10
  // (soixante-dix), 90 = 80 + 10 (quatre-vingt-dix), 21 = 20 + 1, 300 = 3 × 100,
  // "cent" and "mille" bare, "un million" counted — and every result says
  // which of its parts are the dictionary's and which are composed.

  const BASE = [
    [1, 'redodo'], [2, 'remimi'], [3, 'refafa'], [4, 'resolsol'], [5, 'relala'], [6, 'resisi'],
    [7, 'mimido'], [8, 'mimire'], [9, 'mimifa'], [10, 'mimisol'], [11, 'mimila'], [12, 'mimisi'],
    [13, 'midodo'], [14, 'mirere'], [15, 'mifafa'], [16, 'misolsol'], [17, 'milala'], [18, 'misisi'],
    [19, 'fafado'], [20, 'fafare'], [30, 'fafami'], [40, 'fafasol'], [50, 'fafala'], [60, 'fafasi'],
    [80, 'fadodo'], [100, 'farere'], [1e3, 'famimi'], [1e6, 'fasolsol'], [1e9, 'falala'], [1e12, 'fasisi'],
  ];
  const WORD = new Map(BASE);
  const MAX = 1e15 - 1;            // beyond "a thousand trillion" there is no word to count with

  // n → { ok, words: [{ key, value, role }], kind, note }
  //   role: 'word' (a base word) · 'times' (a multiplier: the 3 of 3 × 100)
  //   kind: 'word' — one dictionary word; 'composed' — built by the rules
  //         above; 'french' — also uses the 70/90 reading, which has no word.
  function toSolresol(input) {
    const n = typeof input === 'number' ? input : Number(String(input).replace(/[\s,_']/g, ''));
    if (!Number.isFinite(n)) return fail('Not a number.');
    if (!Number.isInteger(n)) return fail('Only whole numbers: the dictionary has no fractions.');
    if (n < 0) return fail('The dictionary has no minus. “Do” before a word means “not”, not “less than zero”.');
    if (n === 0) return fail('The dictionary has no word for zero. (Dodore, which an earlier version of this site gave, means “earth, world”.)');
    if (n > MAX) return fail('Past a thousand trillion the dictionary has no larger word to count with.');

    const words = [];
    let french = false;
    const push = (key, value, role = 'word') => words.push({ key, value, role });

    // 1 … 999
    function under1000(x) {
      const h = Math.floor(x / 100), r = x % 100;
      if (h) { if (h > 1) push(WORD.get(h), h, 'times'); push('farere', 100); }
      if (r) under100(r);
    }
    function under100(x) {
      if (WORD.has(x)) return push(WORD.get(x), x);
      if (x >= 70 && x < 80 || x >= 90) {             // soixante-dix, quatre-vingt-dix
        french = true;
        const base = x < 80 ? 60 : 80;
        push(WORD.get(base), base);
        return push(WORD.get(x - base), x - base);
      }
      const tens = Math.floor(x / 10) * 10;
      push(WORD.get(tens), tens);
      push(WORD.get(x - tens), x - tens);
    }

    const groups = [[1e12, 'fasisi'], [1e9, 'falala'], [1e6, 'fasolsol'], [1e3, 'famimi']];
    let rest = n;
    for (const [size, key] of groups) {
      const g = Math.floor(rest / size);
      rest -= g * size;
      if (!g) continue;
      if (g > 1 || size > 1e3) {                       // "mille", but "un million"
        const start = words.length;
        under1000(g);
        for (let i = start; i < words.length; i++) words[i].role = 'times';
      }
      push(key, size);
    }
    if (rest) under1000(rest);

    const kind = words.length === 1 ? 'word' : french ? 'french' : 'composed';
    return { ok: true, n, words, kind, note: NOTES[kind] };
  }

  const NOTES = {
    word: 'A single word, as the dictionary gives it. It is also the ordinal: “two” and “second” are one word.',
    composed: 'Built from dictionary words by adding and multiplying, largest first, as French does. The joining rule is inferred; the dictionary gives only the parts.',
    french: 'The dictionary has no word for 70 or 90. Read here as 60 + 10 and 80 + 10, after French (soixante-dix, quatre-vingt-dix); treat this as a reading, not canon.',
  };

  const fail = (why) => ({ ok: false, words: [], kind: 'none', note: why });

  // The base words laid out in the rows their shapes fall into.
  const TABLE = [
    { title: 'One to six', rule: 're + a doubled note', values: [1, 2, 3, 4, 5, 6] },
    { title: 'Seven to twelve', rule: 'mimi + a note', values: [7, 8, 9, 10, 11, 12] },
    { title: 'Thirteen to eighteen', rule: 'mi + a doubled note', values: [13, 14, 15, 16, 17, 18] },
    { title: 'Nineteen and the tens', rule: 'fafa + a note', values: [19, 20, 30, 40, 50, 60] },
    { title: 'Eighty and the powers', rule: 'fa + a doubled note', values: [80, 100, 1e3, 1e6, 1e9, 1e12] },
  ].map((row) => ({ ...row, cells: row.values.map((v) => ({ value: v, key: WORD.get(v) })) }));
  return { BASE, MAX, toSolresol, TABLE };
})();

// === views/dictionary/numbers.tab.js ===
const __m_views_dictionary_numbers_tab = (() => {

  // Numbers — any whole number said in Solresol. The base words are the

  function mountNumbers(host, ctx, route, memo) {

    const st = memo.numbers ||= { n: '1827' };
    const fromRoute = route && route.arg && /^\d+$/.test(route.arg) ? route.arg : null;
    if (fromRoute) st.n = fromRoute;

    host.innerHTML = `
      <p class="lede dx-lede">The numbers are words like any other, and every base number below is a headword in the
        dictionary — <i>Remimi</i> is glossed “two, second”. Larger numbers are built from them.</p>

      <figure class="plate dx-count-plate">
        <label class="dx-numin">
          <span class="rubric">Write a number</span>
          <input class="search dx-n" inputmode="numeric" autocomplete="off" aria-label="A whole number" value="${esc(st.n)}">
        </label>
        <div class="dx-picks">${PICKS.map((p) => `<button class="chip-word dx-pick" data-n="${p}">${fmt(p)}</button>`).join('')}</div>
        <div class="dx-said" aria-live="polite"></div>
      </figure>

      <section class="leaf">
        <h2 class="rubric">The base words <span class="rubric-note">each a headword in the dictionary</span></h2>
        <div class="dx-ntable">
          ${TABLE.map((row) => `<div class="dx-nrow">
            <p class="dx-nrow-head"><b>${row.title}</b><i>${row.rule}</i></p>
            <ol class="dx-ncells">${row.cells.map((c) => {
              const notes = parse(c.key), e = byKey.get(c.key);
              return `<li><button class="dx-ncell" data-open="${c.key}" title="${e ? esc(e.definition) : ''}">
                <span class="dx-nval">${numeral(c.value)}</span>
                <b>${cap(c.key)}</b>${swatches(notes)}</button></li>`;
            }).join('')}</ol></div>`).join('')}
        </div>
      </section>

      <section class="leaf dx-canon">
        <h2 class="rubric">What the dictionary does not say</h2>
        <ul>
          <li><b>No zero.</b> No headword is glossed “zero”. <i>Dodore</i>, which an earlier version of this site gave for it, means “earth, world”.</li>
          <li><b>No seventy, no ninety.</b> The tens run <i>fafa</i> + a note (20 <i>re</i>, 30 <i>mi</i>, 40 <i>sol</i>, 50 <i>la</i>, 60 <i>si</i>)
            and the notes run out; 80 is <i>Fadodo</i>. So 70 and 90 are read here as the French read them — 60 + 10 and 80 + 10 — and marked as a reading.</li>
          <li><b>No joining rule.</b> The parts are canon; putting them largest first, adding and multiplying as French does
            (<i>cent</i> and <i>mille</i> bare, <i>un million</i> counted), is this site's inference. Whether Sudre put <i>re</i>, “and”, into
            twenty-one as French puts <i>et</i> is not recorded here.</li>
          <li><b>No minus, no fractions.</b> <i>Do</i> before a word means “not”, not “less than zero”.</li>
        </ul>

    const input = host.querySelector('.dx-n');

    function paint() {

      if (!raw) { said.innerHTML = '<p class="dx-said-note">Write a whole number, from one to a thousand trillion.</p>'; return; }
      const r = toSolresol(raw);
      if (!r.ok) { said.innerHTML = `<p class="dx-said-note dx-said-note--no">${esc(r.note)}</p>`; return; }
      const keys = r.words.map((w) => w.key);
      const badge = { word: 'In the dictionary', composed: 'Composed', french: 'Composed · a reading' }[r.kind];
      said.innerHTML = `
        <p class="dx-said-fig">${fmt(r.n)}</p>
        <div class="dx-said-words">
          ${r.words.map((w) => `<button class="dx-sw ${w.role === 'times' ? 'dx-sw--times' : ''}" data-open="${w.key}">
            <b>${cap(w.key)}</b>${swatches(parse(w.key))}<small>${fmt(w.value)}${w.role === 'times' ? ' ×' : ''}</small></button>`).join('')}
        </div>
        <p class="dx-said-digits" aria-label="as figures, one per note">${keys.map((k) => digits(parse(k))).join(' · ')}</p>
        <div class="controls dx-said-ctl">
          <button class="btn btn--ink" data-play2="${keys.join(' ')}">▶ Say it</button>
          <span class="tag">${badge}</span>
        </div>
        <p class="dx-said-note">${esc(r.note)}</p>`;
    }

    const onInput = () => { st.n = input.value; paint(); };
    const onClick = (e) => {
      const t = e.target.closest('[data-n]');
      if (t) { st.n = t.dataset.n; input.value = st.n; paint(); }

      update(r) { if (r && r.arg && /^\d+$/.test(r.arg)) { st.n = r.arg; input.value = st.n; paint(); } },
      destroy() { input.removeEventListener('input', onInput); host.removeEventListener('click', onClick); },
    };
  }

  // 1e12 would print as 1,000,000,000,000 — too wide for a cell.
  const numeral = (v) => v >= 1e6 ? `10<sup>${Math.round(Math.log10(v))}</sup>` : fmt(v);
  return { mountNumbers };
})();

// === views/dictionary/sunburst.model.js ===
const __m_views_dictionary_sunburst_model = (() => {
  const { NOTE_NAMES } = __m_dictionary_notes;

  // The map of the dictionary as a tree of prefixes, laid out as a sunburst.
  // Pure, no DOM. Ring d is the d-th note of the words under it, so every
  // arc's colour is a note: first note inside, second next, and so on.
  //
  // A node is a prefix (Do, Dore, Doremi): { key, notes, depth, word, children,
  // value, x0, x1 } where `word` is the dictionary entry the prefix itself
  // spells, if any. Prefixes go two notes deep for everyone; a sub-family
  // too big to read around one circle (> split words) is split once more
  // by its third note, so no ring ever has to hold more than ~split labels.

  function buildTree(entries, { split = 72 } = {}) {
    const byKey = new Map(entries.map((e) => [e.key, e]));
    const root = node([], null);
    root.depth = 0;
    for (const first of NOTE_NAMES) {
      const a = node([first], byKey.get(first));
      root.children.push(a);
      for (const second of NOTE_NAMES) {
        const b = node([first, second], byKey.get(first + second));
        a.children.push(b);
        const under = entries.filter((e) => e.notes.length > 2 && e.notes[0] === first && e.notes[1] === second);
        if (under.length > split) {
          for (const third of NOTE_NAMES) {
            const c = node([first, second, third], byKey.get(first + second + third));
            c.children = under.filter((e) => e.notes.length > 3 && e.notes[2] === third).map((e) => node(e.notes, e));
            if (c.children.length || c.word) b.children.push(c);
          }
        } else {
          b.children = under.map((e) => node(e.notes, e));
        }
      }
    }
    weigh(root);
    partition(root, 0, 1);
    return root;
  }

  function node(notes, word) {
    return { key: notes.join(''), notes, depth: notes.length, word: word || null, children: [], parent: null, value: 0, count: 0, x0: 0, x1: 0 };
  }

  // Every arc gets at least one unit, so an empty prefix still shows as a hairline
  // and a prefix that is itself a word keeps a place.
  function weigh(n) {
    for (const c of n.children) { c.parent = n; c.depth = n.depth + 1; weigh(c); }
    n.value = n.children.length ? n.children.reduce((s, c) => s + c.value, 0) : 1;
    n.count = n.children.reduce((s, c) => s + c.count + (c.word ? 1 : 0), 0);   // words beneath, itself excluded
    return n.value;
  }

  function partition(n, x0, x1) {
    n.x0 = x0; n.x1 = x1;
    let x = x0;
    for (const c of n.children) {
      const w = (x1 - x0) * (c.value / n.value);
      partition(c, x, x + w);
      x += w;
    }
  }

  function* walk(n) { yield n; for (const c of n.children) yield* walk(c); }

  function find(root, key) {
    for (const n of walk(root)) if (n.key === key) return n;
    return null;
  }

  // The words a node holds (every entry in its subtree, itself included).
  function wordsUnder(n) {
    const out = [];
    for (const m of walk(n)) if (m.word) out.push(m.word);
    return out;
  }

  // The rings a focus shows: its children and grandchildren. When the
  // children are all leaves, one wide ring; otherwise two, the outer wider
  // (it carries the longer labels). Radii in viewBox units.
  function bands(focus, { inner = 64, outer = 298 } = {}) {
    const deep = focus.children.some((c) => c.children.length);
    const deeper = deep && focus.children.some((c) => c.children.some((g) => g.children.length));
    const out = {};
    for (let d = 0; d <= 6; d++) out[d] = d <= focus.depth ? [inner, inner] : [outer, outer];
    if (!deep) { out[focus.depth + 1] = [inner, outer]; return out; }
    const edge = deeper ? outer - 16 : outer;                   // leave a fringe for what lies deeper
    const mid = inner + (edge - inner) * 0.42;
    out[focus.depth + 1] = [inner, mid];
    out[focus.depth + 2] = [mid + 1.5, edge];
    if (deeper) out[focus.depth + 3] = [edge + 2, outer];
    return out;
  }

  // An annular sector: angles in radians, 0 at the top, clockwise.
  function arcPath(a0, a1, r0, r1) {
    if (a1 - a0 >= Math.PI * 2 - 1e-6) {        // a full ring: two half arcs
      const m = a0 + Math.PI;
      return arcPath(a0, m, r0, r1) + arcPath(m, a1 - 1e-6, r0, r1);
    }
    const large = a1 - a0 > Math.PI ? 1 : 0;
    const p = (a, r) => `${(r * Math.sin(a)).toFixed(2)},${(-r * Math.cos(a)).toFixed(2)}`;
    if (r0 <= 0.01) return `M0,0L${p(a0, r1)}A${r1},${r1} 0 ${large} 1 ${p(a1, r1)}Z`;
    return `M${p(a0, r1)}A${r1},${r1} 0 ${large} 1 ${p(a1, r1)}L${p(a1, r0)}A${r0},${r0} 0 ${large} 0 ${p(a0, r0)}Z`;
  }

  // Map a node's [x0, x1] through the zoomed domain [d0, d1] to angles.
  function angles(n, d0, d1) {
    const k = (Math.PI * 2) / (d1 - d0);
    const a0 = Math.max(0, Math.min(Math.PI * 2, (n.x0 - d0) * k));
    const a1 = Math.max(0, Math.min(Math.PI * 2, (n.x1 - d0) * k));
    return [a0, a1];
  }

  // Where to write a label: radial along the arc's middle when the arc is
  // narrow (word rings), tangential when it is wide. Returns the transform
  // and whether the text reads outward (flipped on the left half).
  function labelPlace(a0, a1, r0, r1) {
    const a = (a0 + a1) / 2, deg = (a * 180) / Math.PI;
    const r = (r0 + r1) / 2;
    const x = r * Math.sin(a), y = -r * Math.cos(a);
    const radial = (a1 - a0) * r < (r1 - r0) * 1.1;
    if (radial) {
      const flip = a > Math.PI;
      const rot = flip ? deg + 90 : deg - 90;
      return { x, y, rotate: rot, radial: true, flip };

      const q = input.value.trim();
      if (!q) { out.innerHTML = `<p class="tr-empty">${dir === 'en' ? 'Write a sentence in English.' : 'Write a sentence in Solresol.'}</p>`; return; }
      const r = dir === 'en' ? translateEnglish(getIndex(), q) : glossSolresol(getIndex(), q);
      if (!r.items.length) { out.innerHTML = '<p class="tr-empty">Nothing to carry across yet.</p>'; return; }
      const known = r.items.filter((i) => i.notes);
      const words = known.map((i) => i.notes);
      const missing = r.items.filter((i) => !i.notes);
      let wi = 0;
      const firstKnown = r.items.findIndex((i) => i.notes);

      const cols = r.items.map((it, k) => {
        const role = ROLE[it.role];
        if (!it.notes) {
          return `<li class="gl gl--unknown">
            <span class="gl-src">${esc(it.from)}</span>
            <span class="gl-sol" title="No Solresol word for this">?</span>
            <span class="gl-sw"></span>
            <span class="gl-sense">no word</span>
          </li>`;
        }
        const idx = wi++;
        const t = written(it.notes, it.form, { capital: k === firstKnown });
        const src = dir === 'en' ? (it.from ? esc(it.from) : '<i aria-hidden="true">·</i>') : '';
        return `<li class="gl gl--${it.role}" data-wi="${idx}" style="--i:${k}">
          ${dir === 'en' ? `<span class="gl-src">${src}</span>` : ''}
          <button type="button" class="gl-sol" data-open="${it.notes.join('-')}" title="${esc(it.definition || it.gloss)}">${esc(t)}</button>
          <span class="gl-sw">${swatches(it.notes)}</span>
          <span class="gl-sense">${esc(it.gloss)}</span>
          ${role ? `<span class="gl-role">${role}</span>` : ''}
        </li>`;
      }).join('');

      const line = known.map((it, k) => written(it.notes, it.form, { capital: k === 0 })).join(' ') + (r.question ? '?' : '.');
      const english = r.items.map((i) => (i.notes ? (i.role === 'tense' ? `(${i.gloss})` : i.gloss) : `[${i.from}]`)).join(' ');
      const notes = r.notes.map(esc);
      if (missing.length) notes.push(`${missing.length === 1 ? 'One word has' : `${missing.length} words have`} no Solresol in Sudre’s dictionary (${missing.map((m) => `“${esc(m.from)}”`).join(', ')}) — left out of the sound, never guessed.`);

      out.innerHTML = `
        <div class="tr-sent" data-score>
          <ol class="gloss" aria-label="Word by word">${cols}</ol>
          ${words.length ? `
          <figure class="plate tr-score">
            <p class="tr-read"><span class="tr-read-sol">${esc(line)}</span>
              <span class="tr-read-en">${dir === 'en' ? `“${esc(q)}”` : esc(english)}</span></p>
            <div class="tr-staff">${staffSVG(words, { labels: false })}</div>
            ${colorStripSVG(words, { height: 16 })}
            <div class="controls tr-score-acts">
              <button type="button" class="btn btn--ink" data-play="${encSentence(words)}">▶ Hear the sentence</button>
              <button type="button" class="btn" data-add="${encSentence(words)}">＋ Use this sentence</button>
            </div>
            <figcaption class="plate-caption">${words.length} word${words.length === 1 ? '' : 's'} · ${words.flat().length} notes</figcaption>
          </figure>` : ''}
          ${notes.length ? `<ul class="tr-notes">${notes.map((n) => `<li>${n}</li>`).join('')}</ul>` : ''}
        </div>`;
    }

    const onInput = () => render();
    input.addEventListener('input', onInput);
    el.addEventListener('click', (e) => {
      const d = e.target.closest('[data-dir]');
      if (d) { setDir(d.dataset.dir); return; }
      const t = e.target.closest('[data-try]');
      if (t && t.dataset.try) { input.value = t.dataset.try; render(); }
    });
    setDir('en');
    return { destroy() { input.removeEventListener('input', onInput); } };
  }
  return { mountSentenceLeaf };
})();

const __m_translate_phrases = (() => {

  // before its subject — never an appended particle. `lit` is the word-for-word

  // "condensed" forms left out (no source for them in the master reference).

  const PHRASEBOOK = [
    {
      id: 'greetings', label: 'Greetings', note: 'Sudre gave the greetings their own short words.',
      phrases: [

      ],

    {
      id: 'questions', label: 'Questions', note: 'A question puts the verb before its subject. There is no question word to add.',
      phrases: [

        { en: 'Why?', sol: 'Solre?', lit: ['why?'] },
        { en: 'How?', sol: 'Sido?', lit: ['how'] },

        { en: 'Do you understand?', sol: 'Falafa domi?', lit: ['understand', 'you'] },

        { en: 'Please repeat', sol: 'Mifare, solsol sifala', lit: ['please', '(imperative)', 'repeat'] },
        { en: 'Please speak slowly', sol: 'Mifare, solsol domilado remisifa', lit: ['please', '(imperative)', 'speak', 'slowly'] },
        { en: 'Write that', sol: 'Solsol lamire fare', lit: ['(imperative)', 'write', 'that'] },
        { en: 'Wait!', sol: 'Solsol sifasol', lit: ['(imperative)', 'wait'] },
        { en: 'I speak Solresol', sol: 'Dore domilado solresol', lit: ['I', 'speak', 'language'] },
      ],
    },
    {
      id: 'social', label: 'Social', note: 'Plural is an acute on the last syllable (doré, we); feminine a bar (dofā, she).',
      phrases: [
        { en: 'I love you', sol: 'Dore milasi domi', lit: ['I', 'love', 'you'] },
        { en: 'Well done!', sol: 'Misol!', lit: ['well done'] },

// === translate/composer.model.js ===
const __m_translate_composer_model = (() => {
  const { TENSE_MARKERS, partOfSpeech, markWord } = __m_dictionary_grammar;

  // The composer — a sentence built from slots, ordered by the canonical
  // grammar (Gajewski; docs/SOLRESOL_MASTER.md §6). Pure: no DOM.
  //
  //   statement   Subject [tense] [do] Verb Adverb Object Adjective
  //   question    [tense] [do] Verb Subject Adverb Object Adjective      (inversion, no particle)
  //
  //   · the tense is a doubled particle standing before the verb (dodo, mimi …)
  //   · negation is "do", once, immediately before the word it negates
  //   · adjectives follow their noun — the object's, or the subject's if alone
  //   · the tonic accent marks what a root is doing: a noun is stressed on its
  //     first syllable, an adjective on its penultimate, an adverb on its last;
  //     the verb is written plain (§6.2)
  //
  // A slot is { notes, form?: { plural, feminine }, pronoun?: true } or null.

  const SLOTS = ['subject', 'verb', 'object', 'adjective', 'adverb'];

  // The personal pronouns of the canon (§6.6): plural = acute, feminine = macron.
  const PRONOUN_CHOICES = [
    { en: 'I',         notes: ['do', 're'], form: {} },
    { en: 'we',        notes: ['do', 're'], form: { plural: true } },
    { en: 'you',       notes: ['do', 'mi'], form: {} },
    { en: 'you (all)', notes: ['do', 'mi'], form: { plural: true } },
    { en: 'he',        notes: ['do', 'fa'], form: {} },
    { en: 'she',       notes: ['do', 'fa'], form: { feminine: true } },
    { en: 'they',      notes: ['do', 'fa'], form: { plural: true } },
    { en: 'oneself',   notes: ['do', 'sol'], form: {} },
  ];

  // TENSE_MARKERS, as a menu: [{ key: 'dodo', notes: ['do','do'], name: 'past' }, …]
  const TENSES = Object.entries(TENSE_MARKERS).map(([key, name]) => ({
    key, name, notes: key.match(/do|re|mi|fa|sol|la|si/g),
  }));

  // Which syllable to stress so a root plays its role, if the word is long
  // enough for that accent to be unambiguous; -1 = written plain.
  function accentFor(role, notes, pronoun = false) {
    if (pronoun || !notes || notes.length < 2) return -1;
    const want = { subject: ['noun (thing)', 0], object: ['noun (thing)', 0],
      adjective: ['adjective', notes.length - 2], adverb: ['adverb', notes.length - 1] }[role];
    if (!want) return -1;
    return partOfSpeech(notes, want[1]) === want[0] ? want[1] : -1;
  }

  // → [{ role, notes, text, form, accent }]  role ∈ subject|verb|object|adjective|adverb|tense|negation
  function compose(parts = {}) {
    const { tense = null, negate = null, question = false } = parts;
    const out = [];
    const word = (role) => {
      const s = parts[role];
      if (!s || !s.notes || !s.notes.length) return;
      if (negate === role) out.push({ role: 'negation', notes: ['do'], text: 'do', form: {}, accent: -1 });
      const accent = accentFor(role, s.notes, !!s.pronoun);
      const form = s.form || {};
      out.push({ role, notes: s.notes.slice(), form, accent, pronoun: !!s.pronoun, text: markWord(s.notes, { ...form, accent }) });
    };
    const verbPhrase = () => {
      const t = TENSES.find((x) => x.key === tense || x.name === tense);
      if (t && parts.verb) out.push({ role: 'tense', notes: t.notes.slice(), text: t.key, name: t.name, form: {}, accent: -1 });
      word('verb');
    };

    const hasObject = !!(parts.object && parts.object.notes && parts.object.notes.length);
    if (question && parts.verb) {
      verbPhrase();
      word('subject');
      if (!hasObject) word('adjective');
    } else {
      word('subject');
      if (!hasObject) word('adjective');
      verbPhrase();
    }
    word('adverb');
    if (hasObject) { word('object'); word('adjective'); }
    return out;
  }

  // The sentence written out: words joined, capitalised, with its stop.
  function writeOut(words, question = false) {
    if (!words.length) return '';
    const s = words.map((w) => w.text).join(' ');
    return s.charAt(0).toUpperCase() + s.slice(1) + (question ? '?' : '.');
  }

  // The canonical rules a composition is using — shown beside the result.
  function rulesInPlay(parts = {}) {
    const r = [];
    if (parts.verb && parts.subject) r.push(parts.question ? 'question' : 'order');
    if (parts.tense && parts.verb) r.push('tense');
    if (parts.negate && parts[parts.negate]) r.push('negation');
    if (parts.adjective) r.push('adjective');
    return r;
  }
  return { SLOTS, PRONOUN_CHOICES, TENSES, accentFor, compose, writeOut, rulesInPlay };
})();

// === views/translate/composer.leaf.js ===
const __m_views_translate_composer_leaf = (() => {
  const { cap } = __m_dictionary_notes;
  const { getIndex } = __m_dictionary_dictionary;
  const { staffSVG, colorStripSVG } = __m_graphics_graphics;
  const { compose, writeOut, rulesInPlay, SLOTS, TENSES, PRONOUN_CHOICES } = __m_translate_composer_model;
  const { lookup, shortGloss, readNotes } = __m_translate_lookup;
  const { esc, swatches, written, encSentence } = __m_views_translate_parts;

  // The composer — five slots for the parts of speech, a tense, a negation,
  // a mood. The grammar (src/translate/composer.model.js) puts the words in
  // their canonical places; the result is written with its accents, sung,
  // and can be sent to the sentence.

  const SLOT_INFO = {
    subject:   { label: 'Subject',   hint: 'who',       num: 'i' },
    verb:      { label: 'Verb',      hint: 'does',      num: 'ii' },
    object:    { label: 'Object',    hint: 'what',      num: 'iii' },
    adjective: { label: 'Adjective', hint: 'kind',      num: 'iv' },
    adverb:    { label: 'Adverb',    hint: 'how',       num: 'v' },
  };
  const ROLE_LABEL = { subject: 'subject', verb: 'verb', object: 'object', adjective: 'adjective', adverb: 'adverb', tense: 'tense', negation: 'negation' };

  const pron = (en) => { const p = PRONOUN_CHOICES.find((x) => x.en === en); return { notes: p.notes, form: p.form, pronoun: true, en: p.en }; };
  const entry = (text) => { const notes = text.match(/do|re|mi|fa|sol|la|si/g); return { notes, en: shortGloss(getIndex().meaningOf(text)) }; };

  function mountComposerLeaf(el) {
    const slots = { subject: pron('I'), verb: entry('milasi'), object: pron('you'), adjective: null, adverb: null };
    let tense = '', negate = null, question = false;

    el.innerHTML = `
      <p class="hint cm-intro">Fill the slots in any order — the grammar sets the words in their places.
        Search in English or in Solresol.</p>
      <div class="cm-slots">
        ${SLOTS.map((s) => `
          <div class="cm-slot" data-slot="${s}">
            <p class="cm-slot-label"><span class="cm-slot-num">${SLOT_INFO[s].num}</span>${SLOT_INFO[s].label}<span class="cm-slot-hint">${SLOT_INFO[s].hint}</span></p>
            <div class="cm-chosen" data-chosen></div>
            ${s === 'subject' || s === 'object' ? `<div class="cm-prons" role="group" aria-label="Pronouns">${PRONOUN_CHOICES.map((p) =>
              `<button type="button" class="cm-pron" data-pron="${p.en}" title="${p.en}">${esc(written(p.notes, p.form, { capital: false }))}</button>`).join('')}</div>` : ''}
            <div class="cm-search-wrap">
              <input class="field cm-search" data-search type="search" placeholder="find ${/^[AO]/.test(SLOT_INFO[s].label) ? 'an' : 'a'} ${SLOT_INFO[s].label.toLowerCase()}…" autocomplete="off" spellcheck="false" aria-label="Find a ${SLOT_INFO[s].label.toLowerCase()}">
              <ul class="cm-results" data-results hidden></ul>
            </div>
          </div>`).join('')}
      </div>

      <div class="cm-inflect">
        <label class="cm-ctl">
          <span class="cm-ctl-label">Tense</span>
          <select class="field cm-tense" data-tense>
            <option value="">present — no particle</option>
            ${TENSES.map((t) => `<option value="${t.key}">${cap(t.key)} — ${t.name}</option>`).join('')}
          </select>
        </label>
        <div class="cm-ctl">
          <span class="cm-ctl-label">Negate</span>
          <div class="seg cm-seg" role="group" aria-label="Negate which word">
            <button type="button" class="seg-btn" data-neg="">none</button>
            ${SLOTS.map((s) => `<button type="button" class="seg-btn" data-neg="${s}">${s === 'adjective' ? 'adj.' : s === 'adverb' ? 'adv.' : s}</button>`).join('')}
          </div>
        </div>
        <div class="cm-ctl">
          <span class="cm-ctl-label">Mood</span>
          <div class="seg cm-seg" role="group" aria-label="Statement or question">
            <button type="button" class="seg-btn" data-q="0">statement</button>
            <button type="button" class="seg-btn" data-q="1">question</button>
          </div>
        </div>
      </div>

      <div data-result aria-live="polite"></div>`;

    const resultEl = el.querySelector('[data-result]');

    function renderSlots() {
      for (const s of SLOTS) {
        const box = el.querySelector(`[data-slot="${s}"]`), v = slots[s];
        box.classList.toggle('is-filled', !!v);
        box.querySelector('[data-chosen]').innerHTML = v
          ? `<button type="button" class="cm-chosen-word" data-open="${v.notes.join('-')}">${esc(written(v.notes, v.form || {}))}</button>
             ${swatches(v.notes)}<span class="cm-chosen-en">${esc(v.en || '')}</span>
             <button type="button" class="cm-clear" data-clear="${s}" aria-label="Empty the ${s} slot" title="Empty">×</button>`
          : '<span class="cm-empty">—</span>';
        box.querySelectorAll('[data-pron]').forEach((b) => b.setAttribute('aria-pressed', String(!!(v && v.pronoun && v.en === b.dataset.pron))));
      }
      el.querySelectorAll('[data-neg]').forEach((b) => {
        const k = b.dataset.neg;
        b.disabled = !!k && !slots[k];
        b.setAttribute('aria-pressed', String((negate || '') === k));
      });
      el.querySelectorAll('[data-q]').forEach((b) => b.setAttribute('aria-pressed', String((b.dataset.q === '1') === question)));
    }

    function glossOf(w) {
      if (w.role === 'tense') return `(${w.name})`;
      if (w.role === 'negation') return 'not';
      const s = slots[w.role];
      return s?.en || shortGloss(getIndex().meaningOf(w.notes.join(''))) || '';
    }

    function renderResult() {
      if (negate && !slots[negate]) negate = null;
      const parts = { ...slots, tense: tense || null, negate, question };
      const ws = compose(parts);
      if (!ws.length) {
        resultEl.innerHTML = '<p class="tr-empty cm-none">Choose a word for a slot, and the sentence will be set here.</p>';
        return;
      }
      const words = ws.map((w) => w.notes);
      const line = writeOut(ws, question && !!slots.verb);
      const english = ws.map(glossOf).join(' ') + (question ? '?' : '');
      const rules = rulesInPlay(parts);
      const t = TENSES.find((x) => x.key === tense);
      const notes = [];
      if (rules.includes('question')) notes.push('<b>Question</b> — the verb comes before its subject. Nothing is added: no particle, only the order (§6.5).');
      else if (rules.includes('order')) notes.push('<b>Order</b> — subject, verb, object, as in English (§6.1).');
      if (rules.includes('tense')) notes.push(`<b>Tense</b> — the particle <i>${t.key}</i> (${t.name}) stands before the verb, the same for every person; the verb itself never changes (§6.4).`);
      if (tense && !slots.verb) notes.push('<b>Tense</b> — a tense particle needs a verb to stand before.');

      if (rules.includes('adjective')) notes.push(`<b>Adjective</b> — it follows its noun (§6.1).`);
      if (ws.some((w) => w.accent >= 0)) notes.push('<b>Accent</b> — the circumflex marks the stressed note that tells a root its part: first for a noun, next-to-last for an adjective, last for an adverb. The verb is written plain (§6.2).');
      if (tense === 'solsol' && slots.subject) notes.push('<b>Imperative</b> — the subject is usually left out: <i>solsol sifala</i>, “repeat!”.');

      resultEl.innerHTML = `
        <figure class="plate cm-result" data-score>
          <ol class="cm-words">
            ${ws.map((w, i) => `<li class="cm-w cm-w--${w.role}" data-wi="${i}" style="--i:${i}">
              <button type="button" class="cm-w-sol" data-open="${w.notes.join('-')}">${esc(i === 0 ? cap(w.text) : w.text)}</button>
              ${swatches(w.notes)}
              <span class="cm-w-role">${ROLE_LABEL[w.role]}</span>
              <span class="cm-w-en">${esc(glossOf(w))}</span>
            </li>`).join('')}
            <li class="cm-stop" aria-hidden="true">${question && slots.verb ? '?' : '.'}</li>
          </ol>
          <p class="tr-read cm-read"><span class="tr-read-sol">${esc(line)}</span><span class="tr-read-en">${esc(english)}</span></p>
          <div class="tr-staff">${staffSVG(words)}</div>
          ${colorStripSVG(words, { height: 14 })}
          <div class="controls tr-score-acts">
            <button type="button" class="btn btn--ink" data-play="${encSentence(words)}">▶ Hear it</button>
            <button type="button" class="btn" data-add="${encSentence(words)}">＋ Use this sentence</button>
            <button type="button" class="btn btn--ghost" data-reset>Clear</button>
          </div>
          <figcaption class="plate-caption">Set by the grammar of Gajewski, 1902</figcaption>
        </figure>
        ${notes.length ? `<ul class="tr-notes cm-rules">${notes.map((n) => `<li>${n}</li>`).join('')}</ul>` : ''}`;
    }

    function render() { renderSlots(); renderResult(); }

    // search a slot
    let timer = 0;
    function search(input) {
      const box = input.closest('[data-slot]'), res = box.querySelector('[data-results]');
      const q = input.value.trim();
      if (!q) { res.hidden = true; res.innerHTML = ''; return; }
      const list = lookup(getIndex(), q, 7);
      const english = !readNotes(q);     // an English search: gloss the word by what was asked
      res.hidden = false;
      res.innerHTML = list.length
        ? list.map((c) => `<li><button type="button" class="cm-hit" data-pick="${c.notes.join('-')}" data-en="${esc(english ? (c.via || q).toLowerCase() : shortGloss(c.definition))}">
            <b>${esc(cap(c.notes.join('')))}</b>${swatches(c.notes)}<span>${esc(c.definition)}</span></button></li>`).join('')
        : `<li class="cm-nohit">No word for “${esc(q)}”.</li>`;
    }
    function onInput(e) {
      const input = e.target.closest('[data-search]');
      if (input) { clearTimeout(timer); timer = setTimeout(() => search(input), 120); }
      const sel = e.target.closest('[data-tense]');
      if (sel) { tense = sel.value; render(); }
    }
    function onClick(e) {
      const t = e.target;
      const pick = t.closest('[data-pick]');
      if (pick) {
        const box = pick.closest('[data-slot]'), s = box.dataset.slot;
        slots[s] = { notes: pick.dataset.pick.split('-'), en: pick.dataset.en };
        const input = box.querySelector('[data-search]'); input.value = '';
        box.querySelector('[data-results]').hidden = true;
        render(); return;
      }
      const p = t.closest('[data-pron]');
      if (p) { const s = p.closest('[data-slot]').dataset.slot; slots[s] = pron(p.dataset.pron); render(); return; }
      const c = t.closest('[data-clear]');
      if (c) { slots[c.dataset.clear] = null; render(); return; }
      const n = t.closest('[data-neg]');
      if (n && !n.disabled) { negate = n.dataset.neg || null; render(); return; }
      const q = t.closest('[data-q]');
      if (q) { question = q.dataset.q === '1'; render(); return; }
      if (t.closest('[data-reset]')) {
        for (const s of SLOTS) slots[s] = null;
        tense = ''; negate = null; question = false;
        el.querySelector('[data-tense]').value = '';
        render(); return;
      }
      // a click elsewhere closes open result lists
      if (!t.closest('.cm-search-wrap')) el.querySelectorAll('[data-results]').forEach((r) => { r.hidden = true; });
    }
    function onKey(e) {
      if (e.key === 'Enter' && e.target.matches('[data-search]')) {
        clearTimeout(timer); search(e.target);
        e.target.closest('[data-slot]').querySelector('[data-pick]')?.click();
      }
      if (e.key === 'Escape' && e.target.matches('[data-search]')) {
        e.target.value = ''; e.target.closest('[data-slot]').querySelector('[data-results]').hidden = true;
      }
    }

    el.addEventListener('input', onInput);
    el.addEventListener('change', onInput);
    el.addEventListener('click', onClick);
    el.addEventListener('keydown', onKey);
    render();
    return {
      destroy() {
        clearTimeout(timer);
        el.removeEventListener('input', onInput); el.removeEventListener('change', onInput);
        el.removeEventListener('click', onClick); el.removeEventListener('keydown', onKey);
      },
    };
  }
  return { mountComposerLeaf };
})();

// === views/translate/translate.view.js ===
const __m_views_translate_translate_view = (() => {
  const { emit } = __m_live_bus;
  const { playWord, playSentence } = __m_voices_index;
  const { schedule } = __m_compose_sentence_model;
  const { decSentence } = __m_views_translate_parts;
  const { mountWordsLeaf } = __m_views_translate_words_leaf;
  const { mountSentenceLeaf } = __m_views_translate_sentence_leaf;
  const { mountPhrasebookLeaf } = __m_views_translate_phrasebook_leaf;
  const { mountComposerLeaf } = __m_views_translate_composer_leaf;

  // Chapter III · Translation — four leaves, each its own address:
  //   #/translate             words, both ways
  //   #/translate/sentence    a sentence, both ways
  //   #/translate/phrasebook  phrases that hold to the canon
  //   #/translate/compose     a sentence built by the grammar
  //
  // Every word on these pages opens its own page (ctx.openWord); ▶ sounds it,
  // ＋ sends it to the sentence being said (bus: sentence:add).

  const LEAVES = [
    { id: 'words',      href: 'translate',            label: 'Words',      mount: mountWordsLeaf },
    { id: 'sentence',   href: 'translate/sentence',   label: 'Sentences',  mount: mountSentenceLeaf },
    { id: 'phrasebook', href: 'translate/phrasebook', label: 'Phrasebook', mount: mountPhrasebookLeaf },
    { id: 'compose',    href: 'translate/compose',    label: 'Composer',   mount: mountComposerLeaf },
  ];

  function mountTranslateView(host, ctx, route) {
    host.classList.add('tr');
    host.innerHTML = `
      <p class="lede tr-lede">Seven notes are enough to say anything. Carry a word across,
        then a sentence; keep the phrases a traveller needs; or set the parts of speech
        in their places and let the grammar order them.</p>
      <nav class="tabs tr-tabs" aria-label="Translation">
        ${LEAVES.map((l) => `<a class="tab" href="#/${l.href}" data-leaf="${l.id}">${l.label}</a>`).join('')}
      </nav>
      <div class="tr-leaves"></div>`;
    const leavesEl = host.querySelector('.tr-leaves');
    const mounted = new Map();          // id → { el, handle }
    const timers = new Set();

    function show(r) {
      const id = LEAVES.some((l) => l.id === r?.sub) ? r.sub : 'words';
      host.querySelectorAll('[data-leaf]').forEach((a) => {
        const on = a.dataset.leaf === id;
        a.classList.toggle('is-on', on);
        if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
      });
      if (!mounted.has(id)) {
        const el = document.createElement('section');
        el.className = `tr-leaf tr-leaf--${id}`;
        leavesEl.append(el);
        mounted.set(id, { el, handle: LEAVES.find((l) => l.id === id).mount(el, ctx) });
      }
      for (const [k, m] of mounted) m.el.hidden = k !== id;
      mounted.get(id).handle?.shown?.();
    }

    // One listener for the whole chapter: open, play, add.
    function onClick(e) {
      const t = e.target.closest('[data-open],[data-play],[data-add]');
      if (!t || !host.contains(t)) return;
      if (t.dataset.open !== undefined) { ctx.openWord(t.dataset.open.split('-')); return; }
      if (t.dataset.play !== undefined) { play(t, decSentence(t.dataset.play)); return; }
      if (t.dataset.add !== undefined) {
        const words = decSentence(t.dataset.add);
        words.forEach((notes) => emit('sentence:add', notes));
        flash(t);
      }
    }

    function play(btn, words) {
      if (!words.length) return;
      words.forEach((notes) => emit('word:used', { key: notes.join(''), channel: 'translate' }));
      // light each word of the score as it sounds
      const score = btn.closest('[data-score]');
      const cells = score ? [...score.querySelectorAll('[data-wi]')] : [];
      let offsets = [0], total;
      if (words.length === 1) { playWord({ notes: words[0] }); total = words[0].length * 0.32; }
      else { total = playSentence(words.map((notes) => ({ notes }))); offsets = schedule(words.map((w) => w.length)); }
      btn.classList.add('is-sounding');
      later(() => btn.classList.remove('is-sounding'), (total + 0.2) * 1000);
      cells.forEach((c) => {
        const i = Number(c.dataset.wi), at = offsets[i];
        if (at === undefined) return;
        later(() => c.classList.add('is-sounding'), at * 1000);
        later(() => c.classList.remove('is-sounding'), (at + words[i].length * (words.length === 1 ? 0.32 : 0.28)) * 1000);
      });
    }
    function later(fn, ms) { const id = setTimeout(() => { timers.delete(id); fn(); }, ms); timers.add(id); }
    function flash(btn) {
      btn.classList.add('is-done');
      later(() => btn.classList.remove('is-done'), 1300);
    }

    host.addEventListener('click', onClick);
    show(route);

    return {
      update: show,
      destroy() {
        host.removeEventListener('click', onClick);
        timers.forEach(clearTimeout);
        for (const m of mounted.values()) m.handle?.destroy?.();
        host.classList.remove('tr');
        host.textContent = '';
      },
    };
  }
  return { mountTranslateView };
})();

// === views/learn/common.js ===
const __m_views_learn_common = (() => {
  const { note, cap, parse } = __m_dictionary_notes;
  const { playNote } = __m_voices_index;

  // Small shared pieces for the School's pages: escaping, a word written
  // as a link into its panel, a word's colours, and speech with a tonic
  // accent (a rinforzando: the stressed note is held and doubled).

  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // A word as a clickable link to its own page. `shown` is the written form
  // (with marks) when it differs from the dictionary key.
  function wordLink(key, { shown = null, cls = '' } = {}) {
    const k = parse(key).join('');
    return `<button type="button" class="ln-w ${cls}" data-word="${k}" title="Open ${cap(k)}">${esc(cap(shown || k))}</button>`;
  }

  const swatches = (notes) =>
    `<span class="swatches" aria-hidden="true">${notes.map((n) => `<i style="background:${note(n).color}"></i>`).join('')}</span>`;

  // Play a word as it is spoken with its marks: the accented syllable is
  // longer and doubled (louder); the feminine / plural lengthen the last.
  function sayWord(notes, { accent = -1, feminine = false, plural = false } = {}, when = 0) {
    let t = when;
    notes.forEach((n, i) => {
      const last = i === notes.length - 1;
      const stressed = i === accent;
      const dur = stressed ? 0.62 : (last && (feminine || plural)) ? 0.75 : 0.36;
      playNote(n, t, dur);
      if (stressed) playNote(n, t, dur);
      t += dur - 0.04;
    });
    return t - when;
  }

  // Play a list of words with a breath between them.
  function saySentence(words, gap = 0.28) {
    let t = 0;
    for (const w of words) { t += sayWord(Array.isArray(w) ? w : w.notes, w.marks || {}, t) + gap; }
    return t;
  }

  // A tiny delegated handler: clicks on [data-word] open that word's panel.
  function bindWordLinks(host, ctx) {
    const onClick = (e) => {
      const t = e.target.closest('[data-word]');
      if (!t || !host.contains(t)) return;
      e.preventDefault();
      ctx.openWord(t.dataset.word);
    };
    host.addEventListener('click', onClick);
    return () => host.removeEventListener('click', onClick);
  }

  const today = () => new Date().toISOString().slice(0, 10);

  function loadJSON(key) {
    try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; } catch { return null; }
  }
  function saveJSON(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* private mode or quota */ }
  }
  return { esc, wordLink, swatches, sayWord, saySentence, bindWordLinks, today, loadJSON, saveJSON };
})();

// === learn/quiz.model.js ===
const __m_learn_quiz_model = (() => {
  const { NOTES, parse, cap } = __m_dictionary_notes;
  const { SEMANTIC_KEYS, accentForms, partOfSpeech, markWord, reverse, TENSE_MARKERS } = __m_dictionary_grammar;

  // The pure core of the School's examinations — no DOM, no storage, no
  // clock. Progress is a plain object passed in and handed back new;
  // randomness is a function passed in, so every question is testable.
  //
  // Five levels, each unlocked by ten right answers in the one before:
  //   I   the ear         a note sounds — name it
  //   II  the families    three words share a key — which?
  //   III the mirror      reverse the word, reverse the thought
  //   IV  the grammar     read the accent, the particle, the mark (Gajewski)
  //   V   composition     build the word from its meaning

  const QUIZ_KEY = 'solresol:quiz';
  const UNLOCK_AT = 10;

  const LEVELS = [
    { id: 'ear',     numeral: 'I',   title: 'The Ear',       task: 'A note sounds. Name it.' },
    { id: 'family',  numeral: 'II',  title: 'The Families',  task: 'Three words share a key. Which family?' },
    { id: 'mirror',  numeral: 'III', title: 'The Mirror',    task: 'Reverse the word, reverse the thought.' },
    { id: 'grammar', numeral: 'IV',  title: 'The Grammar',   task: 'Read the accent, the particle, the mark.' },
    { id: 'compose', numeral: 'V',   title: 'Composition',   task: 'Build the word from its meaning.' },
  ];

  // Opposites by reversal that the dictionary itself bears out. Reversal is
  // a principle with exceptions (SOLRESOL_MASTER §7), so the Mirror level
  // only examines pairs whose two glosses really are opposed.
