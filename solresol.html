      ${head('keys')}
      <p>In a four-note word without a repeated note, the <b>first note is a key</b>: it names the region of thought the word belongs to.
        Meaning can be half-guessed from sound.</p>
      <table class="ln-table ln-keytable">
        <thead><tr><th>Key</th><th>Its domain</th><th>For example</th></tr></thead>
        <tbody>
          ${NOTES.map((n) => `<tr>
            <td><span class="ln-key" style="--c:${n.color}">${cap(n.name)}</span></td>
            <td>${FAMILY_FULL[n.name]}</td>
            <td class="ln-keys-ex">${FAMILY_EXAMPLES[n.name].map((k) => `${wordLink(k)} <i>${esc(shortGloss(meaningOf(k), 1))}</i>`).join('<br>')}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </section>

    <section class="ln-para" id="g-accent">
      ${head('accent')}
      <p>One root serves as verb, noun, adjective and adverb. What changes is the <b>tonic accent</b> — in speech a
        <i>rinforzando</i> on one syllable, in writing a mark above it. The <b>verb</b> is the bare word; the accent on
        the <b>first</b> syllable makes a noun of the thing, on the <b>second</b> a noun of the person, on the
        <b>penultimate</b> an adjective, on the <b>last</b> an adverb. Gajewski's paradigm is ${wordLink('sirelasi')}, <i>to constitute</i>:</p>
      <table class="ln-table ln-paradigm">
        <thead><tr><th></th><th>Part of speech</th><th>Accent</th><th>Written</th><th>Meaning</th></tr></thead>
        <tbody>
          ${accentForms(sire).map((f) => `<tr>
            <td>${play([tok('sirelasi', { accent: f.accent })], 'Hear ' + f.role)}</td>
            <td class="sc">${f.role}</td>
            <td>${accentName[f.accent]}</td>
            <td class="ln-written">${form('sirelasi', { accent: f.accent })}</td>
            <td><i>${glossSire[f.accent]}</i></td>
          </tr>`).join('')}
        </tbody>
      </table>
      <p>So too ${wordLink('midofa')}, <i>to prefer</i>: ${form('midofa', { accent: 1 })} <i>preferable</i>,
        ${form('midofa', { accent: 2 })} <i>preferably</i>. On a word of three notes the second syllable is also the
        penultimate, and the adjective takes it. Every word's own page lets you try its forms.</p>
    </section>

    <section class="ln-para" id="g-gender">
      ${head('gender')}
      <p>Only the <b>feminine</b> is marked: the last vowel is lengthened in speech, and written with a bar (¯).
        The <b>plural</b> is marked by an acute (´) on the last syllable, lengthened too. The masculine and the singular are unmarked.</p>
      <div class="ln-forms-grid">
        ${[
          ['dofa', {}, 'he'], ['dofa', { feminine: true }, 'she'], ['dofa', { plural: true }, 'they'], ['dofa', { feminine: true, plural: true }, 'they (fem.)'],
        ].map(([k, m, g]) => `<div class="ln-formcard">${play([tok(k, m)], 'Hear ' + g)}<b>${form(k, m)}</b><i>${g}</i></div>`).join('')}
      </div>
    </section>

    <section class="ln-para" id="g-tense">
      ${head('tense')}
      <p>The verb never changes. Its tense is carried by a <b>doubled note</b> set before it — the same for every person,
        since the pronoun already says who. The present is the bare verb. These seven doubled notes are reserved for
        this work alone.</p>
      <table class="ln-table ln-tenses">
        <thead><tr><th>Particle</th><th>Tense or mood</th><th>Gajewski</th><th>With ${wordLink('milasi')}, <i>to love</i></th><th></th></tr></thead>
        <tbody>
          ${tenseRows.map((r) => {
            const [line, en] = r.p ? TENSE_EX[r.p] : ['dore milasi', 'I love'];
            const words = line.split(' ');
            return `<tr>
              <td>${r.p ? wordLink(r.p) : '<span class="ln-none">—</span>'}</td>
              <td class="sc">${r.p ? r.name : 'present'}</td>
              <td><i>${r.p ? GAJ[r.p] : 'infinitif seul'}</i></td>
              <td><span class="ln-inline-sent">${words.map((w) => wordLink(w)).join(' ')}</span> <i class="ln-en">${en}</i></td>
              <td>${play(words.map((w) => tok(w)), 'Hear: ' + en)}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
      <p class="hint">The passive and the compound tenses use ${wordLink('faremi')}, <i>to be</i>, and ${wordLink('famisol')}, <i>to have</i>, between the particle and the verb.</p>
    </section>

    <section class="ln-para" id="g-negation">
      ${head('negation')}
      <p>To deny, put ${wordLink('do')} — <i>no, not</i> — <b>once</b>, just before the word denied. It is never doubled.</p>
      ${example([{ k: 'dore', g: 'I' }, { k: 'do', g: 'not' }, { k: 'milasi', g: 'love' }], 'I do not love.')}
      <p>And ${wordLink('si')}, the highest note, is <i>yes</i>.</p>
    </section>

    <section class="ln-para" id="g-question">
      ${head('question')}
      <p>There is no word for asking. A question is made by <b>inversion</b>: the pronoun comes after the verb.</p>
      ${example([{ k: 'domi', g: 'you' }, { k: 'mifala', g: 'want' }], 'You want.')}
      ${example([{ k: 'mifala', g: 'want' }, { k: 'domi', g: 'you', punct: '?' }], 'Do you want?')}
      ${example([{ k: 'do', g: 'not' }, { k: 'mifala', g: 'want' }, { k: 'domi', g: 'you', punct: '?' }], "Don't you want?", { note: 'negation and inversion together' })}
    </section>

    <section class="ln-para" id="g-pronouns">
      ${head('pronouns')}
      <p>The personal pronouns all begin with ${wordLink('do')}. Their plurals take the acute, the feminine the bar — as any word does.
        The possessives are the same words with the first note moved up to ${wordLink('re')}.</p>
      <div class="ln-two-tables">
        <table class="ln-table">
          <thead><tr><th colspan="2">Singular</th><th colspan="2">Plural</th></tr></thead>
          <tbody>
            <tr><td>I, me</td><td>${form('dore')}</td><td>we</td><td>${form('dore', { plural: true })}</td></tr>
            <tr><td>you</td><td>${form('domi')}</td><td>you</td><td>${form('domi', { plural: true })}</td></tr>
            <tr><td>he</td><td>${form('dofa')}</td><td>they</td><td>${form('dofa', { plural: true })}</td></tr>
            <tr><td>she</td><td>${form('dofa', { feminine: true })}</td><td>oneself</td><td>${form('dosol')}</td></tr>
          </tbody>
        </table>
        <table class="ln-table">
          <thead><tr><th colspan="2">Possessive</th><th colspan="2">Others</th></tr></thead>
          <tbody>
            <tr><td>my</td><td>${wordLink('redo')}</td><td>who, which</td><td>${wordLink('mire')}</td></tr>
            <tr><td>your</td><td>${wordLink('remi')}</td><td>this · that</td><td>${wordLink('fami')} · ${wordLink('fare')}</td></tr>
            <tr><td>his, her</td><td>${wordLink('refa')}</td><td>someone</td><td>${wordLink('dola')}</td></tr>
            <tr><td>our</td><td>${wordLink('resol')}</td><td>what</td><td>${wordLink('fado')}</td></tr>
            <tr><td>your (pl.)</td><td>${wordLink('rela')}</td><td>nothing</td><td>${wordLink('soldo')}</td></tr>
            <tr><td>their</td><td>${wordLink('resi')}</td><td></td><td></td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="ln-para" id="g-articles">
      ${head('articles')}
      <p>The one article is ${wordLink('la')}, <i>the</i>, and it declines. There is no indefinite article: where English says
        <i>a</i>, Solresol says nothing, or the numeral <i>one</i>.</p>
      <table class="ln-table">
        <thead><tr><th>Case</th><th>Singular</th><th>Feminine</th><th>Plural</th></tr></thead>
        <tbody>
          <tr><td>the <span class="hint">nom. · acc.</span></td><td>${wordLink('la')}</td><td>${form('la', { feminine: true })}</td><td>${wordLink('la', { shown: "l'a" })}</td></tr>
          <tr><td>to the <span class="hint">dative</span></td><td>${wordLink('fa')}</td><td>${form('fa', { feminine: true })}</td><td>${wordLink('fa', { shown: "f'a" })}</td></tr>
          <tr><td>of the <span class="hint">gen. · abl.</span></td><td>${wordLink('lasi')}</td><td>${form('lasi', { feminine: true })}</td><td>${wordLink('lasi', { shown: "la s'i" })}</td></tr>
        </tbody>
      </table>
    </section>

    <section class="ln-para" id="g-order">
      ${head('order')}
      <p>Subject, verb, object — as in English. The adjective always <b>follows</b> its noun; the indirect object always
        follows the verb. Idioms are first reduced to plain words, then translated.</p>
      ${example([{ k: 'dola', g: 'someone' }, { k: 'famisol', g: 'has' }, { k: 'mirefado', g: 'said' }, { k: 'fare', g: 'that' }], 'Someone has said that.')}
      ${example([{ k: 'mila', g: 'here is' }, { k: 'dolaresi', g: 'wine' }, { k: 're', g: 'and' }, { k: 'dosifare', g: 'beer' }], 'Here is wine and beer.')}
    </section>

    <section class="ln-para" id="g-reversal">
      ${head('reversal')}
      <p>Sudre's loveliest idea: <b>the inverse of the thought by the inverse of the sign</b>. Read a word backwards and,
        often, you say its opposite. Press a pair to hear the word and then its mirror.</p>
      <div class="ln-mirrors">
        ${OPPOSITES.map(([a, b]) => `<div class="ln-mirror-pair">
          ${play([tok(a), tok(b)], `Hear ${cap(a)} then ${cap(b)}`)}
          <span class="ln-mp-side">${swatches(parse(a))}${wordLink(a)}<i>${esc(shortGloss(meaningOf(a), 1))}</i></span>
          <span class="ln-mp-arrow" aria-hidden="true">⇄</span>
          <span class="ln-mp-side">${swatches(parse(b))}${wordLink(b)}<i>${esc(shortGloss(meaningOf(b), 1))}</i></span>
        </div>`).join('')}
      </div>
      <p>It is a principle, not a law. Umberto Eco noticed that it is applied unevenly, and mostly to short words:</p>
      <ul class="ln-exceptions">
        ${EXCEPTIONS.map(([a, b]) => `<li>${wordLink(a)} <i>${esc(shortGloss(meaningOf(a), 1))}</i> — reversed, ${wordLink(b)} <i>${esc(shortGloss(meaningOf(b), 1))}</i>.</li>`).join('')}
      </ul>
    </section>
    <div class="ornament" aria-hidden="true"></div>`;
  }

  function mountGrammar(host, ctx) {
    host.innerHTML = markup();
    const onClick = (e) => {
      const s = e.target.closest('[data-say]');
      if (s) {
        const words = s.dataset.say.split(' ').map(readTok);
        let t = 0;
        for (const w of words) t += sayWord(w.notes, w.marks, t) + 0.3;
        s.classList.remove('is-ringing'); void s.offsetWidth; s.classList.add('is-ringing');
        return;
      }
      const g = e.target.closest('[data-goto]');
      if (g) host.querySelector('#g-' + g.dataset.goto)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    };
    host.addEventListener('click', onClick);
    return { destroy() { host.removeEventListener('click', onClick); host.textContent = ''; } };
  }
  return { mountGrammar };
})();

  function mountQuiz(host, ctx) {
    let progress = normalize(loadJSON(QUIZ_KEY));
    let level = highestUnlocked(progress);

    host.innerHTML = `
      <section class="ln-exam">
        <header class="ln-exam-head">

          <div class="ln-ladder" data-ladder></div>
          <div class="ln-stats" data-stats></div>
        </header>
        <div class="plate ln-exam-card" data-card aria-live="polite"></div>
        <p class="hint ln-exam-keys">Keys <kbd>1</kbd>–<kbd>7</kbd> answer · <kbd>Enter</kbd> goes on · every word opens its page</p>
      </section>`;
    const $ = (s) => host.querySelector(s);
    const ladder = $('[data-ladder]'), stats = $('[data-stats]'), card = $('[data-card]');

    function renderLadder() {

      const justOpened = level + 1 < LEVELS.length && progress.levels[level] === UNLOCK_AT && right;
      card.querySelector('[data-fb]').innerHTML = `
        <p class="ln-verdict">${right ? '<span class="ln-tick">✓</span> Right.' : '<span class="ln-cross">✗</span> Not quite.'} ${explain(q)}</p>
        ${justOpened ? `<p class="ln-unlocked">Level ${LEVELS[level + 1].numeral} — <i>${LEVELS[level + 1].title}</i> — is open.</p>` : ''}
        <div class="controls ln-next-row"><button type="button" class="btn ${right ? '' : 'btn--ink'}" data-next>Next question ›</button></div>`;
      renderLadder(); renderStats();
      if (right && !justOpened) timer = setTimeout(next, q.kind === 'ear' ? 1300 : 2600);
    }

    function explain(q) {
      switch (q.kind) {
        case 'ear': { const n = note(q.target); return `It was <b>${cap(n.name)}</b> — note ${n.num}, ${COLOUR[n.name]}.`; }
        case 'family': return `All three begin with <b>${cap(q.key)}</b>, the key of <i>${esc(SEMANTIC_KEYS[q.key].toLowerCase())}</i>.`;
        case 'mirror-meaning':
        case 'mirror-form': return `${wordLink(q.word.key)} <i>${esc(shortGloss(q.word.def, 1))}</i> reversed is ${wordLink(q.mirror.key)} <i>${esc(shortGloss(q.mirror.def, 1))}</i>.`;
        case 'accent': return `The accent on the ${ORD[q.accent]} syllable makes ${esc(ROLE_LABEL[q.role])}: ${accentRule(q)}.`;
        case 'tense': return `${wordLink(q.particle)} before the verb marks ${esc(TENSE_EN[q.particle])}.`;
        case 'mark': return `${q.form.id === 'plain' ? 'No mark: masculine and singular.' : `${q.form.marks.feminine ? 'The bar (¯) is the feminine' : ''}${q.form.marks.feminine && q.form.marks.plural ? '; ' : ''}${q.form.marks.plural ? 'the acute (´) is the plural' : ''}.`}`;
        default: return `${wordLink(q.word.key)} — ${q.target.map((n) => cap(n)).join(' · ')} — <i>${esc(shortGloss(q.word.def, 2))}</i>.`;
      }
    }
    const accentRule = (q) => q.accent === 0 ? 'first, the thing' : q.accent === q.word.notes.length - 1 ? 'last, the adverb'
      : q.accent === q.word.notes.length - 2 ? 'penultimate, the adjective' : 'second, the person';

    // ── events ──
    const onClick = (e) => {
      heard = true;
      const t = e.target.closest('button'); if (!t || !host.contains(t)) return;
      if (t.dataset.level !== undefined) { level = Number(t.dataset.level); renderLadder(); next(); return; }
      if (t.dataset.opt !== undefined) { choose(Number(t.dataset.opt)); return; }
      if (t.dataset.hear !== undefined) { speak(); return; }
      if (t.dataset.next !== undefined) { next(); return; }
      if (t.dataset.add !== undefined) { add(NOTES[Number(t.dataset.add)].name); return; }
      if (t.dataset.back !== undefined) { built.pop(); renderBuilt(); return; }
      if (t.dataset.submit !== undefined) { submit(); return; }
      if (t.dataset.hint !== undefined) giveHint();
    };
    const add = (n) => {
      if (answered || q?.kind !== 'compose' || built.length >= 6) return;
      built.push(n); playNote(n, 0, 0.35); renderBuilt();
    };
    const giveHint = () => {
      if (hinted || answered) return;
      hinted = true;
      card.querySelector('[data-hinttext]').textContent = `It begins with ${cap(q.target[0])} and has ${q.target.length} notes.`;
      playNote(q.target[0], 0, 0.5);
    };
    const onKey = (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey || document.body.classList.contains('has-panel')) return;
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
      const n = Number(e.key);
      if (n >= 1 && n <= 7) {
        e.preventDefault(); heard = true;
        if (q?.kind === 'compose') add(NOTES[n - 1].name); else choose(n - 1);
      } else if (e.key === 'Enter') {
        if (e.target.closest?.('button') && !answered) return;   // let a focused button act
        e.preventDefault();
        if (answered) next(); else if (q?.kind === 'compose') submit();
      } else if (e.key === 'Backspace' && q?.kind === 'compose' && !answered) {
        e.preventDefault(); built.pop(); renderBuilt();
      }
    };
    host.addEventListener('click', onClick);
    window.addEventListener('keydown', onKey);

    renderLadder(); renderStats(); next();

    return {
      destroy() {
        clearTimeout(timer);
        host.removeEventListener('click', onClick);
        window.removeEventListener('keydown', onKey);
        host.textContent = '';
      },
    };
  }

  const parseKey = (k) => k.match(/do|re|mi|fa|sol|la|si/g) || [];

  function mirrorRow(notes) {
    return `<span class="ln-mirror-row">${notes.map((n) => `<span class="ln-mblock" style="--c:${note(n).color}">${cap(n)}</span>`).join('')}</span>`;
  }

  function usedKey(q) {
    if (q.kind === 'ear') return q.target;
    if (q.kind === 'compose' || q.kind === 'accent' || q.kind === 'mark') return q.word.key;
    if (q.kind.startsWith('mirror')) return q.mirror.key;
    if (q.kind === 'tense') return q.particle;
    return null;
  }

  function conceptLabel(c) {
    const [kind, v] = c.split(':');
    switch (kind) {
      case 'note': return `the note ${cap(v)}`;
      case 'family': return `the ${cap(v)} family`;
      case 'mirror': return `${cap(v)}'s mirror`;
      case 'accent': return `the ${v}`;
      case 'tense': return cap(v);
      case 'mark': return v.replace('-', ' ');
      case 'word': return cap(v);
      default: return c;
    }
  }
  return { mountQuiz };
})();

// === learn/mirror.model.js ===
const __m_learn_mirror_model = (() => {
  const { reverse } = __m_dictionary_grammar;

  // The pure core of The Mirror — a word and its reversed shadow, each with
  // its meaning. Opposition by reversal is a principle with exceptions, so
  // the shadow's gloss may be an unrelated word (or none) — that's honest,
  // and the card shows it as-is.

  function mirrorOf(index, notes) {
    const rev = reverse(notes);
    return {
      word:   { notes, gloss: index.meaningOf(notes.join('')) },
      shadow: { notes: rev, gloss: index.meaningOf(rev.join('')) },
    };
  }
  return { mirrorOf };
})();

// === learn/learn.js ===
const __m_learn_learn = (() => {
  const { NOTES, note, parse, cap } = __m_dictionary_notes;
  const { meaningOf, allWords, getIndex } = __m_dictionary_dictionary;
  const { SEMANTIC_KEYS } = __m_dictionary_grammar;
  const { on } = __m_live_bus;
  const { playWord } = __m_voices_index;
  const { mirrorOf } = __m_learn_mirror_model;

  // The haunting — learning that is discovered, not administered.
  // Every mechanic here is built only on the kernel: a live Word, the
  // Voices, the Dictionary rules, and Memory. A word shown with
  // data-word="…" opens its own page wherever the host listens for it
  // (the School does).

  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const firstSenses = (d, n = 2) => (d ? d.split(/,\s*/).slice(0, n).join(', ') : '');

  // ── The Arrival ── meaning comes out of the dark, from notes you played.
  function mountArrival(host) {
    host.classList.add('arrival');
    host.textContent = 'Play any three notes.';
    const off = on('word:commit', (notes) => {
      const m = meaningOf((notes || []).join(''));
      host.textContent = m
        ? `You just said “${m}”.`
        : `That has no meaning yet — but keep going.`;
      host.classList.add('arrival--revealed');
    });
    return { destroy: off };
  }

  // ── The Mirror ── a word and its reversed shadow (opposition by reversal).
  function mountMirror(host, word) {
    host.classList.add('mirror');
    host.textContent = '';
    const top = strip('word'); const line = document.createElement('div'); line.className = 'mirror-line';
    line.innerHTML = '<span>reversed</span>';
    const bot = strip('shadow');
    host.append(top.el, line, bot.el);

    const hint = document.createElement('p');
    hint.className = 'hint';
    hint.textContent = 'Play a word: its opposite is often the same word backwards.';
    host.appendChild(hint);

    const unwatch = word.watch((notes) => {
      const m = mirrorOf(getIndex(), notes);
      top.render(m.word.notes, m.word.gloss);
      bot.render(m.shadow.notes, m.shadow.gloss);
      hint.hidden = notes.length > 0;
      line.hidden = notes.length === 0;
    });

    return { destroy() { unwatch(); host.textContent = ''; } };

    function strip(kind) {
      const el = document.createElement('div'); el.className = `mirror-strip mirror-strip--${kind}`;
      const row = document.createElement('div'); row.className = 'mirror-blocks';
      const gloss = document.createElement('div'); gloss.className = 'mirror-gloss';
      el.append(row, gloss);
      return {
        el,
        render(notes, meaning) {
          // reconcile blocks in place
          while (row.children.length < notes.length) {
            const b = document.createElement('span'); b.className = 'mirror-block'; row.appendChild(b);
          }
          while (row.children.length > notes.length) row.removeChild(row.lastChild);
          notes.forEach((n, i) => {
            row.children[i].style.setProperty('--c', note(n).color);
            row.children[i].textContent = cap(n);
          });
          const key = notes.join('');
          gloss.innerHTML = !notes.length ? ''
            : `<b data-word="${key}" role="link" tabindex="0">${cap(key)}</b> <i>${meaning ? esc(firstSenses(meaning, 3)) : 'no word — the mirror is empty'}</i>`;
        },
      };
    }
  }

  // ── Discovery ── meet examples; induce the rule. Here: the semantic key,
  // shown on four-note words without a repeated note (where Gajewski's keys hold).
  function mountDiscovery(host) {
    host.classList.add('discovery');
    let last = null;
    render();
    const onClick = (e) => {
      const t = e.target.closest('button'); if (!t) return;
      if (t.dataset.play) playWord({ notes: parse(t.dataset.play) });
      else if (t.dataset.reveal !== undefined) { host.querySelector('.disc-answer').hidden = false; t.hidden = true; }
      else if (t.dataset.again !== undefined) render();
    };
    host.addEventListener('click', onClick);
    return { destroy() { host.removeEventListener('click', onClick); host.textContent = ''; } };

    function render() {
      const keys = NOTES.map((n) => n.name).filter((k) => k !== last);
      const key = keys[Math.floor(Math.random() * keys.length)];
      last = key;
      const family = allWords().filter((w) => {
        const ns = parse(w.solresol);
        return ns[0] === key && ns.length === 4 && new Set(ns).size === 4;
      });
      const picks = sample(family, 3);
      host.innerHTML = `
        <p class="disc-q">Hear these three. What do they share?</p>
        <div class="disc-row">
          ${picks.map((w) => `<div class="disc-word">
            <button type="button" class="disc-play" data-play="${w.solresol}" aria-label="Hear ${esc(w.solresol)}">▶</button>
            <b data-word="${w.solresol.toLowerCase()}" role="link" tabindex="0">${esc(w.solresol)}</b>
            <i>${esc(firstSenses(w.definition))}</i>
          </div>`).join('')}
        </div>
        <p class="disc-answer" hidden>All begin with <b style="--c:${note(key).color}">${cap(key)}</b> — the key of <i>${esc(SEMANTIC_KEYS[key].toLowerCase())}</i>.</p>
        <div class="controls disc-controls">
          <button type="button" class="btn btn--small" data-reveal>Reveal</button>
          <button type="button" class="btn btn--ghost btn--small" data-again>Another three</button>
        </div>`;
    }
  }

  // ── The Fading ── words you are forgetting return, dim. Sing them back.
  function mountFading(host, word, memory) {
    host.classList.add('fading');
    const title = document.createElement('div'); title.className = 'fading-title';
    title.textContent = 'Fading — bring these back';
    const row = document.createElement('div'); row.className = 'fading-row';
    const hint = document.createElement('p'); hint.className = 'hint';
    hint.textContent = 'Words you have used dim as you forget them. Use some, and they will come back here to be sung again.';
    host.append(title, row, hint);

    function render() {
      const ghosts = memory.fading().filter((k) => parse(k).length).slice(0, 12);
      title.style.display = ghosts.length ? '' : 'none';
      hint.hidden = ghosts.length > 0;
      // reconcile in place — add/remove ghosts at the tail, never rebuild
      while (row.children.length > ghosts.length) row.removeChild(row.lastChild);
      while (row.children.length < ghosts.length) {
        const g = document.createElement('button'); g.className = 'ghost'; g.type = 'button'; row.appendChild(g);
      }
      ghosts.forEach((key, i) => {
        const g = row.children[i];
        g.textContent = cap(key);
        g.dataset.word = key;
        g.style.opacity = Math.min(1, 0.25 + memory.strengthOf(key));
        g.onclick = () => { word.set(parse(key)); playWord({ notes: parse(key) }); };
      });
    }
    const unwatch = memory.watch(render);
    render();
    return { destroy() { unwatch(); host.textContent = ''; } };
  }

  const sample = (arr, k) => {
    const a = [...arr]; const out = [];
    while (a.length && out.length < k) out.push(a.splice(Math.floor(Math.random() * a.length), 1)[0]);
    return out;
  };
  return { mountArrival, mountMirror, mountDiscovery, mountFading };
})();

// === outputs/outputs.js ===
const __m_outputs_outputs = (() => {
  const { NOTES, note, cap } = __m_dictionary_notes;
  const { meaningOf } = __m_dictionary_dictionary;
  const { playNote } = __m_voices_index;
  const { emit } = __m_live_bus;

  // Outputs — the test of the whole architecture: a book and a game built
  // from the SAME kernel with NO new primitives. If these are cheap, the
  // seed was right.

  // ── The book ── the Voices rendered to a printable SVG plate.
  function renderWordSVG(notes) {
    const size = 64, pad = 20, w = Math.max(1, notes.length) * size + pad * 2, h = 200;
    const ink = '#221b14', paper = '#faf5e6', rule = '#cbbb98';
    let cells = '';
    notes.forEach((n, i) => {
      const x = pad + i * size, N = note(n);
      const y = 150 - N.step * 6;                        // on the staff
      cells +=
        `<rect x="${x}" y="${pad}" width="${size - 8}" height="${size - 8}" rx="3" fill="${N.color}"/>` +
        `<text x="${x + (size - 8) / 2}" y="${pad + 34}" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#fffdf6">${cap(n)}</text>` +
        `<text x="${x + (size - 8) / 2}" y="${pad + 50}" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#fffdf6">${N.num}</text>` +
        `<ellipse cx="${x + (size - 8) / 2}" cy="${y}" rx="6" ry="4.5" fill="${N.color}" stroke="${ink}" stroke-width=".6"/>`;
    });
    const key = notes.join(''), meaning = meaningOf(key) || '—';
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">` +
      `<rect width="${w}" height="${h}" fill="${paper}"/>` +
      `${[126, 132, 138, 144, 150].map((ly) => `<line x1="${pad}" y1="${ly - 6}" x2="${w - pad}" y2="${ly - 6}" stroke="${rule}"/>`).join('')}` +
      `${cells}` +
      `<text x="${w / 2}" y="${h - 16}" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="${ink}">${cap(key)} — ${meaning}</text>` +
      `</svg>`;
  }

  function mountBook(host, word) {
    host.classList.add('book-plate');
    // A print-plate preview; regenerating this leaf SVG on change is fine —
    // it is an export artifact, not the live stage.
    const unwatch = word.watch((notes) => {
      host.innerHTML = notes.length
        ? renderWordSVG(notes)
        : '<p class="hint">Play a word and its printed plate appears here — every voice on one page.</p>';
    });
    return { destroy() { unwatch(); host.textContent = ''; } };
  }

  // ── The game ── "hear the colour": a note sounds, you name its colour.
  // Seven pans of colour, like a watercolour box; the right one answers.
  function mountGame(host, memory) {
    host.classList.add('hearing');
    host.innerHTML = `
      <div class="hearing-prompt">
        <button type="button" class="btn btn--ink" data-sound>▶ Sound a note</button>
        <p class="hint" data-say>A note sounds. Touch the colour you heard.</p>
      </div>
      <div class="hearing-pans" role="group" aria-label="The seven colours">
        ${NOTES.map((n) => `<button type="button" class="hearing-pan" data-note="${n.name}" style="--c:${n.color}" aria-label="${n.name}"><i></i><span>${cap(n.name)}</span></button>`).join('')}
      </div>
      <p class="hearing-score" data-score></p>`;
    const say = host.querySelector('[data-say]'), score = host.querySelector('[data-score]');
    let target = null, right = 0, seen = 0, run = 0, timer = 0;

    const sound = () => {
      target = NOTES[Math.floor(Math.random() * 7)];
      playNote(target.name, 0, 0.8);
      say.textContent = 'Which colour was that?';
      host.classList.remove('is-answered');
    };
    const onClick = (e) => {
      const t = e.target.closest('button'); if (!t) return;
      if (t.dataset.sound !== undefined) { if (target && !host.classList.contains('is-answered')) playNote(target.name, 0, 0.8); else sound(); return; }
      const n = t.dataset.note; if (!n) return;
      if (!target) { playNote(n, 0, 0.5); say.textContent = 'That is ' + cap(n) + '. Press “Sound a note” to play.'; return; }
      if (host.classList.contains('is-answered')) return;
      seen++;
      const ok = n === target.name;
      if (ok) { right++; run++; emit('word:used', { key: target.name, channel: 'game' }); } else run = 0;
      t.classList.add(ok ? 'is-right' : 'is-wrong');
      host.querySelector(`[data-note="${target.name}"]`).classList.add('is-answer');
      say.innerHTML = ok ? `Yes — <b>${cap(target.name)}</b>.` : `It was <b>${cap(target.name)}</b>. You chose ${cap(n)}.`;
      host.classList.add('is-answered');
      score.textContent = `${right} of ${seen}${run > 2 ? ` · ${run} in a row` : ''}`;
      timer = setTimeout(() => {
        host.querySelectorAll('.hearing-pan').forEach((p) => p.classList.remove('is-right', 'is-wrong', 'is-answer'));
        sound();
      }, ok ? 900 : 1800);
    };
    host.addEventListener('click', onClick);
    void memory;   // kept for the signature; the bus feeds memory
    return { destroy() { clearTimeout(timer); host.removeEventListener('click', onClick); host.textContent = ''; } };
  }
  return { renderWordSVG, mountBook, mountGame };
})();

// === views/learn/games.js ===
const __m_views_learn_games = (() => {
  const { NOTES, parse, cap } = __m_dictionary_notes;
  const { wordCount } = __m_dictionary_dictionary;
  const { Word } = __m_lang_word;
  const { playNote, playWord } = __m_voices_index;
  const { mountMirror, mountDiscovery, mountFading } = __m_learn_learn;
  const { mountGame } = __m_outputs_outputs;
  const { mountConstellation } = __m_map_map;

  // Games — the learning cards, each on its own plate, and the sky as a
  // map of everything you have met.

  const MIRROR_EXAMPLES = ['Fala', 'Misol', 'Solla', 'Domisol', 'Solsire', 'Milasi'];

  function mountGames(host, ctx) {
    host.innerHTML = `
      <p class="lede ln-games-lede">Five small games. None of them keeps score against you: they are here to be played until the notes are yours.</p>
      <div class="ln-games">
        <figure class="plate ln-game">
          <h3 class="rubric">Hear the colour <span class="rubric-note">the ear learns the rainbow</span></h3>
          <div data-game></div>
        </figure>
        <figure class="plate ln-game">
          <h3 class="rubric">The mirror <span class="rubric-note">play a word, see its opposite</span></h3>
          <div class="ln-mini-keys" role="group" aria-label="Play a word">
            ${NOTES.map((n) => `<button type="button" class="ln-mini-key" data-k="${n.name}" style="--c:${n.color}">${cap(n.name)}</button>`).join('')}
            <button type="button" class="ln-mini-key ln-mini-key--clear" data-clear aria-label="Clear">⌫</button>
          </div>
          <div data-mirror></div>
          <div class="chip-row ln-mirror-ex">${MIRROR_EXAMPLES.map((w) => `<button type="button" class="chip-word" data-mex="${w}">${w}</button>`).join('')}</div>
        </figure>
        <figure class="plate ln-game">
          <h3 class="rubric">Discover <span class="rubric-note">meet the examples, find the rule</span></h3>
          <div data-discovery></div>
        </figure>
        <figure class="plate ln-game">
          <h3 class="rubric">Fading <span class="rubric-note">sing them back before they go</span></h3>
          <div data-fading></div>
        </figure>
        <figure class="plate ln-game ln-game--sky">
          <h3 class="rubric">The sky <span class="rubric-note">every word a star — the ones you know shine</span></h3>
          <div class="ln-sky" data-sky></div>
          <figcaption class="plate-caption" data-skycap></figcaption>
        </figure>
      </div>`;
    const $ = (s) => host.querySelector(s);

    // the mirror plays on its own little word, not the instrument's
    const mirrorWord = Word(parse('Fala'));
    const fadingWord = Word();
    const skyWord = Word();

    const kids = [
      mountGame($('[data-game]'), ctx.memory),
      mountMirror($('[data-mirror]'), mirrorWord),
      mountDiscovery($('[data-discovery]')),
      mountFading($('[data-fading]'), fadingWord, ctx.memory),
      mountConstellation($('[data-sky]'), skyWord, ctx.memory),
    ];

    // a star touched in the sky opens that word
    let first = true;
    const unsky = skyWord.watch((notes) => {
      if (first) { first = false; return; }
      if (notes.length) { playWord({ notes }); ctx.openWord(notes); }
    });

    const cap$ = $('[data-skycap]');
    const unmem = ctx.memory.watch(() => {
      const n = ctx.memory.known().filter((k) => parse(k).length > 1).length;
      cap$.textContent = n
        ? `You have met ${n.toLocaleString()} of ${wordCount().toLocaleString()} words · touch a star to open it`
        : `${wordCount().toLocaleString()} words, coloured by their first note · the words you use will brighten`;
    });

    const onClick = (e) => {
      const t = e.target.closest('button'); if (!t || !host.contains(t)) return;
      if (t.dataset.k) {
        if (mirrorWord.length >= 6) mirrorWord.clear();
        mirrorWord.add(t.dataset.k); playNote(t.dataset.k, 0, 0.4);
      } else if (t.dataset.clear !== undefined) mirrorWord.removeLast();
      else if (t.dataset.mex) { mirrorWord.set(parse(t.dataset.mex)); playWord(mirrorWord); }
    };
    host.addEventListener('click', onClick);

    return {
      destroy() {
        host.removeEventListener('click', onClick);
        unsky(); unmem();
        for (const k of kids) k?.destroy?.();
        host.textContent = '';
      },
    };
  }
  return { mountGames };
})();

// === views/learn/history.js ===
const __m_views_learn_history = (() => {
  const { parse } = __m_dictionary_notes;
  const { markWord } = __m_dictionary_grammar;
  const { fanSVG, staffSVG, scriptSVG, colorStripSVG } = __m_graphics_graphics;
  const { wordLink, sayWord } = __m_views_learn_common;

  // History — Sudre's story, as a short illustrated timeline. Only the
  // facts SOLRESOL_MASTER §1–3 marks [canon] or [documented]; the popular
  // "1851 London medal" and the chromatic-clarion origin are left out
  // because verification refuted them.

// === learn/srs.model.js ===
const __m_learn_srs_model = (() => {
  // The pure scheduler behind the micro-quiz — no DOM, storage or clock;
  // `now` is always passed in.
  //
  // A question is about a *concept* ("mirror:fala", "accent:domisol").
  // Each concept has an interval: right answers double it (to 64×), a wrong
  // answer resets it. A concept is due once its interval has passed. The
  // micro-quiz never asks twice within MIN_GAP_MS, only after a few words
  // have been used since the last question, and never once stopped.

  const SRS_KEY = 'solresol:microquiz';
  const MIN_GAP_MS = 2 * 60 * 1000;      // never more than once per ~2 minutes
  const BASE_MS = 10 * 60 * 1000;        // a new concept's first interval: ten minutes
  const EVERY = 3;                        // words used between questions
  const MAX_INTERVAL = 64;

  function freshSrs() {
    return { v: 1, off: false, lastAsked: 0, since: 0, concepts: {} };
  }

  function normalizeSrs(raw) {
    const s = freshSrs();
    if (!raw || typeof raw !== 'object') return s;
    s.off = raw.off === true;
    s.lastAsked = Number.isFinite(raw.lastAsked) ? raw.lastAsked : 0;
    s.since = Number.isFinite(raw.since) ? raw.since : 0;
    if (raw.concepts && typeof raw.concepts === 'object') {
      for (const [id, c] of Object.entries(raw.concepts)) {
        if (c && Number.isFinite(c.interval) && Number.isFinite(c.last)) {
          s.concepts[id] = { interval: c.interval, last: c.last, right: c.right | 0, wrong: c.wrong | 0 };
        }
      }
    }
    return s;
  }

  // A word was used: one more toward the next question.
  const noteUse = (s) => ({ ...s, since: s.since + 1 });

  function shouldAsk(s, now, every = EVERY) {
    return !s.off && s.since >= every && now - s.lastAsked >= MIN_GAP_MS;
  }

  function isDue(s, id, now) {
    const c = s.concepts[id];
    return !c || now - c.last >= c.interval * BASE_MS;
  }

  // Of the candidate concept ids, the most overdue (unseen ones first). null if none is due.
  function chooseDue(s, ids, now) {
    let best = null, bestRatio = -1;
    for (const id of ids) {
      const c = s.concepts[id];
      const ratio = c ? (now - c.last) / (c.interval * BASE_MS) : Infinity;
      if (ratio >= 1 && ratio > bestRatio) { best = id; bestRatio = ratio; }
    }
    return best;
  }

  // A question was shown (answered or not): reset the gap and the count.
  const markAsked = (s, now) => ({ ...s, lastAsked: now, since: 0 });

  function recordAnswer(s, id, correct, now) {
    const prev = s.concepts[id] || { interval: 1, last: now, right: 0, wrong: 0 };
    const next = correct
      ? { ...prev, interval: Math.min(prev.interval * 2, MAX_INTERVAL), right: prev.right + 1, last: now }
      : { ...prev, interval: 1, wrong: prev.wrong + 1, last: now };
    return { ...s, concepts: { ...s.concepts, [id]: next } };
  }

  const stopAsking = (s) => ({ ...s, off: true });
  const resumeAsking = (s) => ({ ...s, off: false });
  return { SRS_KEY, MIN_GAP_MS, BASE_MS, EVERY, MAX_INTERVAL, freshSrs, normalizeSrs, noteUse, shouldAsk, isDue, chooseDue, markAsked, recordAnswer, stopAsking, resumeAsking };
})();

  const { esc, wordLink, swatches, loadJSON, saveJSON } = __m_views_learn_common;

  // Yours — what this device remembers of you: starred words, saved
  // sentences, the words memory holds and how brightly, your examinations,
  // and a way to begin again.

  function mountYours(host, ctx) {
    host.innerHTML = `
      <header class="ln-yours-head">
        <p class="ln-kicker">Kept on this device only</p>
        <h2 class="section-title">Your commonplace book</h2>

        <section class="ln-ysec" data-stars></section>
        <section class="ln-ysec" data-saved></section>

        <section class="ln-ysec" data-exams></section>
        <section class="ln-ysec" data-reset></section>
      </div>`;
    const $ = (s) => host.querySelector(s);

    const renderStars = (stars) => {
      $('[data-stars]').innerHTML = `
        <h3 class="rubric">Starred <span class="rubric-note">${stars.length || 'none yet'}</span></h3>
        ${stars.length ? `<ul class="ln-list">${stars.map((k) => `<li>
            ${swatches(parse(k))}${wordLink(k)}<span class="ln-list-gloss">${esc(short(meaningOf(k)) || '—')}</span>
            <button type="button" class="ln-x" data-unstar="${k}" aria-label="Unstar ${cap(k)}" title="Unstar">★</button>
          </li>`).join('')}</ul>`
          : '<p class="hint">Star a word from its page (☆) and it will be kept here.</p>'}`;
    };

    const renderSaved = (saved) => {
      $('[data-saved]').innerHTML = `
        <h3 class="rubric">Saved sentences <span class="rubric-note">${saved.length || 'none yet'}</span></h3>
        ${saved.length ? `<ul class="ln-sentences">${saved.map((s, i) => `<li>
            <div class="ln-sent-strip">${colorStripSVG(s.words, { height: 8 })}</div>
            <p class="ln-sent-name">${esc(s.name || 'Untitled')}${s.at ? ` <small>${new Date(s.at).toLocaleDateString()}</small>` : ''}</p>
            <p class="ln-sent-words">${s.words.map((ns) => wordLink(ns.join(''))).join(' ')}</p>
            <div class="ln-sent-actions">
              <button type="button" class="btn btn--small" data-playsent="${i}">▶ Play</button>
              <button type="button" class="btn btn--small btn--ghost" data-load="${i}">Load into the sentence</button>
              <button type="button" class="ln-x" data-delsent="${i}" aria-label="Delete">×</button>
            </div>
          </li>`).join('')}</ul>`
          : '<p class="hint">Sentences you save while composing are kept here, to play or load again.</p>'}`;
    };

    const renderMemory = () => {
      const now = Date.now();
      const known = ctx.memory.known().filter((k) => parse(k).length)
        .map((k) => ({ k, s: ctx.memory.strengthOf(k, now) }))
        .sort((a, b) => b.s - a.s);
      const bright = known.filter((x) => x.s >= 0.5).length;
      $('[data-memory]').innerHTML = `
        <h3 class="rubric">What memory holds <span class="rubric-note">${known.length ? `${known.length} ${known.length === 1 ? 'word' : 'words'} met · ${bright} bright` : 'nothing yet'}</span></h3>
        ${known.length ? `<ul class="ln-memory">${known.slice(0, 60).map(({ k, s }) => `<li>
            ${wordLink(k)}
            <span class="ln-meter" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(s * 100)}" aria-label="strength"><i style="width:${Math.max(3, Math.round(s * 100))}%"></i></span>
          </li>`).join('')}</ul>
          ${known.length > 60 ? `<p class="hint">and ${known.length - 60} more, fainter.</p>` : ''}
          <p class="hint">A word brightens each time you meet it and fades over a day and a half without it. The faint ones wait for you in <a href="#/learn/games">Games · Fading</a>.</p>`
          : '<p class="hint">Every word you play, hear or open is remembered here, and fades if you leave it.</p>'}`;
    };

    const renderExams = () => {
      const p = normalize(loadJSON(QUIZ_KEY));
      const mq = normalizeSrs(loadJSON(SRS_KEY));
      $('[data-exams]').innerHTML = `
        <h3 class="rubric">Examinations</h3>
        <ol class="ln-exam-summary">${LEVELS.map((L, i) => `<li><span class="ln-es-num">${L.numeral}</span>${L.title}
          <span class="ln-es-count">${p.levels[i] >= UNLOCK_AT ? '✓ passed' : `${p.levels[i]} / ${UNLOCK_AT}`}</span></li>`).join('')}</ol>
        <p class="hint">${p.asked ? `${p.right} right of ${p.asked} (${Math.round(accuracy(p) * 100)}%) · best run ${p.best}.` : 'Not yet begun.'}
          <a href="#/learn/quiz">Go to the examinations ›</a></p>
        <p class="ln-mq-row">Little questions while you play:
          <button type="button" class="btn btn--small ${mq.off ? '' : 'btn--ghost'}" data-mq>${mq.off ? 'Turn them back on' : 'Stop asking'}</button></p>`;
    };

    const RESETS = [
      ['quiz', 'Forget examination progress'],
      ['memory', 'Forget what memory holds'],
      ['stars', 'Clear starred words'],
      ['saved', 'Clear saved sentences'],
    ];
    let confirming = null;
    const renderReset = () => {
      $('[data-reset]').innerHTML = `
        <h3 class="rubric">Begin again</h3>
        <ul class="ln-resets">${RESETS.map(([id, label]) => `<li>${confirming === id
          ? `<span class="ln-confirm">Sure? This cannot be undone.</span>
             <button type="button" class="btn btn--small btn--rubric" data-doreset="${id}">Yes, forget</button>
             <button type="button" class="btn btn--small btn--ghost" data-cancel>Keep</button>`
          : `<button type="button" class="btn btn--small btn--ghost" data-reset="${id}">${label}</button>`}</li>`).join('')}</ul>`;
    };

    const doReset = (id) => {
      if (id === 'quiz') { saveJSON(QUIZ_KEY, freshProgress()); saveJSON(SRS_KEY, { ...freshSrs(), off: normalizeSrs(loadJSON(SRS_KEY)).off }); renderExams(); }
      if (id === 'memory') ctx.memory.forget?.();
      if (id === 'stars') ctx.state.stars.set([]);
      if (id === 'saved') ctx.state.saved.set([]);
    };

    const onClick = (e) => {
      const t = e.target.closest('button'); if (!t || !host.contains(t)) return;
      const d = t.dataset;
      if (d.unstar) ctx.state.toggleStar(d.unstar);
      else if (d.playsent !== undefined) {
        const s = ctx.state.saved.get()[Number(d.playsent)];
        if (s) playSentence(s.words.map((ns) => Word(ns)));
      } else if (d.load !== undefined) {
        const s = ctx.state.saved.get()[Number(d.load)];
        if (s) { ctx.sentence.set(s.words.map((ns) => Word(ns))); flash(t, '✓ Loaded'); }
      } else if (d.delsent !== undefined) {
        const list = ctx.state.saved.get().slice(); list.splice(Number(d.delsent), 1); ctx.state.saved.set(list);
      } else if (d.mq !== undefined) {
        const mq = normalizeSrs(loadJSON(SRS_KEY)); saveJSON(SRS_KEY, { ...mq, off: !mq.off }); renderExams();
      } else if (d.reset) { confirming = d.reset; renderReset(); }
      else if (d.cancel !== undefined) { confirming = null; renderReset(); }
      else if (d.doreset) { doReset(d.doreset); confirming = null; renderReset(); }
    };
    host.addEventListener('click', onClick);

    const offs = [
      ctx.state.stars.watch(renderStars),
      ctx.state.saved.watch(renderSaved),
      ctx.memory.watch(renderMemory),
    ];
    renderExams(); renderReset();

    return {
      destroy() { offs.forEach((f) => f()); host.removeEventListener('click', onClick); host.textContent = ''; },
    };
  }

  const short = (d) => (d ? d.split(/,\s*/).slice(0, 3).join(', ') : '');

  function flash(btn, text) {
    const was = btn.textContent;
    btn.textContent = text;
    setTimeout(() => { if (btn.isConnected) btn.textContent = was; }, 1400);
  }
  return { mountYours };
})();

const __m_views_learn_learn_view = (() => {
  const { mountStudy } = __m_views_learn_study;
  const { mountGrammar } = __m_views_learn_grammar;
  const { mountQuiz } = __m_views_learn_quiz;
  const { mountGames } = __m_views_learn_games;
  const { mountHistory } = __m_views_learn_history;
  const { mountYours } = __m_views_learn_yours;
  const { bindWordLinks } = __m_views_learn_common;

  // The Learn chapter — the School. mountLearnView(host, ctx, route) → { update(route), destroy() }.
  // Six leaves, each its own route so every one is linkable:
  //   #/learn           Study — the seven notes, every voice
  //   #/learn/grammar   Grammar — Gajewski's rules, playable
  //   #/learn/quiz      Examinations — five levels that unlock
  //   #/learn/games     Games — the learning cards, and the sky
  //   #/learn/history   History — Sudre's story
  //   #/learn/yours     Yours — your stars, sentences and memory

  const LEAVES = [
    { id: '',        label: 'Study',    mount: mountStudy },
    { id: 'grammar', label: 'Grammar',  mount: mountGrammar },
    { id: 'quiz',    label: 'Quiz',     mount: mountQuiz },
    { id: 'games',   label: 'Games',    mount: mountGames },
    { id: 'history', label: 'History',  mount: mountHistory },
    { id: 'yours',   label: 'Yours',    mount: mountYours },
  ];

  function mountLearnView(host, ctx, route) {
    host.classList.add('school');
    host.innerHTML = `
      <nav class="tabs school-tabs" aria-label="The School">
        ${LEAVES.map((l) => `<a class="tab" href="#/learn${l.id ? '/' + l.id : ''}" data-leaf="${l.id}">${l.label}</a>`).join('')}
      </nav>
      <div class="school-leaf"></div>`;
    const page = host.querySelector('.school-leaf');
    const unlink = bindWordLinks(host, ctx);

    let current = null;       // { id, handle }
    function show(r) {
      const want = LEAVES.find((l) => l.id === (r?.sub || '')) || LEAVES[0];
      if (current && current.id === want.id) return;
      current?.handle?.destroy?.();
      page.textContent = '';
      page.className = `school-leaf school-leaf--${want.id || 'study'}`;
      current = { id: want.id, handle: want.mount(page, ctx) };
      host.querySelectorAll('[data-leaf]').forEach((a) => {
        const on = a.dataset.leaf === want.id;
        a.classList.toggle('is-on', on);
        if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
      });
      // arriving on a new leaf from further down the page: bring its tabs back into view
      const tabs = host.querySelector('.school-tabs');
      if (!first && tabs.getBoundingClientRect().top < 0) tabs.scrollIntoView({ block: 'start' });
    }
    let first = true;
    show(route);
    first = false;

    return {
      update: show,
      destroy() { current?.handle?.destroy?.(); unlink(); host.classList.remove('school'); host.textContent = ''; },
    };
  }
  return { mountLearnView };
})();

        <h2 class="panel-word">${cap(markWord(notes, form))}</h2>
        <p class="panel-meaning">${meaning ? esc(meaning) : '<em>Not in the dictionary.</em>'}${own ? ' <span class="tag">your meaning</span>' : ''}</p>
        ${notes.length > 1 ? `<p class="panel-role">${form.accent < 0 ? 'Written plain, it is a <b>verb</b>' : `Accented so, it is a <b>${partOfSpeech(notes, form.accent)}</b>`}${form.feminine ? ', feminine' : ''}${form.plural ? ', plural' : ''}.</p>` : ''}

        <div class="panel-actions">
          <button class="btn btn--ink" data-act="play">▶ Hear it</button>
          <button class="btn" data-act="add">＋ To sentence</button>
          <button class="btn" data-act="star" aria-pressed="${starred}">${starred ? '★ Starred' : '☆ Star'}</button>
          <button class="btn" data-act="link">Copy link</button>
          <button class="btn" data-act="card">Save as image</button>
        </div>

        <section class="panel-section">
          <h3 class="rubric">Every voice</h3>
          <div data-choir></div>
        </section>

        <section class="panel-section">
          <h3 class="rubric">On the staff</h3>
          <div class="panel-staff">${staffSVG([notes], { labels: true })}</div>
        </section>

        ${forms.length ? `
        <section class="panel-section">
          <h3 class="rubric">Its forms <span class="rubric-note">the tonic accent decides the part of speech</span></h3>
          <div class="forms">
            ${forms.map((f) => `<button class="form ${form.accent === f.accent ? 'is-on' : ''}" data-accent="${f.accent}">
                <b>${cap(markWord(notes, { ...form, accent: f.accent }))}</b><span>${f.role}</span></button>`).join('')}
          </div>
          <div class="forms forms--marks">
            <button class="form form--mark ${form.feminine ? 'is-on' : ''}" data-mark="feminine"><b>¯</b><span>feminine</span></button>
            <button class="form form--mark ${form.plural ? 'is-on' : ''}" data-mark="plural"><b>´</b><span>plural</span></button>
          </div>
        </section>` : ''}

        ${notes.length > 1 ? `
        <section class="panel-section">
          <h3 class="rubric">Its mirror <span class="rubric-note">reverse a word to reverse its meaning</span></h3>
          <button class="mirror-link" data-open="${oppKey}">
            <span class="swatches">${opp.map((n) => `<i style="background:${note(n).color}"></i>`).join('')}</span>
            <b>${cap(oppKey)}</b>
            <span>${oppMeaning ? esc(oppMeaning) : 'no word yet — the mirror is empty'}</span>
          </button>
        </section>` : ''}

        ${!meaning || own ? `
        <section class="panel-section">
          <h3 class="rubric">${own ? 'Your meaning' : 'Give it a meaning'}</h3>
          <form class="propose" data-propose>
            <input name="m" maxlength="80" placeholder="What should ${cap(key)} mean?" value="${own ? esc(ctx.state.meanings.get()[key]) : ''}" autocomplete="off">
            <button class="btn">Keep</button>
            ${own ? '<button type="button" class="btn btn--ghost" data-act="unpropose">Forget</button>' : ''}
          </form>
          <p class="hint">Kept on this device only. The shared dictionary stays as Sudre wrote it.</p>
        </section>` : ''}

        ${recentMarkup(ctx, key)}`;

      choir?.destroy();
      choir = mountChoir(body.querySelector('[data-choir]'), shown, { prefs: ctx.state.prefs });
    }

    body.addEventListener('click', (e) => {
      const t = e.target.closest('button');
      if (!t) return;
      const key = shown.key;
      if (t.dataset.accent !== undefined) { form = { ...form, accent: Number(t.dataset.accent) }; render(); return; }
      if (t.dataset.mark) { form = { ...form, [t.dataset.mark]: !form[t.dataset.mark] }; render(); return; }
      if (t.dataset.open) { open(t.dataset.open); return; }
      switch (t.dataset.act) {
        case 'play': playWord(shown); emit('word:used', { key, channel: 'panel' }); break;
        case 'add':  emit('sentence:add', shown.notes); flashLabel(t, '✓ Added'); break;
        case 'star': ctx.state.toggleStar(key); render(); break;
        case 'link': copyLink(key).then((ok) => flashLabel(t, ok ? '✓ Copied' : 'Copy failed')); break;
        case 'card': saveCard(shown.notes, ctx.state.meanings.get()[key] || meaningOf(key)); break;
        case 'unpropose': {
          const m = { ...ctx.state.meanings.get() }; delete m[key]; ctx.state.meanings.set(m); render(); break;
        }
      }
    });
    body.addEventListener('submit', (e) => {
      e.preventDefault();
      const v = new FormData(e.target).get('m').trim();
      const m = { ...ctx.state.meanings.get() };
      if (v) m[shown.key] = v; else delete m[shown.key];
      ctx.state.meanings.set(m);
      render();
    });
    host.addEventListener('click', (e) => { if (e.target.closest('[data-close]') && !e.target.closest('.panel-body')) close(); });
    const onKey = (e) => { if (e.key === 'Escape' && !host.hidden) close(); };
    window.addEventListener('keydown', onKey);

    // open(text | notes): from a click, this moves the address to #/word/…
    // (so Back closes it and the link can be shared); from the router, it shows.
    function open(what, { fromRoute = false } = {}) {
      const notes = Array.isArray(what) ? what : parse(what);
      if (!notes.length) return;
      const key = notes.join('');
      if (!fromRoute) {
        if (!location.hash.startsWith('#/word/')) lastHash = location.hash || '#/';
        ctx.go('word/' + cap(key));
        return;
      }
      if (!location.hash.startsWith('#/word/')) lastHash = location.hash;
      if (host.hidden || shown.key !== key) form = { accent: -1, feminine: false, plural: false };
      shown.set(notes);
      ctx.state.touch(key);
      emit('word:used', { key, channel: 'panel' });
      render();
      host.hidden = false;
      document.body.classList.add('has-panel');
      host.querySelector('.panel-sheet').scrollTop = 0;
      host.querySelector('.panel-close').focus({ preventScroll: true });
    }

    function close({ fromRoute = false } = {}) {
      if (host.hidden) return;
      host.hidden = true;
      document.body.classList.remove('has-panel');
      if (!fromRoute) {
        const back = lastHash && !lastHash.startsWith('#/word/') ? lastHash : '#/';
        location.hash = back;
      }
    }

    unwatch = ctx.state.stars.watch(() => { if (!host.hidden) render(); });

    return {
      open, close,
      destroy() { unwatch(); choir?.destroy(); window.removeEventListener('keydown', onKey); host.textContent = ''; },
    };
  }

  function recentMarkup(ctx, key) {
    const recent = ctx.state.recent.get().filter((k) => k !== key).slice(0, 8);
    const stars = ctx.state.stars.get().filter((k) => k !== key).slice(0, 8);
    const chips = (list) => list.map((k) => `<button class="chip-word" data-open="${k}">${cap(k)}</button>`).join('');
    if (!recent.length && !stars.length) return '';
    return `<section class="panel-section">
      ${stars.length ? `<h3 class="rubric">Starred</h3><div class="chip-row">${chips(stars)}</div>` : ''}
      ${recent.length ? `<h3 class="rubric">Lately</h3><div class="chip-row">${chips(recent)}</div>` : ''}
    </section>`;
  }

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function flashLabel(btn, text) {
    const was = btn.textContent;
    btn.textContent = text;
    setTimeout(() => { btn.textContent = was; }, 1400);
  }

  async function copyLink(key) {
    const url = `${location.origin}${location.pathname}#/word/${cap(key)}`;
    try { await navigator.clipboard.writeText(url); return true; } catch { return false; }
  }

  // A word as a printed plate — 1200×630, the size link previews use.
  async function saveCard(notes, meaning) {
    const W = 1200, H = 630, c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d');
    try { await document.fonts.ready; } catch { /* fonts are a nicety */ }
    const ink = '#221b14', paper = '#f5edd8';
    g.fillStyle = paper; g.fillRect(0, 0, W, H);
    g.strokeStyle = ink; g.lineWidth = 3; g.strokeRect(36, 36, W - 72, H - 72);
    g.lineWidth = 1; g.strokeRect(46, 46, W - 92, H - 92);

    g.fillStyle = '#9c2a1c';
    g.font = '28px "IM Fell English SC", Georgia, serif';
    g.textAlign = 'center';
    g.fillText('S O L R E S O L', W / 2, 112);

    g.fillStyle = ink;
    g.font = '118px "IM Fell English", Georgia, serif';
    g.fillText(cap(notes.join('')), W / 2, 250);

    // the colours, then Sudre's strokes under them
    const cell = 86, gap = 14, total = notes.length * cell + (notes.length - 1) * gap;
    let x = (W - total) / 2;
    for (const n of notes) {
      g.fillStyle = note(n).color; g.fillRect(x, 292, cell, 70);
      g.save(); g.translate(x + cell / 2 - 22, 382); g.scale(2.2, 2.2);
      g.strokeStyle = ink; g.lineWidth = 2; g.lineCap = 'round'; g.stroke(new Path2D(GLYPH_PATHS[n])); g.restore();
      x += cell + gap;
    }

    g.fillStyle = ink;
    g.font = 'italic 34px "Newsreader", Georgia, serif';
    wrapText(g, meaning || 'a word not yet in the dictionary', W / 2, 500, W - 240, 42);

    g.fillStyle = '#6d604c';
    g.font = '22px "Newsreader", Georgia, serif';
    g.fillText(notes.map((n) => note(n).num).join(' · '), W / 2, 566);

    const blob = await new Promise((r) => c.toBlob(r, 'image/png'));
    const file = new File([blob], `solresol-${notes.join('')}.png`, { type: 'image/png' });
    if (navigator.canShare?.({ files: [file] })) {
      try { await navigator.share({ files: [file], title: cap(notes.join('')) }); return; } catch { /* fall through to download */ }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = file.name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }

  function wrapText(g, text, cx, y, maxW, lh) {
    const words = String(text).split(/\s+/); let line = '', lines = [];
    for (const w of words) {
      const t = line ? line + ' ' + w : w;
      if (g.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t;
    }
    lines.push(line);
    lines = lines.slice(0, 2);
    lines.forEach((l, i) => g.fillText(l, cx, y + i * lh - (lines.length - 1) * lh / 2));
  }
  return { mountPanel };
})();

// === learn/microquiz.js ===
const __m_learn_microquiz = (() => {
  const { allWords } = __m_dictionary_dictionary;
  const { cap } = __m_dictionary_notes;
  const { on } = __m_live_bus;
  const { prepare, microQuestions } = __m_learn_quiz_model;
  const { SRS_KEY, normalizeSrs, noteUse, shouldAsk, chooseDue, markAsked, recordAnswer, stopAsking } = __m_learn_srs_model;

  // The micro-quiz — now and then, a small question about a word you just
  // used: its mirror, its family, its part of speech by accent. Scheduled
  // by spaced repetition (srs.model.js), never more than once in two
  // minutes, dismissed with ×, Escape or by waiting, and silenced for good
  // with "stop asking" (kept in localStorage under 'solresol:microquiz').
  //
  //   const mq = mountMicroQuiz(document.body, ctx);   // once, by the shell
  //   mq.destroy();
  //
  // It listens on the bus for 'word:commit' (notes). `host` receives one
  // fixed-position toast; nothing else is added to the page.

  const SHOW_AFTER_MS = 900;          // let the commit land before asking
  const LINGER_MS = 20000;            // an unanswered question leaves by itself

  let ENTRIES = null;
  const entries = () => (ENTRIES ||= prepare(allWords()));

  function mountMicroQuiz(host, ctx, { now = () => Date.now() } = {}) {
    const load = () => { try { return normalizeSrs(JSON.parse(localStorage.getItem(SRS_KEY))); } catch { return normalizeSrs(null); } };
    const save = (s) => { try { localStorage.setItem(SRS_KEY, JSON.stringify(s)); } catch { /* private mode */ } };

    const toast = document.createElement('aside');
    toast.className = 'mq';
    toast.hidden = true;
    toast.setAttribute('role', 'dialog');
    toast.setAttribute('aria-label', 'A small question');
    host.appendChild(toast);

    let showTimer = 0, lingerTimer = 0, hideTimer = 0, current = null;

    const off = on('word:commit', (notes) => {
      if (!Array.isArray(notes) || !notes.length) return;
      let s = noteUse(load());
      save(s);
      if (!toast.hidden || !shouldAsk(s, now())) return;
      const qs = microQuestions(notes, entries());
      const id = chooseDue(s, qs.map((q) => q.id), now());
      if (!id) return;
      const q = qs.find((x) => x.id === id);
      s = markAsked(s, now());
      save(s);
      clearTimeout(showTimer);
      showTimer = setTimeout(() => show(q), SHOW_AFTER_MS);
    });

    function show(q) {
      current = q;
      toast.innerHTML = `
        <div class="mq-head">
          <span class="mq-title">${q.title}</span>
          <button type="button" class="mq-close" data-dismiss aria-label="Dismiss">×</button>
        </div>
        <p class="mq-prompt">${q.prompt}</p>
        <div class="mq-options">${q.options.map((o, i) => `<button type="button" class="mq-opt" data-i="${i}">${o.label}</button>`).join('')}</div>
        <p class="mq-result" aria-live="polite"></p>
        <div class="mq-foot">
          <button type="button" class="mq-link" data-open>Open ${cap(q.answerWord || q.word)}</button>
          <button type="button" class="mq-link" data-stop>Stop asking</button>
        </div>`;
      toast.hidden = false;
      toast.classList.remove('is-leaving', 'is-right', 'is-wrong');
      clearTimeout(lingerTimer);
      lingerTimer = setTimeout(dismiss, LINGER_MS);
    }

    function dismiss() {
      clearTimeout(lingerTimer); clearTimeout(hideTimer);
      if (toast.hidden) return;
      toast.classList.add('is-leaving');
      hideTimer = setTimeout(() => { toast.hidden = true; toast.textContent = ''; current = null; }, 260);
    }

    function answer(i) {
      const q = current; if (!q || toast.classList.contains('is-right') || toast.classList.contains('is-wrong')) return;
      const o = q.options[i]; if (!o) return;
      save(recordAnswer(load(), q.id, o.correct, now()));
      toast.classList.add(o.correct ? 'is-right' : 'is-wrong');
      toast.querySelectorAll('.mq-opt').forEach((b, k) => {
        b.disabled = true;
        if (q.options[k].correct) b.classList.add('is-right'); else if (k === i) b.classList.add('is-wrong');
      });
      toast.querySelector('.mq-result').textContent = o.correct ? 'Right.' : 'Not quite — the right answer is marked.';
      clearTimeout(lingerTimer);
      lingerTimer = setTimeout(dismiss, o.correct ? 1800 : 4200);
    }

    const onClick = (e) => {
      const t = e.target.closest('button'); if (!t) return;
      if (t.dataset.i !== undefined) answer(Number(t.dataset.i));
      else if (t.dataset.dismiss !== undefined) dismiss();
      else if (t.dataset.stop !== undefined) { save(stopAsking(load())); dismiss(); }
      else if (t.dataset.open !== undefined && current) { const w = current.answerWord || current.word; dismiss(); ctx.openWord(w); }
    };
    const onKey = (e) => { if (e.key === 'Escape' && !toast.hidden) dismiss(); };
    toast.addEventListener('click', onClick);
    window.addEventListener('keydown', onKey);

    return {
      destroy() {
        off();
        clearTimeout(showTimer); clearTimeout(lingerTimer); clearTimeout(hideTimer);
        window.removeEventListener('keydown', onKey);
        toast.remove();
      },
    };
  }
  return { mountMicroQuiz };
})();

// === site/site.js ===
const __m_site_site = (() => {
  const { VIEWS, ELSEWHERE } = __m_site_views;
  const { fanSVG } = __m_graphics_graphics;
  const { mountPanel } = __m_site_panel;
  const { mountMicroQuiz } = __m_learn_microquiz;

  // renderSite — the book's binding: the masthead, the chapter you are in,
  // the colophon, and the word panel that any word anywhere opens into.
  // Chapters are mounted when you arrive and destroyed when you leave, so
  // only the one on screen is listening to anything.

  function renderSite(root, ctx, { standalone = false } = {}) {
    root.textContent = '';
    root.classList.add('book');

    const masthead = document.createElement('header');
    masthead.className = 'masthead';
    masthead.innerHTML = `
      <a class="brand" href="#/" aria-label="Solresol — home">
        ${fanSVG({ labels: false, title: '' })}
        <span class="brand-name">Solresol</span>
      </a>
      <nav class="chapters" aria-label="Chapters">
        ${VIEWS.map((v) => `<a href="#/${v.id}" data-view="${v.id}"><span class="numeral">${v.numeral}</span>${v.label}</a>`).join('')}
      </nav>
      ${standalone ? '' : `<nav class="elsewhere" aria-label="Elsewhere">
        ${ELSEWHERE.map((e) => `<a href="${e.href}">${e.label}</a>`).join('')}
      </nav>`}`;

    const main = document.createElement('main');
    main.className = 'chapter';
    main.id = 'chapter';
    main.tabIndex = -1;

    const colophon = document.createElement('footer');
    colophon.className = 'colophon';
    colophon.innerHTML = `
      <div class="colophon-rule" aria-hidden="true"></div>
      <p>Solresol, the universal musical language of <em>Jean-François Sudre</em> (1827),
        after the grammar of <em>Boleslas Gajewski</em> (1902). <b data-count>3,152</b> words.</p>
      <p class="colophon-small">Seven notes · seven colours · seven numbers · one word.</p>`;

    const panelHost = document.createElement('aside');
    root.append(masthead, main, colophon, panelHost);

    const panel = mountPanel(panelHost, ctx);
    ctx.openWord = panel.open;
    // An occasional, dismissable question about a word you just said.
    const microquiz = mountMicroQuiz(document.body, ctx);

    let current = null;      // { id, handle }
    function show(route) {
      const wantsWord = route.view === 'word';
      const id = wantsWord ? (current ? current.id : 'play') : route.view;
      const view = VIEWS.find((v) => v.id === id) || VIEWS[0];

      if (!current || current.id !== view.id) {
        current?.handle?.destroy?.();
        main.textContent = '';
        main.dataset.view = view.id;
        const head = document.createElement('div');
        head.className = 'chapter-head';
        head.innerHTML = `<span class="chapter-numeral">Chapter ${view.numeral}</span><h1>${view.title}</h1>`;
        const body = document.createElement('div');
        body.className = 'chapter-body';
        main.append(head, body);
        current = { id: view.id, handle: view.mount(body, ctx, route) };
        if (!wantsWord) window.scrollTo({ top: 0 });
      } else if (!wantsWord) {
        current.handle?.update?.(route);
      }

      masthead.querySelectorAll('[data-view]').forEach((a) => {
        const on = a.dataset.view === view.id;
        a.classList.toggle('is-here', on);
        if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
      });

      if (wantsWord && route.arg) panel.open(route.arg, { fromRoute: true });
      else if (!wantsWord) panel.close({ fromRoute: true });
    }

    const unroute = ctx.route.watch(show);

    return {
      colophon,
      destroy() { unroute(); current?.handle?.destroy?.(); panel.destroy(); microquiz.destroy(); root.textContent = ''; },
    };
  }
  return { renderSite };
})();

// === main.js ===
(async () => {
  const { loadDictionary, wordCount } = __m_dictionary_dictionary;
  const { Word } = __m_lang_word;
  const { Phrase } = __m_lang_phrase;
  const { createMemory } = __m_memory_memory;
  const { emit, on } = __m_live_bus;
  const { setTimbre } = __m_voices_index;
  const { createState } = __m_site_state;
  const { createRouter } = __m_site_router;
  const { renderSite } = __m_site_site;

  // Load the one book of truth, build the shared kernel, bind the book.
  await loadDictionary();

  const word = Word();               // the one live building-word (the instrument)
  const sentence = Phrase();         // the sentence being said, shared by every chapter
  const memory = createMemory();     // listens on the bus for word:used
  const state = createState();       // prefs, stars, recent, saved sentences, own meanings
  const { route, go } = createRouter();

  // Commit the building word into the sentence, then clear it.
  function commit() {
    if (!word.length) return;
    emit('word:commit', word.notes.slice());
    word.clear();
  }

  // Words reach the sentence from anywhere: the instrument, a panel, a phrase.
  const addToSentence = (notes) => {
    if (!notes || !notes.length) return;
    sentence.add(Word(notes));
    emit('word:used', { key: notes.join(''), channel: 'sentence' });
  };
  on('word:commit', addToSentence);
  on('sentence:add', addToSentence);

  state.prefs.watch((p) => setTimbre(p.timbre));

  // ctx is the shared kernel every chapter connects through:
  //   word      the live building-word          sentence  the live Phrase being said
  //   memory    strength and decay per word     state     prefs · stars · recent · saved · meanings
  //   route     where we are (live)             go(path)  move there ('dictionary/families')
  //   commit()  building-word → sentence        openWord(text | notes)  show a word's own page
  const ctx = { word, sentence, memory, state, route, go, commit, openWord: () => {} };

  const standalone = !!window.__SOLRESOL_STANDALONE;
  const site = renderSite(document.getElementById('site'), ctx, { standalone });
  window.__solresol = { ctx, site };   // handle for debugging and the QC harness

  site.colophon.querySelector('[data-count]').textContent = wordCount().toLocaleString();
  return {  };
})().catch((e) => { console.error(e); });
})();
  </script>
