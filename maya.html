<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Maya — talk with colour and sound</title>
<!-- the book's display face, for the name only; offline it falls back to Georgia -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English&family=IM+Fell+English+SC&display=swap">
<style>
/* ------------------------------------------------------------------ *
 * Maya — a voice made of colour and sound. Local. Offline. Yours.
 * Do = red = no (low, falling).   Si = violet = yes (high, rising).
 * Seven notes, seven colours: the rainbow is one optical octave.
 * Dressed as a page of the Solresol book (paper, ink, rubric) but the
 * words stay in a round, friendly face: legibility comes first here.
 * The seven notes are the only bright colours, so colour means a note.
 * ------------------------------------------------------------------ */
:root{
  /* the seven notes: the canonical Solresol colours */
  --n0:#e63946;  /* do  red    */
  --n1:#f3722c;  /* re  orange */
  --n2:#f9c74f;  /* mi  yellow */
  --n3:#43aa8b;  /* fa  green  */
  --n4:#277da1;  /* sol blue   */
  --n5:#4d5198;  /* la  indigo */
  --n6:#7b2cbf;  /* si  violet */

  /* the big buttons deepen toward the bottom so white words stay well above 4.5:1 */
  --yes:#7b2cbf; --yes-2:#5d1f93;
  --no:#e63946;  --no-2:#b8232f;

  --bg:#f6efdc;            /* engraving paper, a shade lighter than the book's for glare */
  --card:#fcf8ec;
  --ink:#221b14;           /* iron-gall ink */
  --ink-soft:#6b5e50;      /* 5.6:1 on the paper */
  --line:#dccfae;
  --rubric:#9c2a1c;        /* the book's red for headings and warnings — never a note */
  --shadow:0 1px 0 rgba(34,27,20,.07), 0 10px 26px -12px rgba(34,27,20,.30);
  --radius:26px;
  --font: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --display: "IM Fell English", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sc: "IM Fell English SC", "IM Fell English", "Palatino Linotype", Georgia, serif;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#1b1611; --card:#261f18; --ink:#f4ead6; --ink-soft:#b3a48f; --line:#3a3026; --rubric:#e58a78;
         --shadow:0 12px 34px rgba(0,0,0,.45); }
}
:root[data-theme="light"]{ --bg:#f6efdc; --card:#fcf8ec; --ink:#221b14; --ink-soft:#6b5e50; --line:#dccfae; --rubric:#9c2a1c; --shadow:0 1px 0 rgba(34,27,20,.07),0 10px 26px -12px rgba(34,27,20,.30); }
:root[data-theme="dark"]{ --bg:#1b1611; --card:#261f18; --ink:#f4ead6; --ink-soft:#b3a48f; --line:#3a3026; --rubric:#e58a78; --shadow:0 12px 34px rgba(0,0,0,.45); }

*{box-sizing:border-box}
[hidden]{display:none !important}   /* .warn, .replay and .word set display, which would beat the attribute */
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  padding:max(14px,env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));
  max-width:1100px; margin:0 auto;
  -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit; color:inherit; border:none; background:none; cursor:pointer}
button:focus-visible,input:focus-visible{outline:4px solid var(--rubric); outline-offset:3px}

/* header ----------------------------------------------------------- */
header{display:flex; align-items:center; gap:12px; padding:4px 6px 12px; margin-bottom:16px; border-bottom:1px solid var(--line); box-shadow:0 3px 0 -2px var(--line)}
.brand{display:flex; align-items:baseline; gap:12px}
.brand h1{font-family:var(--display); font-size:34px; font-weight:400; line-height:1; letter-spacing:.3px; margin:0}
.brand .dots{display:flex; gap:5px; align-self:center}
.brand .dots i{width:12px;height:12px;border-radius:50%; box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
header .spacer{flex:1}
.toggle{display:flex; white-space:nowrap; align-items:center; gap:8px; font-weight:700; color:var(--ink-soft);
  font-size:15px; background:var(--card); border:1px solid var(--line); padding:9px 14px; border-radius:999px; box-shadow:var(--shadow)}
.toggle b{color:var(--ink)}

/* say-bar — the speaker's voice made visible, read across the room -- */
.say{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:22px 24px; display:flex; align-items:center; gap:22px;
  min-height:118px; margin-bottom:16px;
}
.say .word{font-size:clamp(34px,7vw,58px); font-weight:800; line-height:1; display:flex; align-items:center; gap:18px}
.say .emoji{font-size:clamp(40px,8vw,64px)}
.say .beads{display:flex; gap:9px; flex-wrap:wrap}
.say .beads i{width:26px;height:26px;border-radius:50%; box-shadow:inset 0 -3px 6px rgba(0,0,0,.18)}
.say .rest{color:var(--ink-soft); font-size:22px; font-weight:700; white-space:nowrap; display:flex; align-items:center; gap:14px}
.say .spacer{flex:1}
.replay{width:66px;height:66px;border-radius:50%; background:var(--bg); border:1px solid var(--line);
  box-shadow:var(--shadow); font-size:28px; display:grid; place-items:center; flex:none}
.replay:active{transform:scale(.92)}
.say.pop{animation:pop .32s cubic-bezier(.2,1.3,.5,1)}
@keyframes pop{0%{transform:scale(.97)}60%{transform:scale(1.015)}100%{transform:scale(1)}}

/* YES / NO — the whole product on day one -------------------------- */
.yesno{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px}
.big{
  border-radius:var(--radius); padding:30px; min-height:min(38vh,300px);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
  color:#fff; box-shadow:var(--shadow); position:relative; overflow:hidden; transition:transform .08s ease;
}
.big:active{transform:scale(.97)}
.big .lbl{font-size:clamp(52px,11vw,104px); font-weight:900; letter-spacing:.5px; line-height:.9}
.big .sub{font-size:20px; font-weight:800; opacity:.9; letter-spacing:.4px; white-space:nowrap; display:flex; align-items:center; gap:10px}
.big .sub i{width:16px;height:16px;border-radius:50%; background:rgba(255,255,255,.95)}
.big.no{background:radial-gradient(120% 120% at 30% 15%, #ec5a66, var(--no) 38%, var(--no-2) 100%)}
.big.yes{background:radial-gradient(120% 120% at 70% 15%, #9450d2, var(--yes) 38%, var(--yes-2) 100%)}
.big{box-shadow:inset 0 -8px 0 rgba(0,0,0,.14), var(--shadow)}
.big .lbl{text-shadow:0 2px 3px rgba(0,0,0,.18)}
.big .glow{position:absolute; inset:0; background:radial-gradient(circle at center, rgba(255,255,255,.55), transparent 60%); opacity:0; pointer-events:none}
.big.lit .glow{animation:flash .5s ease}
@keyframes flash{0%{opacity:.8; transform:scale(.6)}100%{opacity:0; transform:scale(1.3)}}
.big .arrow{position:absolute; right:22px; bottom:16px; font-size:34px; opacity:.6}

/* section titles --------------------------------------------------- */
.h{font-family:var(--sc); font-size:20px; font-weight:400; letter-spacing:1.6px; color:var(--rubric); margin:6px 6px 12px}

/* word grid -------------------------------------------------------- */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(132px,1fr)); gap:13px; margin-bottom:22px}
.tile{
  background:var(--card); border:1px solid var(--line); border-radius:22px; box-shadow:var(--shadow);
  padding:16px 12px 13px; display:flex; flex-direction:column; align-items:center; gap:9px; position:relative; transition:transform .08s ease;
}
.tile:active{transform:scale(.95)}
.tile .em{font-size:42px; line-height:1}
.tile .w{font-size:20px; font-weight:800}
.tile .beads{display:flex; gap:5px}
.tile .beads i{width:13px;height:13px;border-radius:50%; box-shadow:inset 0 -2px 3px rgba(0,0,0,.2)}
.tile.mine .pin{position:absolute; top:8px; right:10px; font-size:14px; color:var(--ink-soft)}
.tile .del{display:none; position:absolute; top:-8px; right:-8px; width:30px; height:30px; border-radius:50%;
  background:var(--rubric); color:#fff; font-size:16px; font-weight:900; line-height:30px; box-shadow:var(--shadow)}
body.editing .tile.mine .del{display:block}
body.editing .tile.mine .pin{display:none}
.tile.lit{box-shadow:0 0 0 4px var(--hl,var(--n5)), var(--shadow)}

/* make-a-word ------------------------------------------------------ */
.make{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px; margin-bottom:26px}
.make .top{display:flex; align-items:center; gap:12px; margin-bottom:4px; cursor:pointer}
.make .top h2{font-size:20px; font-weight:800; margin:0}
.make .top .chev{margin-left:auto; color:var(--ink-soft); font-size:22px; transition:transform .2s}
.make.open .top .chev{transform:rotate(90deg)}
.make .body{display:none; padding-top:16px}
.make.open .body{display:block}
.keys{display:grid; grid-template-columns:repeat(7,1fr); gap:10px; margin-bottom:16px}
.key{height:84px; border-radius:18px; color:#221b14; font-weight:800; font-size:15px;
  display:flex; align-items:flex-end; justify-content:center; padding:0 4px 9px;
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.14), var(--shadow); transition:transform .07s}
/* the note's name on a paper label: dark ink reads the same on pale mi and deep si */
.key span{background:rgba(252,248,236,.94); border-radius:999px; padding:3px 9px; line-height:1.2; max-width:100%}
.key:active{transform:translateY(3px) scale(.97)}
.compose{display:flex; align-items:center; gap:14px; flex-wrap:wrap; min-height:64px;
  background:var(--bg); border:2px dashed var(--line); border-radius:18px; padding:14px 16px; margin-bottom:12px}
.compose .beads{display:flex; gap:9px}
.compose .beads i{width:30px;height:30px;border-radius:50%; box-shadow:inset 0 -3px 5px rgba(0,0,0,.2)}
.compose .hint{color:var(--ink-soft); font-weight:700; font-size:17px}
.compose .spacer{flex:1}
.warn{color:var(--rubric); font-weight:800; font-size:16px; display:block; line-height:1.35}   /* block, not flex: the words wrap as one sentence */
.mrow{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.mbtn{background:var(--bg); border:1px solid var(--line); border-radius:14px; padding:12px 18px; font-weight:800; font-size:16px; box-shadow:var(--shadow); display:flex; align-items:center; gap:8px}
.mbtn:active{transform:scale(.95)}
.mbtn.go{background:var(--ink); color:var(--card); border:1px solid var(--ink)}
.mbtn[disabled]{opacity:.4}
.palette{display:flex; gap:8px; flex-wrap:wrap; margin-left:4px}
.palette button{font-size:30px; width:52px;height:52px; border-radius:14px; background:var(--bg); border:1px solid var(--line)}
.palette button.sel{box-shadow:0 0 0 3px var(--ink)}
.namein{font-family:inherit; font-size:17px; font-weight:700; padding:11px 14px; border-radius:14px; border:1px solid var(--ink-soft); background:var(--bg); color:var(--ink); width:150px}
footer{color:var(--ink-soft); font-size:14px; text-align:center; padding:14px 0 20px; font-weight:600; border-top:1px solid var(--line)}
footer a{color:var(--rubric); font-family:var(--display); font-weight:400; font-size:17px; display:inline-block; padding:10px 6px}

@media (max-width:560px){
  .say{padding:16px 18px; min-height:96px; gap:14px}
  .say .rest{font-size:19px}
  .replay{width:56px; height:56px; font-size:24px}
  .big{padding:22px 12px}
  .big .sub{font-size:15px; gap:7px}
  .big .sub i{width:12px; height:12px}
  .brand .dots i{width:9px; height:9px}
  .say .word{gap:12px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:10px}
  .tile .em{font-size:36px}.tile .w{font-size:17px}
  .keys{gap:6px}.key{height:70px;font-size:12px;padding:0 2px 7px}.key span{padding:2px 5px}
}
@media (prefers-reduced-motion:reduce){ *{animation:none !important; transition:none !important} }
</style>

<body>

<header>
  <div class="brand">
    <h1>Maya</h1>
    <span class="dots" aria-hidden="true">
      <i style="background:var(--n0)"></i><i style="background:var(--n1)"></i><i style="background:var(--n2)"></i>
      <i style="background:var(--n3)"></i><i style="background:var(--n4)"></i><i style="background:var(--n5)"></i><i style="background:var(--n6)"></i>
    </span>
  </div>
  <div class="spacer"></div>
  <button class="toggle" id="voiceBtn" aria-pressed="true">🔊 Voice <b id="voiceState">on</b></button>
</header>

<!-- the speaker's voice, made visible and read aloud -->
<section class="say" id="say" aria-live="polite">
  <div class="rest" id="sayRest">🌈 <span>Tap to talk</span></div>
  <div class="word" id="sayWord" hidden><span class="emoji" id="sayEmoji"></span><span id="sayText"></span></div>
  <div class="spacer"></div>
  <div class="beads" id="sayBeads" aria-hidden="true"></div>
  <button class="replay" id="replay" title="Say it again" aria-label="Say it again" hidden>🔁</button>
</section>

<!-- The whole product on day one -->
<section class="yesno">
  <button class="big no" data-word="no"  aria-label="No">
    <span class="glow"></span>
    <span class="lbl">No</span>
    <span class="sub"><i></i>do · red</span>
    <span class="arrow" aria-hidden="true">↓</span>
  </button>
  <button class="big yes" data-word="yes" aria-label="Yes">
    <span class="glow"></span>
    <span class="lbl">Yes</span>
    <span class="sub"><i></i>si · violet</span>
    <span class="arrow" aria-hidden="true">↑</span>
  </button>
</section>

<div class="h">Words</div>
<section class="grid" id="grid"></section>

<!-- Author: the speaker writes, not only is read (Kay); live and theirs (Ingalls) -->
<section class="make" id="make">
  <div class="top" id="makeTop">
    <h2>➕ Make a word</h2>
    <span class="chev">›</span>
  </div>
  <div class="body">
    <div class="keys" id="keys"></div>
    <div class="compose">
      <div class="beads" id="cbeads"></div>
      <span class="hint" id="chint">Press the colours to build a word — you’ll hear each one. Words you made show × while this is open.</span>
      <span class="spacer"></span>
      <span class="warn" id="cwarn" hidden></span>
    </div>
    <div class="mrow">
      <button class="mbtn" id="cplay">▶ Hear it</button>
      <button class="mbtn" id="cundo">⌫ Back</button>
      <span class="palette" id="palette" aria-label="pick a picture"></span>
      <input class="namein" id="cname" placeholder="name it" maxlength="14" aria-label="word name">
      <button class="mbtn go" id="ckeep" disabled>✓ Keep it</button>
    </div>
  </div>
</section>

<footer id="foot">Works with no internet · the words you make stay on this device · <a href="./index.html">Solresol</a></footer>

<script>
"use strict";
/* ---- notes: colour + pitch (C major, one octave) ---- */
const NOTE_NAMES = ["do","re","mi","fa","sol","la","si"];
const COLORS = ["--n0","--n1","--n2","--n3","--n4","--n5","--n6"].map(v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim());
const FREQ  = [261.63,293.66,329.63,349.23,392.00,440.00,493.88];  // do..si
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

/* ---- vocabulary: whole tiles, safe by place + picture + colour + speech.
        (note-distance safety is enforced in Make-a-word, where slips happen.) ---- */
const CORE = [
  {w:"want",   e:"👉", c:[1,2,2]},
  {w:"more",   e:"🔁", c:[5,2,5,1]},
  {w:"stop",   e:"✋", c:[3,0]},
  {w:"all done",e:"✅", c:[0,0,1]},
  {w:"wait",   e:"⏳", c:[0,1,2]},
  {w:"help",   e:"🆘", c:[0,6,0]},
  {w:"hurt",   e:"🤕", c:[2,1,6,3]},
  {w:"eat",    e:"🍽️", c:[0,5,2,6]},
  {w:"drink",  e:"🥤", c:[3,4,5]},      // re-separated from eat: rising, watery
  {w:"toilet", e:"🚽", c:[1,0,5,0]},
  {w:"tired",  e:"😴", c:[4,3,1]},
  {w:"love",   e:"❤️", c:[2,1,0]},
  {w:"play",   e:"🧸", c:[4,5,4,5]},
  {w:"happy",  e:"😊", c:[4,6,4]},
  {w:"sad",    e:"😢", c:[3,1,0]},
  {w:"music",  e:"🎵", c:[4,3,2,1]},
  {w:"outside",e:"🌳", c:[2,4,6]},
  {w:"hello",  e:"👋", c:[0,2,3]},
  {w:"mom",    e:"👩", c:[5,3,5]},
  {w:"dad",    e:"👨", c:[0,3,0]},
];
const YES={w:"yes",e:"💜",c:[6]}, NO={w:"no",e:"❤️",c:[0]};
/* the words a slip must never land on */
const CRITICAL = [YES,NO,...CORE.filter(x=>["stop","help","hurt","eat","drink","toilet"].includes(x.w))];

/* ---- audio ---- */
let AC=null;
function audio(){ if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)(); } if(AC.state!=="running")AC.resume().catch(()=>{}); return AC; }
/* phones: sound only starts from a touch, and iPhones mute web audio on the
   silent switch unless the page plays as media. Unlock on every touch. */
const SILENT_WAV="data:audio/wav;base64,UklGRkQDAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YSADAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgA==";
let silentTag=null, primed=false;
function unlockAudio(){
  try{ if(navigator.audioSession) navigator.audioSession.type="playback"; }catch(e){}
  if(!navigator.audioSession && !silentTag && /iPhone|iPad|iPod/.test(navigator.userAgent)){
    silentTag=new Audio(SILENT_WAV); silentTag.loop=true; silentTag.volume=0.01; silentTag.setAttribute("playsinline","");
  }
  if(silentTag) silentTag.play().catch(()=>{});
  const a=audio();
  if(a.state!=="running") a.resume().catch(()=>{});
  if(!primed){ const s=a.createBufferSource(); s.buffer=a.createBuffer(1,1,22050); s.connect(a.destination); s.start(0); primed=true; }
}
["pointerdown","touchend","keydown"].forEach(ev=>window.addEventListener(ev,unlockAudio,{capture:true,passive:true}));
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible" && AC && AC.state!=="running") AC.resume().catch(()=>{});
  if(document.visibilityState==="hidden" && silentTag) silentTag.pause();
});

function tone(freq, t0, dur, bend){
  const ac=audio();
  const o=ac.createOscillator(), o2=ac.createOscillator(), g=ac.createGain();
  o.type="triangle"; o2.type="sine"; o2.detune.value=6;
  o.frequency.setValueAtTime(freq,t0); o2.frequency.setValueAtTime(freq,t0);
  if(bend){ const f2=freq*Math.pow(2,bend/12); o.frequency.linearRampToValueAtTime(f2,t0+dur*.9); o2.frequency.linearRampToValueAtTime(f2,t0+dur*.9); }
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(0.32,t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); o2.connect(g); g.connect(ac.destination);
  o.start(t0); o2.start(t0); o.stop(t0+dur+.05); o2.stop(t0+dur+.05);
}
function playCode(code, bend){
  const ac=audio(); let t=ac.currentTime+0.02; const step=code.length>1?0.19:0.42;
  code.forEach((n,i)=>{ const b = bend!==undefined ? bend : 0; tone(FREQ[n], t, step*0.95, code.length===1?b:0); t+=step; });
}
function playNote(n){ tone(FREQ[n], audio().currentTime+0.01, 0.5); }

/* ---- speech: the family across the room understands, no manual ---- */
let VOICE_ON=true, VOICES=[];
function loadVoices(){ VOICES=window.speechSynthesis? speechSynthesis.getVoices():[]; }
if(window.speechSynthesis){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
function speak(text){
  if(!VOICE_ON||!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.rate=0.92; u.pitch=1.06;
  const v=VOICES.find(v=>/en/i.test(v.lang)&&/(female|samantha|karen|moira|google us)/i.test(v.name))||VOICES.find(v=>/en/i.test(v.lang));
  if(v)u.voice=v;
  speechSynthesis.speak(u);
}

/* ---- saying a word: sound + colour + voice + made visible ---- */
const say=document.getElementById("say"), sayRest=document.getElementById("sayRest"),
      sayWord=document.getElementById("sayWord"), sayEmoji=document.getElementById("sayEmoji"),
      sayText=document.getElementById("sayText"), sayBeads=document.getElementById("sayBeads"),
      replay=document.getElementById("replay");
let LAST=null;
function beadsInto(el,code,aria){ el.innerHTML=""; code.forEach(n=>{ const i=document.createElement("i"); i.style.background=COLORS[n]; el.appendChild(i); }); }
function render(item, bend){
  LAST={item,bend};
  sayRest.hidden=true; sayWord.hidden=false; replay.hidden=false;
  sayEmoji.textContent=item.e; sayText.textContent=item.w;
  beadsInto(sayBeads,item.c);
  say.classList.remove("pop"); void say.offsetWidth; say.classList.add("pop");
  playCode(item.c, bend); speak(item.w);
}
replay.addEventListener("click", ()=>{ if(LAST) render(LAST.item, LAST.bend); });

/* ---- YES / NO ---- */
document.querySelectorAll(".big").forEach(b=>{
  b.addEventListener("pointerdown", ()=>{
    const yes=b.dataset.word==="yes"; b.classList.remove("lit"); void b.offsetWidth; b.classList.add("lit");
    render(yes?YES:NO, yes?+2:-2);   // yes rises, no falls — contour as a fourth channel
  });
});

/* ---- word grid ---- */
const grid=document.getElementById("grid");
function tileEl(item, isMine){
  const t=document.createElement("button"); t.className="tile"+(isMine?" mine":""); t.setAttribute("aria-label",item.w||"word");
  const hl = COLORS[item.c[0]];
  t.innerHTML = `<span class="em">${item.e}</span><span class="w"></span><span class="beads"></span>`+(isMine?`<span class="pin">★</span><span class="del" role="button" aria-label="remove this word">×</span>`:``);
  t.querySelector(".w").textContent = item.w||"";   // names are typed by people: never parse them as HTML
  beadsInto(t.querySelector(".beads"), item.c);
  if(isMine) t.querySelector(".del").addEventListener("pointerdown", e=>{
    e.stopPropagation();
    if(!confirm(`Remove ${item.e} ${item.w||"this word"}?`)) return;
    saveMine(mine().filter(x=>x.c.join()!==item.c.join()));
    renderGrid();
  });
  t.addEventListener("pointerdown", e=>{ if(e.target.classList.contains("del")) return; t.style.setProperty("--hl",hl); t.classList.add("lit"); setTimeout(()=>t.classList.remove("lit"),260); render(item); });
  return t;
}
function renderGrid(){
  grid.innerHTML="";
  CORE.forEach(x=>grid.appendChild(tileEl(x,false)));
  mine().forEach(x=>grid.appendChild(tileEl(x,true)));
}

/* ---- your saved words (local, offline) ---- */
const KEY="maya-words-v1";
function mine(){ try{ return JSON.parse(localStorage.getItem(KEY)||"[]"); }catch(e){ return []; } }
function saveMine(list){ localStorage.setItem(KEY, JSON.stringify(list)); }

/* ---- Make a word (author + live safety floor) ---- */
const make=document.getElementById("make"), keys=document.getElementById("keys"),
      cbeads=document.getElementById("cbeads"), chint=document.getElementById("chint"),
      cwarn=document.getElementById("cwarn"), cplay=document.getElementById("cplay"),
      cundo=document.getElementById("cundo"), ckeep=document.getElementById("ckeep"),
      cname=document.getElementById("cname"), palette=document.getElementById("palette");
let build=[], chosenEmoji="⭐";
const EMOJI=["⭐","❤️","🍪","🎈","🐶","🎵","🚗","🌈","🧸","🍎","☀️","🎨"];

document.getElementById("makeTop").addEventListener("click",()=>{
  make.classList.toggle("open");
  const open=make.classList.contains("open");
  document.body.classList.toggle("editing", open);   // your words show × while this is open
  if(open)audio();
});
NOTE_NAMES.forEach((nm,n)=>{
  const k=document.createElement("button"); k.className="key"; k.style.background=COLORS[n]; const lab=document.createElement("span"); lab.textContent=nm; k.appendChild(lab);
  k.setAttribute("aria-label",nm);
  k.addEventListener("pointerdown",()=>{ if(build.length>=7)return; build.push(n); playNote(n); refreshBuild(); });
  keys.appendChild(k);
});
EMOJI.forEach((e,i)=>{ const b=document.createElement("button"); b.textContent=e; if(i===0)b.classList.add("sel");
  b.addEventListener("click",()=>{ chosenEmoji=e; palette.querySelectorAll("button").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); }); palette.appendChild(b); });

const escapeHTML = t => t.replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function edit(a,b){ const n=a.length,m=b.length; const d=Array.from({length:n+1},(_,i)=>[i,...Array(m).fill(0)]);
  for(let j=0;j<=m;j++)d[0][j]=j;
  for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[n][m]; }
function nearestCritical(code){ let best=null; for(const x of CRITICAL){ const e=edit(code,x.c); if(!best||e<best.e)best={x,e}; } return best; }
function nearestAny(code){ const all=[YES,NO,...CORE,...mine()]; let best=null; for(const x of all){ const e=edit(code,x.c); if(!best||e<best.e)best={x,e}; } return best; }

function refreshBuild(){
  cbeads.innerHTML=""; build.forEach(n=>{ const i=document.createElement("i"); i.style.background=COLORS[n]; cbeads.appendChild(i); });
  chint.style.display = build.length? "none":"";
  ckeep.disabled = build.length===0;
  // live safety floor: warn if this is one slip from a word that must stay distinct
  cwarn.hidden=true;
  if(build.length){
    const nc=nearestCritical(build);
    if(nc.e===0){ cwarn.hidden=false; cwarn.innerHTML=`⚠️ that’s already ${nc.x.e} <b>${nc.x.w}</b>`; ckeep.disabled=true; }
    else if(nc.e<=1){ cwarn.hidden=false; cwarn.innerHTML=`⚠️ close to ${nc.x.e} <b>${nc.x.w}</b> — add a note to keep them apart`; }
  }
}
cplay.addEventListener("click",()=>{ if(build.length)playCode(build); });
cundo.addEventListener("click",()=>{ build.pop(); refreshBuild(); });
ckeep.addEventListener("click",()=>{
  if(!build.length)return;
  const na=nearestAny(build);
  if(na.e===0){ cwarn.hidden=false; cwarn.innerHTML=`⚠️ that’s already ${na.x.e} <b>${escapeHTML(na.x.w||"a word")}</b>`; return; }
  const list=mine();
  list.push({w:(cname.value.trim()||""), e:chosenEmoji, c:build.slice()});
  saveMine(list);
  build=[]; cname.value=""; refreshBuild(); renderGrid();
  render(list[list.length-1]);   // celebrate: say the new word
});

/* ---- voice toggle ---- */
const voiceBtn=document.getElementById("voiceBtn"), voiceState=document.getElementById("voiceState");
voiceBtn.addEventListener("click",()=>{ VOICE_ON=!VOICE_ON; voiceState.textContent=VOICE_ON?"on":"off"; voiceBtn.setAttribute("aria-pressed",VOICE_ON);
  voiceBtn.firstChild.textContent=VOICE_ON?"🔊 Voice ":"🔈 Voice "; if(VOICE_ON)speak("yes"); });

/* ---- go ---- */
renderGrid(); refreshBuild();
</script>
</body>
</html>
